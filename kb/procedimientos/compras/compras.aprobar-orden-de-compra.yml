verificacion:
  - texto: "La orden de compra aprobada pasa al módulo de Almacenes y se visualiza en el escenario de Ingreso, en Ingreso por Orden de Compra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s051, web-https-documentacion-s10peru-com-manual-d-s050]
errores_frecuentes:
  - sintoma: "No puede aprobar la orden de compra."
    solucion: "El aprobador debe tener atributos y estar en el rango de montos para aprobar."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s050]
  - sintoma: "No puede enviar la orden de compra a aprobación."
    solucion: "Solo la persona que generó la orden de compra la envía a aprobación, y solo cuando se encuentra en estado registrado."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s050]
  - sintoma: "Aparece el mensaje «No existe grupo de aprobadores»."
    solucion: "No se han definido los grupos de aprobadores para el Centro de Compra, o los grupos no están en el rango de la Orden de Compra: vaya a datos generales y registre los grupos de aprobadores."
    fuente: [img-27049c7738f4-0000, web-https-documentacion-s10peru-com-manual-d-s049]
  - sintoma: "Necesita modificar o eliminar una orden de compra."
    solucion: "La orden de compra en estado registrado puede ser modificada o eliminada."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s050]
