errores_frecuentes:
  - sintoma: "El recurso aparece entre los recursos con problemas."
    solucion: "El error se genera cuando la fecha del documento de egreso se modifica a una fecha anterior a la del ingreso, o cuando se borra la guía de ingreso. Visualice los recursos con problemas, haga doble clic sobre el recurso y, en la guía de egreso que muestra el sistema, modifique la fecha a una posterior."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s087]
  - sintoma: "Durante el recosteo el sistema solicita el factor de cambio."
    solucion: "El recosteo utiliza el factor de cambio; si no está registrado, el sistema solicita su ingreso: regístrelo para continuar."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s081]
