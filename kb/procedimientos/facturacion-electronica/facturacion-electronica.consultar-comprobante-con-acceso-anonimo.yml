id: facturacion-electronica.consultar-comprobante-con-acceso-anonimo
version: 1
modulo: facturacion-electronica
titulo: "Consultar un comprobante electrónico con el Acceso Anónimo del portal"
objetivo: "Permitir que un usuario no registrado en el portal visualice y descargue en PDF o XML un documento enviado a SUNAT desde el S10 ERP."
nivel: basico
preguntas:
  - "mi cliente no tiene usuario en el portal, como ve su factura"
