id: administrativo.canjear-documentos-con-letras
version: 1
modulo: administrativo
titulo: "Canjear con letras los documentos por pagar de un proveedor"
objetivo: "Registrar una orden de pago tipo Canje con Letras por proveedor con sus documentos pendientes, configurar las letras emitidas por el proveedor, aprobarla y ejecutar el canje desde Pendientes de Pago, para que se generen automáticamente las Letras Únicas de Cambio en Documentos por Pagar."
nivel: avanzado
preguntas:
  - "como canjeo facturas por letras de un proveedor"
  - "el proveedor nos acepto pagar en letras, como hago el canje en s10"
  - "orden de pago canje con letras por proveedor como se registra"
  - "donde configuro las letras que emitio el proveedor"
  - "como ejecuto el canje con letras en pendientes de pago"
  - "canje de documentos con letra unica de cambio"
  - "donde veo las letras generadas despues del canje"
  - "canje con letras no me pide cuenta bancaria es normal?"
aliases:
  - "canje con letras"
  - "canjear con letras"
  - "orden de pago canje con letras"
  - "letra única de cambio"
  - "canje por proveedor"
