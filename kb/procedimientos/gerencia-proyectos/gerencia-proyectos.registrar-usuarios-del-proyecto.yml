    id: "gerencia-proyectos.registrar-usuarios-del-proyecto#1"
    accion: "Con el usuario **sa**, ingrese a **Catálogos** – **Socio de negocios** y, en la rama empleados, registre al usuario que manejará el módulo de Gerencia de proyectos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s032]
    pagina: null
  - n: 2
    id: "gerencia-proyectos.registrar-usuarios-del-proyecto#2"
    accion: "Vaya al grupo de **Utilitarios**, escenario de **Mantenimiento de usuarios**, registre al usuario con acceso al módulo de Gerencia de proyectos y asígnele accesos y atributos de uso."
