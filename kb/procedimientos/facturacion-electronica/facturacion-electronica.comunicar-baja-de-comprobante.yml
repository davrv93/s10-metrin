  - texto: "Para boletas de venta: pueden o no haber sido informadas a SUNAT en el RESUMEN DIARIO; si lo fueron, ese resumen debe haber sido aceptado."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s011]
