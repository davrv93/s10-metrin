id: nominas.registrar-cese-del-trabajador
version: 1
modulo: nominas
titulo: "Registrar la fecha de cese de un trabajador"
objetivo: "Registrar en la pestaña Ingresos de la ficha la fecha de cese y su motivo, que es tomada para la liquidación y a partir de la cual el trabajador ya no está disponible en los tareos de mano de obra."
