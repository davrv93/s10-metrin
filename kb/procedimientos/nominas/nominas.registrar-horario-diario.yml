  - "como registro el horario de los obreros de lunes a viernes"
  - "como pongo el bloque de jornada normal de 7:30 a 4 pm"
  - "como configuro el permiso no autorizado en el horario"
  - "donde registro el horario de los sabados"
  - "que diferencia hay entre horario diario y horario ciclico"
  - "como agrego bonos al horario diario"
  - "orario diario con tardanzas y tolerancias por reloj marcador"
