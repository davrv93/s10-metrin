id: facturacion.cambiar-titular-sperant
version: 1
modulo: facturacion
titulo: "Cambiar el titular de una venta inmobiliaria con minuta (Sperant – S10)"
objetivo: "Registrar en Sperant el nuevo titular del inmueble y, en el escenario Cambio de Titularidad y/o Inmueble del S10, generar la facturación que cierra la orden de venta original con una nota de crédito y convierte la nueva en orden de venta con la boleta vinculada."
nivel: avanzado
preguntas:
  - "cómo hago un cambio de titular de un departamento vendido"
  - "el cliente le cede su depa a otra persona, como cambio el titular en sperant y s10"
  - "cambio de titularidad con minuta como se hace"
  - "donde genero la facturacion del cambio de titular en s10"
  - "no me deja hacer el cambio de titular, que me falta"
  - "como cambio el titular de la proforma en sperant"
  - "que pasa con la boleta y la orden de venta original cuando cambio de titular"
  - "cambio de titulr inmueble no aparece generar facturacion"
aliases:
  - "cambio de titular"
  - "cambiar titular"
  - "cambio de titularidad"
  - "nuevo titular del inmueble"
  - "cambio de titular con minuta"
entidades:
  modulo: "Facturación"
  pantallas: ["Cambio de Titularidad y/o Inmueble", "Boletaje", "Documentos de ventas"]
  objetos: ["orden de venta", "titular", "proforma", "boleta", "nota de crédito", "abono", "minuta"]
prerrequisitos:
  - texto: "Todos los abonos enviados desde el Sperant a S10 deben estar boletados: si uno de los abonos cuenta con boleta, los demás abonos también deben estar boleteados."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s000, web-https-documentacion-s10peru-com-cambio-d-s001]
  - texto: "La minuta debe haberse enviado al S10: la opción Enviar Minuta se activa cuando se cumplen los flujos de proceso de Separación y Venta subiendo el Contrato y/o Minuta."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s000]
  - texto: "El tipo de documento nota de crédito se toma de la configuración de facturación."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s002]
