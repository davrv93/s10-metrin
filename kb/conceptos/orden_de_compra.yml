id: orden_de_compra
termino: "Orden de compra"
sinonimos: ["órdenes de compra", "OC"]
definicion: "Documento por el cual se ordena la adquisición de un recurso."
en_s10: "Se genera en el módulo de Compras, directamente desde un pedido de compra o desde el escenario de Orden de compra (a partir de un pedido o de una cotización), y solo se aprueba en el escenario de Orden de compra. Solo las órdenes aprobadas pasan al módulo de Almacenes, donde se ingresan con el Ingreso por orden de compra [IOC]."
