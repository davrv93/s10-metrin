id: almacenes.registrar-documento-por-pagar
version: 1
modulo: almacenes
titulo: "Registrar un documento por pagar"
objetivo: "Registrar en el escenario de Documentos por Pagar los documentos por pagar, como facturas, boletas de venta o tickets, y relacionarlos con un movimiento previamente efectuado en ingresos."
nivel: intermedio
preguntas:
  - "cómo registro una factura del proveedor en documentos por pagar"
  - "donde ingreso las boletas y tickets por pagar en almacenes"
  - "como registro una factura de compra directa que no tiene orden de compra"
  - "como relaciono la factura con el ingreso por compra que ya hice"
  - "documentos por pagar s10 como se llena el formulario"
  - "como registro el recibo de luz que llega todos los meses, hay plantilla?"
  - "no me deja eliminar un documento por pagar"
  - "como cargo una factura a un centro de costo y no al proyecto"
  - "como ago para registrar una boleta de venta por pagar"
aliases:
  - "documentos por pagar"
  - "registrar factura por pagar"
  - "registrar documento de pago"
  - "factura de proveedor"
  - "plantilla de cargo"
entidades:
  modulo: "Almacenes"
  pantallas: ["Documentos por Pagar", "Sucursales", "Catálogo de Plantillas de Cargo"]
  objetos: ["documentos por pagar", "factura", "boletas de venta", "proveedor", "forma de pago", "ingreso por compra", "orden de compra", "centro de costo", "asiento contable"]
prerrequisitos:
  - texto: "Para relacionar el documento con un ingreso, el movimiento de ingreso debe estar efectuado previamente en el escenario de ingresos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
  - texto: "Los datos que se eligen de un catálogo, como el proveedor, deben existir: en caso de que no exista, regístrelo previamente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
pasos:
  - n: 1
    id: "almacenes.registrar-documento-por-pagar#1"
    accion: "En **Sucursales**, elija una sucursal para registrar información y luego **Documentos por pagar**."
    fuente: [img-c2a8ff9d2804-0000, web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
    fotos:
      - id: "3f19b128eabd"
        ruta_o_url: "imagenes/manual-de-almacenes/c2a8ff9d2804.png"
        pagina: null
        ocr: "Sucursales\n— =). Escritorio\nee i4@ S10 5.4\nme fe\nDocumentos Bandeja\npor pagar Luego, Central"
  - n: 2
    id: "almacenes.registrar-documento-por-pagar#2"
    accion: "En la ventana **Documentos por Pagar**, elija la **Empresa** y el **Documento** que va a registrar (factura, boleta de venta, liquidación de compra…)."
    fuente: [img-f940983961b9-0000, web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
    fotos:
      - id: "73e80165eff4"
        ruta_o_url: "imagenes/manual-de-almacenes/f940983961b9.png"
        pagina: null
        ocr: "Documentos por Pagar\nEmpresa [02100001 |S10S.4. | Mi) Documenta| 001 FACTURA qi\n003 BOLETAS DE VENTA,\n004 LIQUIDACIONES DE COMPRA\n005 BOLETAS DE COMPANIAS DE AVIACION\n015 DOCUMENTO INTERNO-"
  - n: 3
    id: "almacenes.registrar-documento-por-pagar#3"
    accion: "Haga clic derecho y elija **Adicionar** para adicionar un documento de pago y mostrar el formulario de ingreso."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093, img-409d743378c1-0000]
    pagina: null
    fotos:
      - id: "38a656df80b2"
        ruta_o_url: "imagenes/manual-de-almacenes/409d743378c1.png"
        pagina: null
        ocr: "BY #\nN° Correlativo |Proyecto Fecha Yencimiento |Serie |N° Documento |Proveedor Moneda | Forma de P:\nClic derecho DO Adicionar F2 fa)\n[) Adicionar desde plantilla de cargo ~b)"
  - n: 4
    id: "almacenes.registrar-documento-por-pagar#4"
    accion: "En el formulario de ingreso, use el botón y del catálogo elija al proveedor."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
  - n: 5
    id: "almacenes.registrar-documento-por-pagar#5"
    accion: "Registre la fecha de registro del documento, la fecha de cancelación, la fecha que recibió el documento del proveedor y la fecha del periodo contable para el documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
  - n: 6
    id: "almacenes.registrar-documento-por-pagar#6"
    accion: "Elija el tipo de moneda."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
  - n: 7
    id: "almacenes.registrar-documento-por-pagar#7"
    accion: "Use el botón y elija la forma de pago; si no existe, regístrela en el catálogo de formas de pago."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
    fotos:
      - id: "599da3c1c993"
