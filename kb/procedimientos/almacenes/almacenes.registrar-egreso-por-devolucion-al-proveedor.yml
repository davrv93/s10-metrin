id: almacenes.registrar-egreso-por-devolucion-al-proveedor
version: 1
modulo: almacenes
titulo: "Devolver recursos al proveedor con un egreso por devolución"
objetivo: "Registrar la salida de los recursos que deben ser devueltos al proveedor (por ejemplo, porque no cumplen con las especificaciones técnicas o la calidad establecida): con un Egreso por Devolución al Proveedor si ingresaron por compra, o con un Egreso por Devolución por orden de Compra si ingresaron con un Ingreso por orden de Compra."
nivel: intermedio
preguntas:
  - "cómo devuelvo materiales al proveedor en almacenes"
  - "el proveedor mandó cemento en mal estado, cómo lo devuelvo en el sistema"
  - "como hago un egreso por devolucion al proveedor"
  - "como devuelvo recursos que entraron con orden de compra"
  - "el material no cumple las especificaciones, como registro la devolucion"
  - "qué precio toma la devolución al proveedor"
  - "me equivoque al pedir un material y ya lo ingrese, como se lo regreso al proveedor"
  - "egreso por devolucion por orden de compra edoc"
aliases:
  - "egreso por devolución al proveedor"
  - "devolución al proveedor"
  - "EDOC"
  - "egreso por devolución por orden de compra"
  - "devolver al proveedor"
entidades:
  modulo: "Almacenes"
  pantallas: ["Egresos"]
  objetos: ["proveedor", "recurso", "orden de compra", "precio promedio", "ingreso por compra"]
