prerrequisitos:
  - texto: "Antes de exportar los partes diarios a Excel, cree en su PC una carpeta «Partes de Equipo PC» donde se almacenarán los archivos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s219]
  - texto: "Para registrar interferencias, ingrese por CATALOGOS – INEFERENCIA y haga un registro previo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s219]
