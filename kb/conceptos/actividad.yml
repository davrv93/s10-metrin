definicion: "Porción de partida asignada a una fase del WBS."
en_s10: "Se prepara en el escenario de Actividades, que comparten los módulos de Presupuestos y Gerencia de proyectos; el conjunto de fases con sus actividades pasa al escenario del Cronograma por periodos, donde se programa el proyecto. En Gerencia de proyectos las actividades se asignan a las partidas de control, con lo que adquieren valor y recursos."
