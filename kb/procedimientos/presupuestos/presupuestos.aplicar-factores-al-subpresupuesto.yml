    accion: "En el árbol del escenario **Hoja del Presupuesto**, haga clic derecho sobre el nombre del presupuesto (afecta a todas sus partidas) o sobre un subpresupuesto (afecta solo a sus partidas) y elija **Factores de cantidad**."
