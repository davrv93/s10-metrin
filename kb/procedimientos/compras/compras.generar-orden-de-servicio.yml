    pagina: null
  - n: 6
    id: "compras.generar-orden-de-servicio#6"
    accion: "Elija la forma de pago, la moneda que se utiliza para la transacción y la empresa a la que se facturará el servicio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s061]
    pagina: null
  - n: 7
    id: "compras.generar-orden-de-servicio#7"
    accion: "Si corresponde, ingrese el porcentaje de descuento, que afecta a todos los precios (por ejemplo, 5 para indicar 5 %), o un monto fijo para redondear los decimales del total."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s061]
    pagina: null
  - n: 8
    id: "compras.generar-orden-de-servicio#8"
    accion: "Ingrese la fecha tope de vigencia de la oferta de precios y la fecha de inicio del servicio; el lugar donde se efectuará el servicio se toma de la dirección registrada en los datos del Proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s061]
    pagina: null
  - n: 9
    id: "compras.generar-orden-de-servicio#9"
    accion: "Elija la pestaña **Acumulado** e ingrese los precios ofertados por el proveedor; el precio del presupuesto es solo informativo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s061]
    pagina: null
  - n: 10
    id: "compras.generar-orden-de-servicio#10"
    accion: "Si necesita editar la cantidad total, ingrese a la pestaña **Detallado**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s062]
    pagina: null
  - n: 11
    id: "compras.generar-orden-de-servicio#11"
    accion: "Haga clic en **Aceptar** para grabar la Orden de Servicio y enviarla a aprobación."
