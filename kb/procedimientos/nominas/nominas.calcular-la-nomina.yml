  - texto: "En Nómina Detallada se visualizan los conceptos calculados por persona, con su número de variable, fórmula y valor."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s077]
errores_frecuentes:
  - sintoma: "Un dato nuevo no se toma en cuenta en el cálculo de la nómina."
    solucion: "Vuelva a generar el resumen de conceptos por Día y por Periodo cada vez que ingrese un dato nuevo en los escenarios involucrados en el resumen; en caso contrario no será tomado en cuenta para el cálculo de la nómina."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s072, web-https-documentacion-s10peru-com-manual-d-s073]
  - sintoma: "El proceso estándar no calcula el impuesto a la renta de quinta categoría."
    solucion: "Ese impuesto se encuentra en otro proceso: calcule el proceso Renta de Quinta Categoría siempre al final, para que pueda acumular los ingresos generados en el periodo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s075, web-https-documentacion-s10peru-com-manual-d-s076]
  - sintoma: "Necesita volver a calcular la nómina de un periodo ya cerrado."
    solucion: "Use la opción que permite reprocesar la nómina de un periodo ya cerrado: toma en cuenta los datos históricos y solo actualiza la fórmula si es necesario. Es un proceso correctivo que debe ser analizado antes de ser ejecutado."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s075]
