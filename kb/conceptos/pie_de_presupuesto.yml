id: pie_de_presupuesto
termino: "Pie de presupuesto"
sinonimos: ["diseño del pie de presupuesto"]
definicion: "En el presupuesto venta, es todo lo que va por debajo del costo directo, como los gastos generales, la utilidad y los impuestos. El presupuesto meta no tiene pie de presupuesto."
en_s10: "Se arma en el escenario del Pie de presupuesto (ventana Diseño pie de presupuesto), después de concluir y procesar el presupuesto. Por defecto muestra el costo directo: en la variable nDirecto el sistema acumula el monto presupuestado de mano de obra, materiales, equipos y subcontratos; el resto del pie se registra a mano, con fórmulas en la columna Macro. Para elaborar la fórmula polinómica hay que omitir en el pie el ítem del impuesto."
