# s10-conocimiento — todo el proyecto en un compose propio.
#
#   docker compose up -d --build              cortex + admin + programador + metrin
#   docker compose --profile llm up -d        además Ollama dentro del compose
#   docker compose --profile redis up -d      además Redis y su consola web (127.0.0.1:5540)
#   docker compose --profile biblioteca up -d además la biblioteca de PDFs (127.0.0.1:4770)
#   docker compose run --rm herramientas s10kb.py indexar      (cualquier script)
#
# Puertos solo en 127.0.0.1 del host:
#   4748 Cortex (tablero y API) · 4750 panel admin · 4760 chat de Metrín
#   4761 visor de trazas JEV · 5433 Postgres de trazas (TRAZAS_REPO=postgres)
#   6379 Redis · 5540 consola web de Redis (perfil «redis»)
#
# El código y los datos viven en esta carpeta y se montan en /app: lo que se agrega
# desde el panel queda en disco, igual que fuera de Docker.
name: s10-conocimiento

x-logs: &logs
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

x-base: &base
  build: .
  image: s10-conocimiento:dev
  volumes:
    - ./:/app
    - venv-linux:/app/.venv          # tapa el .venv de macOS (binarios que no corren en Linux)
  env_file:
    - path: .env
      required: false
  logging: *logs
  restart: unless-stopped

services:
  cortex:
    <<: *base
    command: ["sh", "/app/docker/cortex.sh"]
    ports: ["127.0.0.1:${S10_PUERTO_CORTEX:-4748}:4749"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:4748/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  admin:
    <<: *base
    command: ["python", "admin.py"]
    environment:
      ADMIN_HOST: 0.0.0.0
      S10_CORTEX_API: http://cortex:4749/api
      S10_CORTEX_HOST: localhost:4748     # Cortex rechaza otros Host (anti DNS-rebinding)
      CORTEX_URL_PUBLICA: http://localhost:${S10_PUERTO_CORTEX:-4748}
      S10_MOTOR: sdk                  # en Docker no hay CLI de Claude: tutoriales con ANTHROPIC_API_KEY de .env
    ports: ["127.0.0.1:${S10_PUERTO_ADMIN:-4750}:4750"]
    depends_on:
      cortex: { condition: service_healthy }

  # Actualiza las fuentes cada X horas (frecuencias en el panel) y lo registra en Cortex.
  programador:
    <<: *base
    command: ["python", "programador.py"]
    environment:
      S10_CORTEX_API: http://cortex:4749/api
      S10_CORTEX_HOST: localhost:4748
    depends_on:
      cortex: { condition: service_healthy }

  metrin:
    build: ./metrin
    image: s10-metrin:dev
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      # Conversacional con estilo Metrín: LLM_PROVIDER=mlx usa el mlx_lm.server
      # del Mac (GPU Apple, no corre en contenedor Linux) con el adaptador LoRA.
      # Arranca en el Mac: entrenamiento-metrin/.venv/bin/python -m mlx_lm.server
      #   --model mlx-community/Qwen2.5-3B-Instruct-4bit
      #   --adapter-path entrenamiento-metrin/artifacts/metrin-lora --port 8080
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      MLX_URL: ${MLX_URL:-http://host.docker.internal:8080}
      RAG_MAX_DISTANCIA: "0.80"
      # Decisiones JEV (vacío = sin decisiones; ver metrin/.env.example).
      # JEV_TRAZAS apunta al volumen compartido con el visor de trazas.
      JEV_URL: ${JEV_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      JEV_TRAZAS: ${JEV_TRAZAS:-/srv/trazas/trazas.jsonl}
      JEV_ORIGEN: ${JEV_ORIGEN:-metrin}
      JEV_ORIGEN_CHAT: ${JEV_ORIGEN_CHAT:-metrin-chat}
      # Modo traza del chat (1|true lo habilita; ver docs/CONTRATO-traza-metrin.md).
      METRIN_TRAZA: ${METRIN_TRAZA:-0}
      # V2 de Metrín (docs/V2-RAG-PROCEDURAL.md, «Despliegue»): DISPONIBLE por petición y por el selector de la
      # página (AGENT_V2_ENABLED=true), pero NO es la versión por defecto: AGENT_VERSION=v1 y AGENT_V2_PERCENTAGE=0.
      AGENT_VERSION: ${AGENT_VERSION:-v1}
      AGENT_V2_ENABLED: ${AGENT_V2_ENABLED:-true}
      AGENT_V2_PERCENTAGE: ${AGENT_V2_PERCENTAGE:-0}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-5}
      MAX_DECISION_CALLS: ${MAX_DECISION_CALLS:-4}
      MAX_SEARCH_ITERATIONS: ${MAX_SEARCH_ITERATIONS:-2}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-5}
      MAX_GENERATIONS: ${MAX_GENERATIONS:-1}
      MAX_REGENERATIONS: ${MAX_REGENERATIONS:-1}
      DECISION_TIMEOUT_MS: ${DECISION_TIMEOUT_MS:-1500}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-5000}
      DECISION_ENGINE: ${DECISION_ENGINE:-reglas}
      DECISION_MODEL: ${DECISION_MODEL:-}
      # Desde el contenedor, el servidor de decisiones de la Mac es host.docker.internal:8765.
      DECISION_URL: ${DECISION_URL:-}
      V2_TIPO_MODELO: ${V2_TIPO_MODELO:-/srv/modelos/clasificador-tipo-respuesta-candidato.json}
      V2_TIPO_UMBRAL: ${V2_TIPO_UMBRAL:-0.40}
      V2_TIPO_MARGEN: ${V2_TIPO_MARGEN:-0.08}
      V2_EVIDENCIA_MIN: ${V2_EVIDENCIA_MIN:-0}
      # Búsqueda híbrida y reranker ENCENDIDOS (servicio «reranker» de abajo; ver metrin/.env.example). Si el reranker
      # falta, falla o se pasa de RERANK_TIMEOUT_MS, la V2 sigue con el orden sin reranker y lo anota en la traza.
      V2_BUSQUEDA: ${V2_BUSQUEDA:-hibrida}
      RERANK_URL: ${RERANK_URL:-http://reranker:8080}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-3000}
      RERANK_TOP_N: ${RERANK_TOP_N:-20}
      RERANK_MAX_RUNAS: ${RERANK_MAX_RUNAS:-800}
      V2_RERANK_CLASES: ${V2_RERANK_CLASES:-fragmento,procedimiento,concepto}
    volumes:
      - ./kb:/kb:ro
      - ./data:/datos:ro
      - metrin-datos:/srv/datos
      - ./trazas/datos:/srv/trazas
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${S10_PUERTO_METRIN:-4760}:4760"]
    # Arranca con el reranker, pero no lo espera ni lo exige: sin él, la V2 se degrada sola.
    depends_on:
      reranker: { condition: service_started, required: false }
    logging: *logs
    restart: unless-stopped

  # Reranker local de la V2 (docs/V2-RAG-PROCEDURAL.md, «Despliegue»; metrin/eval/BUSQUEDA.md §11–12): llama.cpp
  # server con --reranking y bge-reranker-v2-m3 Q4_K_M (Apache-2.0). El modelo NO está en git ni en la imagen:
  #   sh metrin/descargar-reranker.sh        (una vez: 438 MB a metrin/modelos/reranker/, comprueba el sha256)
  # En Docker corre solo CPU (sin Metal ni GPU). Sin puerto en el host: metrin lo llama por la red del compose.
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/modelos/bge-reranker-v2-m3-Q4_K_M.gguf", "--reranking", "--host", "0.0.0.0", "--port", "8080",
              "--parallel", "1", "-c", "2048", "-b", "2048", "-ub", "2048", "--no-webui"]
    volumes:
      - ./metrin/modelos/reranker:/modelos:ro
    mem_limit: 1g        # pico medido 782 MiB (solo CPU, 20 candidatos × 800 runas); en reposo 370 MiB
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging: *logs
    restart: unless-stopped

  # Visor de trazas de decisiones JEV (trazas/): lee mocks, el JSONL
  # que emite metrin (TRAZAS_REPO=archivo) o Postgres (esquema
  # trazas/esquema.sql) por la misma abstracción; el API no cambia.
  trazas:
    <<: *base
    command: ["python", "trazas/trazas.py"]
    environment:
      TRAZAS_HOST: 0.0.0.0   # el visor escucha 127.0.0.1 por defecto
      TRAZAS_REPO: ${TRAZAS_REPO:-mock}
      TRAZAS_ARCHIVO: ${TRAZAS_ARCHIVO:-/app/trazas/datos/trazas.jsonl}
      TRAZAS_PG_DSN: ${TRAZAS_PG_DSN:-}
    ports: ["127.0.0.1:${TRAZAS_PUERTO:-4761}:4761"]
    depends_on:
      trazas-pg: { condition: service_healthy }

  # Postgres del visor de trazas. esquema.sql se aplica solo en el
  # primer arranque (el volumen de datos ya tiene las tablas).
  # DSN desde dentro del compose: metrin:metrin@trazas-pg:5432/trazas
  # (desde el host: localhost:5433).
  trazas-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metrin
      POSTGRES_PASSWORD: metrin
      POSTGRES_DB: trazas
    volumes:
      - trazas-pg-data:/var/lib/postgresql/data
      - ./trazas/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrin -d trazas"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logs
    restart: unless-stopped

  # Redis (opcional, perfil «redis»): docker compose --profile redis up -d redis redis-consola
  # El usuario «default» va apagado: solo entra REDIS_USUARIO con REDIS_CLAVE, que vienen del .env
  # (no se versionan; sin REDIS_CLAVE el contenedor no arranca). Desde el compose:
  # redis://<REDIS_USUARIO>:<REDIS_CLAVE>@redis:6379 · desde el host: 127.0.0.1:6379.
  redis:
    image: redis:8.2-alpine
    profiles: ["redis"]
    environment:
      REDIS_USUARIO: ${REDIS_USUARIO:-optimiza360}
      REDIS_CLAVE: ${REDIS_CLAVE:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - sh
      - -c
      - |
        test -n "$$REDIS_CLAVE" || { echo "Falta REDIS_CLAVE en .env" >&2; exit 1; }
        exec redis-server --appendonly yes --maxmemory "$$REDIS_MAXMEMORY" \
          --user default off --user "$$REDIS_USUARIO" on ">$$REDIS_CLAVE" "~*" "&*" "+@all"
    volumes: [redis-datos:/data]
    ports: ["127.0.0.1:${REDIS_PUERTO:-6379}:6379"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user \"$$REDIS_USUARIO\" --pass \"$$REDIS_CLAVE\" ping | grep -q PONG"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging: *logs
    restart: unless-stopped

  # Consola web de Redis (Redis Insight), con la conexión a «redis» ya dada de alta con el mismo
  # usuario y clave. No tiene login propio: escucha solo en 127.0.0.1 (en el EC2, por túnel SSH).
  redis-consola:
    image: redis/redisinsight:2.70
    profiles: ["redis"]
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: s10-redis
      RI_REDIS_USERNAME: ${REDIS_USUARIO:-optimiza360}
      RI_REDIS_PASSWORD: ${REDIS_CLAVE:-}
    volumes: [redis-consola:/data]
    ports: ["127.0.0.1:${REDIS_CONSOLA_PUERTO:-5540}:5540"]
    depends_on:
      redis: { condition: service_healthy }
    logging: *logs
    restart: unless-stopped

  # Biblioteca de PDFs por módulo (herramientas/biblioteca.py): solo lectura, perfil «biblioteca».
  #   docker compose --profile biblioteca up -d biblioteca   →   http://127.0.0.1:4770
  # La carpeta biblioteca/ no está en git (manuales del portal de miembros de S10): se genera en la Mac.
  biblioteca:
    image: nginx:alpine
    profiles: ["biblioteca"]
    volumes: ["./biblioteca:/usr/share/nginx/html:ro"]
    ports: ["127.0.0.1:${BIBLIOTECA_PUERTO:-4770}:80"]
    logging: *logs
    restart: unless-stopped

  # Ollama dentro del compose (opcional; por defecto Metrín usa el de la Mac).
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes: [ollama:/root/.ollama]
    logging: *logs
    restart: unless-stopped

  # Contenedor de un solo uso para correr scripts: docker compose run --rm herramientas <script> <args>
  herramientas:
    <<: *base
    profiles: ["tareas"]
    entrypoint: ["entrada.sh", "python"]
    restart: "no"
    environment:
      S10_CORTEX_API: http://cortex:4749/api
      S10_CORTEX_HOST: localhost:4748
      S10_MOTOR: sdk

volumes:
  venv-linux:
  metrin-datos:
  ollama:
  trazas-pg-data:
  redis-datos:
  redis-consola:
