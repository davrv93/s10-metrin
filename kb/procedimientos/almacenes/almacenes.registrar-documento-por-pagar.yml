  - n: 8
    id: "almacenes.registrar-documento-por-pagar#8"
    accion: "Ingrese la serie y el número del documento."
    resultado: "La celda del tipo de cambio toma el tipo de cambio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
  - n: 9
    id: "almacenes.registrar-documento-por-pagar#9"
    accion: "Registre el porcentaje de descuento considerado en la factura."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093]
    pagina: null
  - n: 10
    id: "almacenes.registrar-documento-por-pagar#10"
    accion: "En **Relacionado con**, elija la opción: **Ninguno** para compras directas como refrigerios, **Ingreso por Compra**, **Orden de Compra o Servicio**, **Subcontrato** (valorización de subcontrato) o **Ingreso Orden de Compra o Servicio**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s093, web-https-documentacion-s10peru-com-manual-d-s094, img-f33036651eeb-0000]
    pagina: null
