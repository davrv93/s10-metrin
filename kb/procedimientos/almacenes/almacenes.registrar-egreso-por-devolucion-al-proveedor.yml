    fuente: [web-https-documentacion-s10peru-com-manual-d-s073]
  - texto: "Con el Egreso por Devolución por orden de Compra solo se devuelve un recurso que ingresó con orden de compra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s075]
pasos:
