id: factura_electronica
termino: "Factura electrónica"
sinonimos: []
definicion: "Documento tributario en formato digital, disponible para todos los contribuyentes, que permite a las empresas emitir y recibir comprobantes de pago en lugar de la emisión en papel preimpreso."
en_s10: "S10 Facturación Electrónica es una aplicación web que permite enviar directamente a SUNAT los documentos por cobrar registrados en el módulo de Facturación y enviarlos luego a los clientes. La opción Enviar a SUNAT del escenario Documentos por cobrar se activa si el documento está relacionado con un talonario de emisión electrónica; la factura y sus notas de crédito y débito deben enviarse a más tardar dentro de los 7 días siguientes a la emisión, o serán rechazadas."
procedimientos_relacionados: [facturacion-electronica.configurar-emision-electronica, facturacion-electronica.enviar-comprobantes-a-sunat, facturacion-electronica.comunicar-baja-de-comprobante]
