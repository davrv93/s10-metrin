id: formula_polinomica
termino: "Fórmula polinómica"
sinonimos: ["fórmulas polinómicas"]
definicion: "Procedimiento convencional de cálculo para obtener el valor de los incrementos de costos que experimentan los presupuestos de obra en el tiempo. Al reemplazar los índices unificados del INEI da como resultado el factor de reajuste K, que actualiza el costo de la obra (o de su avance) desde la fecha del presupuesto base, en el proceso de valorización. En el Perú está constituida por hasta 8 monomios, cuyos coeficientes de incidencia suman uno."
en_s10: "Se elabora en el escenario de la Fórmula polinómica a partir del presupuesto venta, después de omitir en el pie el ítem del impuesto; si a un recurso le falta índice unificado, el sistema muestra una ventana para asignárselo. En la valorización del contrato, el reajuste por fórmula polinómica es un valor por periodo."
procedimientos_relacionados: [presupuestos.elaborar-formula-polinomica]
