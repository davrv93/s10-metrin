pasos:
  - n: 1
    id: "presupuestos.registrar-titulo-en-el-catalogo#1"
    accion: "Ingrese al catálogo de títulos por el menú **Catálogos** o haciendo clic derecho en la hoja del presupuesto y eligiendo **Adicionar Título**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s079, "7c40a9548710-0088"]
    pagina: null
  - n: 2
    id: "presupuestos.registrar-titulo-en-el-catalogo#2"
    accion: "En el **Catálogo de Títulos**, ubique el grupo de títulos, haga clic derecho y elija **Nuevo SubItem**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s079, img-e9116185bd41-0000, "7c40a9548710-0089"]
    pagina: null
    fotos:
      - id: "8d50e3034380"
