errores_frecuentes:
  - sintoma: "Al enviar una orden de compra aparece el mensaje «No existe grupo de aprobadores»."
    solucion: "No se han definido los grupos de aprobadores para el Centro de Compra, o los grupos no están en el rango de la Orden de Compra: vaya a datos generales y registre los grupos de aprobadores."
    fuente: [img-27049c7738f4-0000, web-https-documentacion-s10peru-com-manual-d-s049]
  - sintoma: "Hay demasiados aprobadores y la aprobación demora."
    solucion: "El exceso de aprobadores genera demora e incrementa los gastos de operación; con la aprobación en estrella, que permite varios aprobadores por grupo, basta que el primero que se entere del mensaje ingrese al módulo y apruebe."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s021]
