        pagina: null
        caption: "Esta sección permite administrar a los usuarios de la empresa que emite los documentos."
        ocr: "& Gestion de Usuarios (1)\n> Usuarios Empresa"
  - n: 2
    id: "facturacion-electronica.crear-usuario-del-portal#2"
    accion: "Para buscar un usuario, ingrese alguno de los campos de la ventana de búsqueda y haga clic en el botón **Buscar** (si no ingresa ningún dato, se listan todos los usuarios de la empresa)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
    fotos:
      - id: "7a05a90bfa93"
