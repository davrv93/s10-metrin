id: egreso_de_almacen
termino: "Egreso de almacén"
sinonimos: ["egreso", "egresos", "guía de egreso"]
definicion: "Movimiento de salida de los recursos que están en el stock del almacén hacia distintos destinos. Solo los recursos del stock pueden usarse en los egresos."
en_s10: "El más usado en la ejecución es el Egreso a partida de control [EPC]: el residente o el maestro de obra envían un pedido al almacén y el almacenero registra el egreso, con partida de control y, de forma adicional, destino específico, frente y equipo. Antes de un egreso, el manual indica recostear en el escenario de Stock. Las guías de remisión se generan solo a partir de egresos."
