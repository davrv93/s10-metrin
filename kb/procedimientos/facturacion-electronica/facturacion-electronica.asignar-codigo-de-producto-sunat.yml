id: facturacion-electronica.asignar-codigo-de-producto-sunat
version: 1
modulo: facturacion-electronica
titulo: "Asignar el código de producto SUNAT a los recursos"
objetivo: "Catalogar los recursos activos del S10 con el código de Producto SUNAT (estándar UNSPSC) que les corresponda, uno a uno o de forma masiva desde Excel, para que los libros electrónicos que lo usan no muestren observaciones."
nivel: intermedio
preguntas:
  - "cómo asigno el código de producto sunat a mis recursos"
  - "donde se pone el codigo UNSPSC de los materiales en s10"
  - "el libro electronico 13.1 me sale que el campo codigo producto sunat no puede ser nulo"
  - "como cargo masivo los codigos de producto sunat desde un excel"
  - "como le pongo codigo sunat a varios recursos a la ves"
  - "que configuracion activo para que pida el codigo de producto sunat"
  - "en que escenario de almacenes se catalogan los recursos con codigo sunat"
  - "qué columnas lleva el excel para importar códigos de producto sunat"
aliases:
  - "código de producto SUNAT"
  - "asignar código SUNAT"
  - "código UNSPSC"
  - "catalogar recursos SUNAT"
  - "importar códigos SUNAT"
entidades:
  modulo: "Facturación Electrónica"
  pantallas: ["Catálogo de Productos SUNAT", "Catálogo de recursos", "Configuración"]
  objetos: ["recursos", "código de producto SUNAT", "libros electrónicos", "Excel"]
