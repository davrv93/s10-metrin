verificacion: []
errores_frecuentes:
  - sintoma: "Al eliminar el registro de la resolución desaparecieron los valores de los índices unificados."
    solucion: "La opción Eliminar del menú de los datos de la resolución elimina el registro seleccionado y todo el contenido de la ventana donde se registran los valores de los índices unificados."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s118]
  - sintoma: "El índice unificado ingresado solo queda en la celda seleccionada y no en las demás zonas geográficas."
    solucion: "En la configuración, seleccione Réplica de Índices para todas las áreas: no seleccionado, el ingreso de datos sólo se efectúa en la celda seleccionada."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s018, "7c40a9548710-0188"]
  - sintoma: "No encuentra la opción de índices unificados."
    solucion: "Según la guía de usuario, la opción de índices unificados está implementada sólo en la versión corporativa."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s118, "7c40a9548710-0187"]
