# Conjunto de PRUEBA aparte del catálogo intenciones.yml. NUNCA entra al entrenamiento ni se copia de él: se redactó con
# otras palabras y, cuando se pudo, con otros términos de S10 que los del entrenamiento (el validador rechaza frases
# iguales tras normalizar y las casi iguales). SINTÉTICO: no hay mensajes reales de usuarios.
#
# Incluye a propósito los dos casos medidos en local el 06-10-2026 con el clasificador actual (defecto.json):
#   «¿qué es un metrado?»                          → salió social (0,569); lo correcto es consulta_concepto
#   «¿Cómo registro un nuevo presupuesto en S10?»   → quedó bajo el umbral (0,322 < 0,40); lo correcto es soporte_como_hacer
# Por eso el entrenamiento no tiene ninguna pregunta «qué es … metrado» ni «crear/registrar un presupuesto».
#
# `ninguno` (fuera de dominio y basura) mide los falsos positivos de la clase «ninguno» (ruido.yml), con frases distintas.

catalogo: intenciones_metrin
version: 1
sintetico: true
minimo_ejemplos: 8
casos_medidos:
  - {texto: "¿qué es un metrado?", esperado: consulta_concepto, actual: social, similitud_actual: 0.569}
  - {texto: "¿Cómo registro un nuevo presupuesto en S10?", esperado: soporte_como_hacer, actual: "trabajo (bajo umbral)", similitud_actual: 0.322}

