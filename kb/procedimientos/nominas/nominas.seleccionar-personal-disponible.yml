modulo: nominas
titulo: "Seleccionar el personal disponible y copiarlo a los proyectos destino"
objetivo: "Elegir en el escenario Personal Disponible del MULTIPROYECTO a los trabajadores ya registrados en el Catálogo de Socio de negocio y copiarlos a los proyectos de ejecución donde participan."
