id: almacenes.registrar-ingreso-por-inventario
version: 1
modulo: almacenes
titulo: "Registrar un ingreso por inventario"
objetivo: "Registrar en el almacén, con un Ingreso por Inventario [II], los recursos que encuentre al empezar a controlar un proyecto ya iniciado, para tener stock y poder hacer después los egresos."
nivel: basico
