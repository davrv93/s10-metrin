  - n: 3
    id: "gerencia-proyectos.registrar-subcontrato#3"
    accion: "Si antes realizó un pedido desde el almacén de servicios y generó una orden de servicio aprobada, use el botón para invocarla y que registre en forma automática los datos del subcontrato; caso contrario, llene manualmente los datos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
    pagina: null
  - n: 4
    id: "gerencia-proyectos.registrar-subcontrato#4"
    accion: "Complete la cabecera del subcontrato (descripción, subcontratista, moneda, especialidad, adelanto, retenciones y fechas)."
