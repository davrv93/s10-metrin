    pagina: null
  - n: 7
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#7"
    accion: "Elija al Administrador del Proyecto del catálogo de Socio de Negocio; se utiliza en los reportes del módulo de Nóminas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
    pagina: null
  - n: 8
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#8"
    accion: "En **Distribución de costos**, elija la partida de control NO CONTRIBUTORIO para cargar el costo de la mano de obra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
    pagina: null
  - n: 9
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#9"
    accion: "Si utiliza tareo por actividades, elija además la actividad para la partida de control NO CONTRIBUTORIO."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
    pagina: null
  - n: 10
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#10"
    accion: "Elija el número de decimales para el factor de relación, que será utilizado en el módulo de Valorizaciones."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
    pagina: null
  - n: 11
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#11"
    accion: "En **Gestión Inmobiliaria**, defina el tipo de proyecto: ninguno cuando el proyecto no sea inmobiliario, **Sperant** para integrarlo con el software Sperant, o inmobiliario sin integrarse a Sperant."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
    pagina: null
  - n: 12
    id: "gerencia-proyectos.configurar-datos-adicionales-del-proyecto#12"
    accion: "Use el botón para grabar los datos registrados en el escenario."
