id: gerencia-proyectos.registrar-usuarios-del-proyecto
version: 1
modulo: gerencia-proyectos
titulo: "Registrar usuarios del proyecto y asignarles atributos"
objetivo: "Invitar a otros usuarios a participar en el grupo de trabajo del proyecto y darles los permisos que necesitan para sus labores, como asignar techo, aprobar los incrementos y los pagos de los subcontratos."
