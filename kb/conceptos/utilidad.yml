id: utilidad
termino: "Utilidad"
sinonimos: []
definicion: "Porcentaje que se registra inicialmente en el pie de presupuesto y luego en el del contrato. Junto con los gastos generales y los impuestos, forma parte de lo que va por debajo del costo directo en el presupuesto venta."
en_s10: "En el pie de presupuesto se registra como un concepto propio; los gastos generales y la utilidad se cargan al índice unificado 39, Índice general de precios al consumidor."
