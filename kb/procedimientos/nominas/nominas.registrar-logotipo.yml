id: nominas.registrar-logotipo
version: 1
modulo: nominas
titulo: "Registrar un logotipo o una firma digital"
objetivo: "Registrar en el Catálogo de Logotipos el logotipo que identifica a la empresa, o la firma digital, para asignarlo en el catálogo de socio de negocios y que se muestre en los reportes impresos."
nivel: basico
