id: almacenes.registrar-partidas-de-control-del-proyecto
version: 1
modulo: almacenes
titulo: "Registrar las partidas de control del proyecto"
objetivo: "Registrar las Partidas de Control del proyecto, que agrupan las actividades para el control económico y se asignan a los recursos que egresan del almacén, y asignar a cada una su Partida de Control General de la empresa."
nivel: avanzado
preguntas:
  - "cómo creo las partidas de control de mi obra"
  - "como registro partidas de control para los egresos de almacen"
  - "no me aparece la partida de control al hacer la salida de materiales"
  - "como hago que solo salgan las partidas de control activas"
  - "cómo desactivo una partida de control que ya terminó"
  - "como asigno la partida de control general a la partida del proyecto"
  - "partidas de controll costos directos e indirectos como se registran"
  - "donde agrupo todas las partidas de encofrado en una sola"
aliases:
  - "registrar partidas de control"
  - "partidas de control del proyecto"
  - "crear partida de control"
  - "partidas de control activas"
  - "partida de control general"
entidades:
  modulo: "Almacenes"
