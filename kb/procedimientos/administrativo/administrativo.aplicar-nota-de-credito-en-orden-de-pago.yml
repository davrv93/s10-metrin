id: administrativo.aplicar-nota-de-credito-en-orden-de-pago
version: 1
modulo: administrativo
titulo: "Registrar una orden de pago con nota de crédito"
objetivo: "Cancelar documentos por pagar, total o parcialmente, usando como medio de pago notas de crédito registradas en el módulo de Facturación, mediante una orden de pago del módulo Administrativo."
nivel: intermedio
preguntas:
  - "cómo aplico una nota de crédito a una factura de proveedor en administrativo"
  - "como cancelo una factura con nota de credito"
  - "como hago una orden de pago con nota de credito"
  - "quiero usar solo una parte de la nota de credito para pagar"
  - "donde pongo el monto afectado de la nc"
  - "como cruzo la nc del proveedor con su factura en s10"
  - "no me aparece aprobar en la orden de pago con nota de credito"
  - "como imprimo la aplicacion de la nota de credito"
  - "aplicar nc a varias facturas del mismo proveedor"
aliases:
  - "aplicar nota de crédito"
  - "orden de pago con nota de crédito"
  - "aplicación de NC"
  - "cancelar factura con nota de crédito"
  - "notas de crédito afectadas"
entidades:
  modulo: "Administrativo"
  pantallas: ["Orden de Pago", "Notas de Crédito Afectadas", "Pendientes de Pago", "Pagos", "documentos por Pagar"]
  objetos: ["orden de pago", "nota de crédito", "factura", "socio negocio", "monto afectado"]
prerrequisitos:
