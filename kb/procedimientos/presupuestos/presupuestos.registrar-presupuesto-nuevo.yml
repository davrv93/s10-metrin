  - texto: "El cliente debe estar registrado en el catálogo de socios de negocio para poder elegirlo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s034]
  - texto: "Si va a indicar el tipo de obra, este debe estar registrado previamente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s033]
