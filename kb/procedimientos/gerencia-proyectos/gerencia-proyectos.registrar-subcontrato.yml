verificacion:
  - texto: "Una vez registrado, el subcontrato se muestra en el escenario de Subcontrato - De Obra, y se ingresa a él con doble clic."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s150, img-3c91874fc471-0000]
errores_frecuentes:
  - sintoma: "Puso selección en la celda REQUIERE GARANTIA? sin registrar el documento bancario de garantía."
    solucion: "No ponga selección en la celda REQUIERE GARANTIA?, salvo que registre el documento bancario de garantía."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
  - sintoma: "No ingresó el porcentaje de adelanto del subcontratista."
    solucion: "Use la opción de pagos a cuenta; en este caso el descuento es manual."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
  - sintoma: "No le permite registrar una cantidad mayor a la del presupuesto."
    solucion: "Cuando el proyecto tiene techo, las cantidades se pueden editar si el recurso será ejecutado por más de un subcontratista, pero no permite exceder de este techo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s147]
  - sintoma: "La fecha del subcontrato es posterior a la de sus valorizaciones."
    solucion: "La fecha del subcontrato debe ser anterior a las valorizaciones."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s144]
