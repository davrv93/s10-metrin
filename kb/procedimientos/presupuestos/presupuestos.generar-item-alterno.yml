modulo: presupuestos
titulo: "Generar el ítem alterno según el código de la partida o del título"
objetivo: "Generar en la columna Ítem Alterno de la hoja del presupuesto el ítem según el código con el que está registrada la partida o el título en el catálogo, ya que la columna ITEM no es editable."
