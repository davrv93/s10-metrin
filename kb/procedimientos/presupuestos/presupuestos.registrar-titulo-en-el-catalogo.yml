        pagina: null
        ocr: "*; Gai@loge d6 Tinos: 0150 TITULGG PARA SUBPRESUPUESTOS ara :\nOpciones 2?\nDo x BT Clic derecho be wom HAS ASH\noS Titles ite =\nEARTITULOS PARA SUBPRESUPUE: AIRARMIERIN -\n| APARATOS ¥ ACCESORIOS SANITARIOS [|_|\n) Nuevo Subltem |__|\n|"
  - n: 3
    id: "presupuestos.registrar-titulo-en-el-catalogo#3"
    accion: "En la ventana **Titulo**, ingrese el nombre del título en **Descripción** (por ejemplo, MUROS Y TABIQUES) y elija **Adicionar**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s079, img-f680eda4c70c-0000, "7c40a9548710-0089"]
    pagina: null
