aliases:
  - "centro de compra"
  - "registrar centro de compra"
  - "nuevo centro de compra"
  - "crear centro de compras"
entidades:
  modulo: "Compras"
  pantallas: ["Datos Generales", "Centro de Compra", "Catálogo de Proyectos"]
  objetos: ["centro de compra", "usuario", "responsable", "proyecto"]
prerrequisitos:
  - texto: "Los usuarios que manejarán el módulo deben estar registrados en el catálogo de socio de negocio y tener acceso al módulo desde el escenario de Mantenimiento de usuarios, en el grupo Utilitarios."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s016]
  - texto: "El sa es el encargado de registrar al usuario que manejará el módulo de Compras y Pedidos y a las personas que aprobarán los pedidos y las órdenes de compra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s013]
