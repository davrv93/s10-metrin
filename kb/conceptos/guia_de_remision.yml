id: guia_de_remision
termino: "Guía de remisión"
sinonimos: ["guías de remisión", "GRE"]
definicion: "Documento que se usa para trasladar bienes o recursos; es un documento preimpreso que requiere autorización de SUNAT."
en_s10: "En Almacenes la guía de remisión se genera solo a partir de un egreso, y el escenario Guías de remisión muestra, de forma informativa, las generadas en el proyecto. Cuando llegan recursos solo con guía de remisión (entregas parciales), se registra un Ingreso por compra y luego se regulariza con la factura. Las guías de remisión electrónicas (GRE) se generan con los servicios propios de SUNAT; para enlazarlas con S10 ERP hay que crear credenciales API REST en SUNAT Operaciones en línea."
procedimientos_relacionados: [almacenes.regularizar-ingreso-por-compra]
