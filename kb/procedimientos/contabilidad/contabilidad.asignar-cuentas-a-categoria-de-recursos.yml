id: contabilidad.asignar-cuentas-a-categoria-de-recursos
version: 1
modulo: contabilidad
titulo: "Asignar cuentas contables a una categoría de recursos"
objetivo: "Asignar una cuenta contable a una categoría de recursos para que cualquier recurso relacionado a esa categoría contabilice con la cuenta asignada a la categoría."
nivel: intermedio
preguntas:
  - "como asigno una cuenta contable a una categoria de recursos"
  - "quiero que todos los cementos se contabilicen en la misma cuenta"
  - "donde pongo la cuenta de inventario a la categoria"
  - "como uso la opcion asignar cuenta en asignacion de cuentas"
  - "asignar cuenta contable por categoria y tipo de costo"
  - "los materiales no contabilizan con la cuenta que quiero, como la asigno por categoria"
  - "como configuro la cuenta de compras de una categoria de recurso"
  - "categorias de recursos contabilidad s10 como se le pone cuenta"
  - "asignasion de cuentas tipo categoria"
aliases:
  - "asignar cuenta a categoría"
  - "cuentas por categoría de recursos"
  - "asignación de cuentas tipo categoría"
  - "cuenta contable de la categoría"
entidades:
  modulo: "Contabilidad"
  pantallas: ["Asignación de Cuentas", "Asignación de Categorías"]
  objetos: ["categoría", "recurso", "cuenta contable", "tipo de costo", "plan de cuentas", "esquema contable"]
prerrequisitos:
  - texto: "Las categorías deben estar configuradas en el catálogo de categorías, según el criterio de contabilización de los recursos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s024]
  - texto: "Las categorías deben estar relacionadas a los recursos con la opción **Asignar categoría**, en el escenario **Asignación de Categorías** del grupo Parámetros."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s025, web-https-documentacion-s10peru-com-manual-d-s038]
