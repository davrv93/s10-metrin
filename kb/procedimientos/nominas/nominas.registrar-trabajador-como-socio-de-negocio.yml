id: nominas.registrar-trabajador-como-socio-de-negocio
version: 1
modulo: nominas
titulo: "Registrar un trabajador como socio de negocio"
objetivo: "Registrar uno a uno, en el Catálogo de Socio de Negocio por tipo, a los obreros, empleados o practicantes que ingresan a la empresa: solo los trabajadores registrados en el catálogo pueden ser elegidos como personal disponible."
