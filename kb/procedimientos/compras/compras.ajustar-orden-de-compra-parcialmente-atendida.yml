  - "como hago que la orden de compra cuadre con la factura del proveedor"
  - "como devuelvo la cantidad pendiente de una orden de conpra"
  - "me quedo saldo pendiente en la orden de compra y no va a llegar"
  - "proveedor entrego menos de lo pedido como regularizo la oc"
