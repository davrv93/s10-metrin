modulo: almacenes
titulo: "Registrar un ingreso por compra con documento de pago"
objetivo: "Registrar un Ingreso por Compra [IC] en el que, al efectuar el movimiento, se registra la factura como documento que respalda el ingreso del recurso al almacén y se efectúa el asiento para contabilidad."
