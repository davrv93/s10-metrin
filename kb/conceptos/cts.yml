notas: "Definido por uso: las fuentes oficiales no traen una definición formal de CTS («X es…»); se describe solo por lo que dicen los manuales de Nóminas y Administrativo. La definición anterior («beneficio social derivado de una obligación legal…») salía del temario de una capacitación publicado en s10peru.com, una fuente de marketing que el quality gate rechaza, y se retiró el 06-10-2026."
