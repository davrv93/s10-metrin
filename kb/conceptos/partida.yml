id: partida
termino: "Partida"
sinonimos: ["partidas"]
definicion: "Registro de la hoja del presupuesto que se ubica bajo un título y lleva su metrado y su análisis de precios unitarios, que es su estructura de costo. Las partidas se registran en el catálogo de partidas, en forma directa o desde la hoja del presupuesto, antes de elegirlas para un presupuesto."
en_s10: "En la hoja del presupuesto, una partida puede ser propia de ese presupuesto (lo indica el ícono de una manito). En S10 solo se programan las partidas o las subpartidas, no los recursos."
