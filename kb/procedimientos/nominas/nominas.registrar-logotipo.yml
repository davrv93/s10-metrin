  - "como pongo el logo de la empresa en las boletas"
  - "donde se registra el logotipo en nominas"
  - "como subo la firma digital al s10"
  - "el logo no sale en el reporte, donde lo cargo"
  - "como defino la estructura del catalogo de logotipos"
  - "como cambio el logotipo de la constructora"
  - "quiero agregar un logotipo nuevo"
  - "logotipo y firma digitar para reportes de nominas"
aliases:
  - "logotipo"
  - "registrar logotipo"
  - "catálogo de logotipos"
  - "firma digital"
  - "logo de la empresa"
entidades:
  modulo: "Nóminas"
  pantallas: ["Catálogo de Logotipos", "Catalogo de Logotipos y Firmas Digitales"]
  objetos: ["logotipo", "firma digital", "socio de negocio", "reporte"]
