prerrequisitos:
  - texto: "Los recursos tipo activo que participan en la ejecución del proyecto, sean propios o de terceros, deben estar registrados en el catálogo de recursos; el recurso específico, de 14 dígitos, es el que se utiliza como activo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s149]
