        pagina: null
        ocr: "Relacionado[Nnguno\ncon Ninguno )\n( |ingreso por Compra\nOrden de Compra o Servicio =(-3)\nCG /Subcontrato\ningreso Orden de Compra o Servicio 43)"
  - n: 11
    id: "almacenes.registrar-documento-por-pagar#11"
    accion: "Indique a dónde se carga el documento: al proyecto (luego elija el proyecto), a un centro de costo personalizado ajeno a la empresa, o a ninguno cuando el gasto no está relacionado a ningún proyecto o centro de costo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s094]
    pagina: null
  - n: 12
    id: "almacenes.registrar-documento-por-pagar#12"
    accion: "En la pestaña donde se registran los recursos del documento, invoque al Catálogo de recursos y elija todos los recursos que formarán parte del documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s094]
