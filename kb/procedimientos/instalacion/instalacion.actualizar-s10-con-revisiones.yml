errores_frecuentes:
  - sintoma: "Aparece un error o mensaje indicando que no se pueden instalar las revisiones."
    solucion: "Verifique que tenga los permisos de Administrador, que el antivirus esté desactivado y que el Control de cuentas de usuario esté inactivo. De persistir los problemas, registre un ticket para un diagnóstico más completo."
    fuente: [web-https-documentacion-s10peru-com-actualiz-s000]
  - sintoma: "Tuvo problemas con una revisión."
    solucion: "No continúe instalando las siguientes revisiones: darán como resultado errores que conllevarán a una desinstalación."
    fuente: [web-https-documentacion-s10peru-com-actualiz-s001]
