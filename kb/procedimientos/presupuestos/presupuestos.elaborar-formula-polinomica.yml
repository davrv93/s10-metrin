verificacion:
  - texto: "El sistema muestra el mensaje «La formula polinomica esta correcta» al verificarla."
    fuente: [img-66137362e1e3-0000]
  - texto: "La fórmula cumple los requisitos para el Perú: hasta 8 monomios, coeficiente de incidencia mínimo de 5 centésimos por monomio y coeficientes con aproximación al milésimo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s063]
errores_frecuentes:
  - sintoma: "El sistema no muestra en forma automática el cuadro de diálogo para elaborar la fórmula polinómica."
    solucion: "Use el botón correspondiente: se usa sólo en el caso de que el sistema no muestre en forma automática el cuadro de diálogo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s063]
  - sintoma: "Dos monomios tienen el mismo símbolo."
    solucion: "Cambie los símbolos: no es permitido usar el mismo símbolo en dos monomios."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s068]
  - sintoma: "Un monomio no llega al factor mínimo de 0.05."
    solucion: "Agrúpelo con otros índices unificados registrando el mismo número de monomio (hasta 3 submonomios) hasta que la suma llegue o pase de 0.05."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s066]
