# Conjunto de PRUEBA del catálogo tipo_respuesta (modo de respuesta de la V2 de Metrín).
#
# Va APARTE y NUNCA entra al entrenamiento (tipo_respuesta.yml). Es SINTÉTICO, escrito a mano, y está redactado con
# otras palabras, otros verbos u otra estructura que el entrenamiento: no son paráfrasis triviales (no basta cambiar
# una tilde o un artículo). Mezcla los mismos estilos: correctos, coloquiales, con faltas y abreviaturas, cortos y
# largos, y referencias conversacionales etiquetadas por el tipo de respuesta que piden.
#
# Incluye tal cual los casos literales pedidos:
#   «como hago un metrado» → PROCEDURE      «como registro metrado» → PROCEDURE    «cómo modifico una partida» → PROCEDURE
#   «que es metrado» → CONCEPT              «no puedo guardar metrado» → TROUBLESHOOTING
#   «donde veo metrados» → NAVIGATION       «metrado s10» → UNKNOWN

