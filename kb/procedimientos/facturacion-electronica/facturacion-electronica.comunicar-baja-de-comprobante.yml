verificacion:
  - texto: "La comunicación de baja aparece en la lista con su fecha de baja, su estado (por ejemplo, Aceptado) y las observaciones de la respuesta."
    fuente: [img-cd4173cec7a8-0000, web-https-documentacion-s10peru-com-manual-d-s011]
errores_frecuentes:
  - sintoma: "Venció el plazo para dar de baja una factura."
    solucion: "La comunicación de baja de facturas se envía hasta 7 días contados desde el día en que el envío fue aceptado por la SUNAT."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s011]
  - sintoma: "Venció el plazo para dar de baja una boleta de venta."
    solucion: "Si la boleta no fue informada, el plazo es de 7 días contados desde el día siguiente de su generación; si fue informada, 7 días contados desde el día siguiente de la fecha de aceptación del resumen diario correspondiente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s011]
  - sintoma: "Quiere dar de baja en una sola comunicación documentos con distinta fecha de emisión."
    solucion: "Todos los documentos que se adicionen al documento de baja deben tener la misma fecha de emisión."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s011]
