id: fondo_rotatorio
termino: "Fondo rotatorio"
sinonimos: ["caja chica", "fondos rotatorios"]
definicion: "Llamado también caja chica, es una cantidad de dinero que se asigna al encargado de manejar esos fondos en el proyecto."
en_s10: "El sistema registra la asignación de los fondos y los documentos que sustentan la rendición, y al mismo tiempo el ingreso al almacén de los recursos. Desde el almacén del fondo rotatorio no se hacen pedidos: solo ingresos por compra con descarga directa o egreso, con partida de control y destino específico. En Facturación se registra en el grupo Por pagar, escenario Fondos rotatorios, y solo el responsable del fondo puede adicionar en el fondo que tiene asignado."
