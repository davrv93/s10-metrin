    pagina: null
  - n: 8
    id: "almacenes.registrar-tipo-de-documento#8"
    accion: "Para registrar el tipo de impuesto del documento, haga clic derecho en el segmento del impuesto y elija del Catálogo de impuestos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
    fotos:
      - id: "fc815ef1f41d"
