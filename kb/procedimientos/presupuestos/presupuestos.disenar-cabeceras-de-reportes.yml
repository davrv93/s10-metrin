    pagina: null
  - n: 2
    id: "presupuestos.disenar-cabeceras-de-reportes#2"
    accion: "Ingrese al escenario **Cabeceras para reportes**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s113, img-d3f350c99b03-0000, "7c40a9548710-0181"]
    pagina: null
    fotos:
      - id: "ab986e694347"
        ruta_o_url: "imagenes/manual-de-presupuestos/d3f350c99b03.png"
        pagina: null
