id: presupuestos.registrar-partida-en-el-catalogo
version: 1
modulo: presupuestos
titulo: "Registrar una partida nueva en el catálogo de partidas"
objetivo: "Registrar en el catálogo, dentro de un grupo propio de la empresa, una partida con sus datos, su rendimiento y los recursos de su análisis de precios unitarios."
nivel: intermedio
preguntas:
  - "cómo creo una partida nueva en el catálogo de partidas"
  - "como registro una partida que no existe en s10"
  - "como agrego partidas propias de mi empresa al catalogo"
  - "como registro el rendimiento de una partida"
  - "como armo el analisis de precios unitarios de una partida nueva"
  - "registrar grupo de partidas en el catalogo"
  - "que es partida estimada"
  - "como creo una partida nueba"
aliases:
  - "registrar partida"
  - "crear partida en el catálogo"
  - "registrar rendimiento de la partida"
entidades:
  modulo: "Presupuestos"
  pantallas: ["Catálogo de Partidas", "Partida"]
  objetos: ["partida", "grupo de partidas", "rendimiento", "cuadrilla", "recursos", "análisis de precios unitarios"]
prerrequisitos:
  - texto: "Se recomienda que cada empresa registre las partidas que acostumbre usar en un nuevo grupo del catálogo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
pasos:
  - n: 1
    id: "presupuestos.registrar-partida-en-el-catalogo#1"
    accion: "En el árbol del **Catálogo de Partidas**, registre un grupo nuevo para las partidas de su empresa e ingrese el nombre del grupo (por ejemplo, PARTIDAS DE R&R)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080, img-b9cf453ca05c-0000, img-e71ffa144f7f-0000]
    pagina: null
    fotos:
      - id: "2c6790564f17"
        ruta_o_url: "imagenes/manual-de-presupuestos/e71ffa144f7f.png"
        pagina: null
        ocr: "“a Partida [x]\nIngrese el nombre del grupo\nCédigo 30 [ss\nDescripcién —_|PARTIDAS DE R&R"
  - n: 2
    id: "presupuestos.registrar-partida-en-el-catalogo#2"
    accion: "Dentro del grupo, en el último nivel del árbol, registre la partida (por ejemplo, Encofrado de elevación caravista)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
    fotos:
      - id: "5ae80503bab5"
