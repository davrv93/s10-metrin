  - n: 5
    id: "gerencia-proyectos.registrar-proyecto#5"
    accion: "Escriba el nombre del proyecto (hasta 240 caracteres); se recomienda anteponer el número de contrato, orden de servicio o número de obra que se ejecuta en el año."
    donde: "Ventana Proyecto"
