  - n: 3
    id: "presupuestos.registrar-partida-en-el-catalogo#3"
    accion: "En la ventana **Partida**, deje el **código** autogenerado por el sistema o ingréselo usted (6 niveles de 2 caracteres)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080, img-61c68876ebc3-0000]
    pagina: null
    fotos:
      - id: "72682429dafb"
