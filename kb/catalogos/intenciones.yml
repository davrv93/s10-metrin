  solicitud_comparacion:
    descripcion: >-
      Pide la DIFERENCIA entre dos conceptos, documentos u opciones de S10 (meta vs venta, pedido vs orden de compra).
      Comparar DATOS de una obra (meta contra real) es un reporte: solicitud_reporte.
    especificacion: 12
    ruta: concepto
    accion: comparar_conceptos
    tipo_consulta: comparacion
    plantillas: [COMPARACION, SIN_EVIDENCIA]
    ejemplos:
