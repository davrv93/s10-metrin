  - "como creo un tipo de documento nuevo en almacenes"
  - "donde se registran los tipos de documento que usa la empresa"
  - "como registro una factura con igv 18% como tipo de documento"
  - "como le asigno el impuesto a un tipo de documento"
  - "quiero crear el documento recibo interno para el fondo rotatorio"
  - "como hago que el asiento contable salga por recurso y no por documento"
  - "tipo de documeto sunat como se configura en s10"
  - "no encuentro el documento que necesito en la lista, como lo agrego al catalogo"
