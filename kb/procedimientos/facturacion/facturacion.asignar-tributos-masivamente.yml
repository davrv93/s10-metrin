errores_frecuentes:
  - sintoma: "El comprobante no calcula la detracción."
    solucion: "El cálculo de la detracción aplica al usar el recurso configurado y siempre que supere los S/ 700.00, según la configuración de los ítems de detracción en el catálogo y el importe del comprobante."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s073]
  - sintoma: "No se aplica la percepción."
    solucion: "Para aplicar la percepción, el recurso debe estar configurado con los ítems de percepción y el socio de negocio debe estar calificado como Agente de Percepción."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s073]
