id: presupuestos.registrar-presupuesto-nuevo
version: 1
modulo: presupuestos
titulo: "Registrar un presupuesto nuevo"
objetivo: "Registrar los datos generales de un presupuesto (nombre, cliente, lugar, fecha, plazo, jornada y moneda) en el escenario de Datos Generales, punto de partida para armar su hoja."
nivel: basico
preguntas:
  - "cómo creo un presupuesto nuevo en s10"
  - "cómo registro un presupuesto"
  - "quiero hacer un presupuesto nuevo de obra"
  - "dónde se crea el presupuesto en el módulo de presupuestos"
  - "como registro un presupuesto nuevo en s10 presupuestos"
  - "pasos para registrar los datos generales del presupuesto"
  - "como se crea un prespuesto nuevo"
  - "cómo ingreso cliente, fecha y plazo de un presupuesto"
  - "registrar presupuesto meta o venta nuevo"
aliases:
  - "registrar presupuesto"
  - "crear presupuesto"
  - "nuevo presupuesto"
  - "dar de alta un presupuesto"
entidades:
  modulo: "Presupuestos"
  pantallas: ["Datos Generales", "Catálogo de Presupuestos", "Datos adicionales", "Catálogo de Ubicación Geográfica"]
