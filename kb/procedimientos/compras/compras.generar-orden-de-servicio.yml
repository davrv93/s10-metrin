  - "como genero la orden de servicio del pedido que ya aprobaron"
  - "como saco una os para el dueño del equipo"
  - "donde pongo los precios del proveedor en la orden de servicio"
  - "como envio a aprobacion la orden de servicio"
  - "genere la orden de serbicio y no se como mandarla a aprobar"
  - "tengo que hacer una orden de servicio por cada proveedor?"
  - "como le pongo descuento a la orden de servicio"
  - "donde apruebo las ordenes de servicio"
  - "como hago una orden de servicio en s10"
aliases:
  - "generar orden de servicio"
  - "orden de servicio"
  - "OS desde pedido"
  - "crear orden de servicio"
entidades:
