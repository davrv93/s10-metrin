  - "cómo configuro los datos adicionales del proyecto"
  - "donde cambio el numero de decimales de cantidades y precios del proyecto"
  - "cómo activo los factores de inflación para la valorización"
  - "como hago que solo salgan las partidas de control activas en el tareo"
  - "dónde asigno al jefe de proyecto y al administrador del proyecto"
  - "como configuro la partida no contributorio para la distribucion de costos"
  - "como marco que el proyecto es inmobiliario o se integra con sperant"
  - "datos adicionales gerencia de proyectos s10"
  - "donde se pone los desimales del factor de relacion"
