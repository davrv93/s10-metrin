termino: "Socio de negocio"
sinonimos: ["socios de negocio"]
definicion: "Persona natural o jurídica registrada en el catálogo de socios de negocio, con un código único. En ese catálogo se registran todas las personas que tienen que ver con el sistema, como clientes, proveedores, empleados, obreros, subcontratistas, AFP y bancos."
en_s10: "El catálogo funciona como una bolsa de la que se eligen los que participarán en el proyecto; el registro puede hacerse a mano o por importación masiva desde una plantilla Excel."
