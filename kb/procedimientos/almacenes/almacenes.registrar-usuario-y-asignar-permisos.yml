errores_frecuentes:
  - sintoma: "El almacenero registra o modifica recursos del catálogo."
    solucion: "Para el almacenero, defina la categoría Especialista y que no registre ni modifique los recursos."
    fuente: [img-3ef4c298a868-0000]
  - sintoma: "Otro usuario no ve la información de un proyecto."
    solucion: "Solo la persona que registre el proyecto tendrá acceso a este, pero puede invitar a otros usuarios para que compartan la información del proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s163]
  - sintoma: "El usuario tiene permiso para eliminar en un catálogo y aun así no puede eliminar un registro."
    solucion: "El permiso elimina registros del catálogo siempre y cuando no estén participando en una aplicación."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s162]
