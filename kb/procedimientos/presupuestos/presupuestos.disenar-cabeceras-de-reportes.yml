        pagina: null
        ocr: "h Cortar\n\nCopiar\n\n& Pegar\n\n% Eliminar\n\nA Fuentes\n\nCopiar Formato\n\nPegar Formato\n\nBE Exportar a Microsoft Excel"
  - n: 7
    id: "presupuestos.disenar-cabeceras-de-reportes#7"
    accion: "Para copiar el formato de un registro (fuente, tamaño de letra y color) a otro, use **Copiar Formato** y luego **Pegar Formato** del mismo menú."
