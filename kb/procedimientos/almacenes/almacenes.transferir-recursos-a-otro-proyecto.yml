id: almacenes.transferir-recursos-a-otro-proyecto
version: 1
modulo: almacenes
titulo: "Transferir recursos a otro proyecto"
objetivo: "Transferir recursos del almacén de un proyecto al de otro: se pide con un pedido A Almacén, el proyecto origen genera un Egreso por Transferencia Externa y el destino un Ingreso por Transferencia Externa, que carga la cantidad y el costo al proyecto que recibe. La transferencia es permanente, no contempla devolución."
nivel: intermedio
preguntas:
  - "cómo transfiero materiales a otra obra"
  - "como hago una transferencia externa entre proyectos"
  - "otra obra me mandó fierro, cómo lo ingreso a mi almacén"
  - "no se activa adicionar desde guias de egresos en el ingreso por transferencia"
  - "como paso stock de un proyecto a otro en s10"
  - "ingreso por transferencia externa pasos"
  - "como envio recursos de mi almacen a otro proyecto sin que me los devuelvan"
  - "transferencia esterna con pedido como la registro"
aliases:
  - "transferencia externa"
  - "transferir a otro proyecto"
  - "ingreso por transferencia externa"
  - "egreso por transferencia externa"
  - "traslado entre obras"
