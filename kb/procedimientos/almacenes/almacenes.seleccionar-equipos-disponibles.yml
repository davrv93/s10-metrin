verificacion:
  - texto: "La etiqueta de estado de la ficha se muestra en color amarillo cuando la ficha está en proceso de elaboración y en color rojo cuando la ficha del equipo está aprobada y puede ser utilizada en un subcontrato."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s153]
errores_frecuentes:
  - sintoma: "Un equipo no aparece para efectuar los partes diarios de equipo."
    solucion: "Sólo los equipos disponibles son mostrados para efectuar los partes diarios de equipo: en la ficha, la opción Disponible debe estar seleccionada mientras el equipo esté en servicio o trabajando."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s152]
  - sintoma: "Los equipos ya aparecen en el módulo de Almacenes sin haberlos registrado."
    solucion: "Si en el módulo de Gerencia de proyectos ya se efectuó el registro, la información es visualizada en el módulo de Almacenes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s148]
