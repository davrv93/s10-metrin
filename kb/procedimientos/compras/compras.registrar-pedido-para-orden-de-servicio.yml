id: compras.registrar-pedido-para-orden-de-servicio
version: 1
modulo: compras
titulo: "Registrar un pedido para orden de servicio"
objetivo: "Registrar desde el almacén de servicios un pedido de servicios o de alquiler de equipos (por ejemplo, las horas máquina de equipos presupuestados), para cotizarlo con los proveedores o generar con él la Orden de Servicio."
nivel: intermedio
preguntas:
  - "como hago un pedido de alquiler de equipos para la orden de servicio"
  - "desde que almacen se pide un servicio"
  - "quiero pedir horas maquina de un volquete, como lo registro"
  - "como pido un servicio en s10 compras"
  - "no me salen los equipos para pedir el servicio"
  - "como pongo la fecha de entrega a los equipos del pedido"
  - "pedido para orden de serivicio paso a paso"
  - "donde registro las horas que voy a pedir de cada equipo"
aliases:
  - "pedido para orden de servicio"
  - "pedido de servicio"
  - "pedir alquiler de equipo"
  - "pedido al almacén de servicios"
entidades:
  modulo: "Compras"
  pantallas: ["Pedidos", "almacén de servicios"]
  objetos: ["pedido", "Orden de Servicio", "equipo", "Centro de Compra"]
