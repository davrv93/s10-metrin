definicion: "Escenario donde se programa el proyecto: recibe las fases con sus actividades preparadas en el escenario de Actividades y permite ingresar porcentajes o metrados (no costos) en los periodos a programar."
en_s10: "Lo comparten los módulos de Presupuestos y Gerencia de proyectos. Se programa en periodos mensuales en la rama Venta y semanales en la rama Meta. En él se registra también la valorización, y de él se toma el monto de la valorización mensual; su Plan de utilización de recursos alimenta los pedidos automáticos para comprar."
