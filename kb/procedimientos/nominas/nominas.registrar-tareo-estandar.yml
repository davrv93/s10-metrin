    id: "nominas.registrar-tareo-estandar#13"
    accion: "Elija el tipo de hora, por ejemplo H (Normal), E60 (Extra al 60%), E100 (Extra al 100%) o DM (Descanso médico). Estos tipos de horas se configuran en el módulo de nóminas del S10."
