id: adelanto
termino: "Adelanto en efectivo"
sinonimos: ["adelanto", "adelantos"]
definicion: "Adelanto de dinero en contratos y subcontratos. Según el manual, generalmente es un porcentaje del contrato, referido a la suma del costo directo, los gastos generales y la utilidad."
en_s10: "Si el porcentaje de adelanto se registra en la cabecera del contrato o subcontrato, la amortización en cada valorización es automática; si se entrega con garantía, el monto de la garantía es el tope del adelanto. En ese caso el pago del adelanto debe registrarse antes de la primera valorización, porque no existe opción para amortizarlo manualmente. Cuando se registra como pago a cuenta, la amortización es manual en cada valorización; así se registra, por ejemplo, el adelanto para materiales (en el Perú, el 20 % del costo del material)."
procedimientos_relacionados: [gerencia-proyectos.registrar-subcontrato]
