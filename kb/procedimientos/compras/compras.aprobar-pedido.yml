  - sintoma: "Observó un pedido y sus recursos no están disponibles para otro pedido."
    solucion: "Cuando se observa el pedido queda en espera hasta cambiarlo de estado, y los recursos quedan reservados o no disponibles: no formarán parte de otro pedido."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s038]
  - sintoma: "El pedido no pasa al proceso de compra."
    solucion: "Todos los pedidos A Compra deben ser aprobados para que pasen al proceso de compra."
