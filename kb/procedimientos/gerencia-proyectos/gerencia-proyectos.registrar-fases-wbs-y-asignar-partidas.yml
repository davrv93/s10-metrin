id: gerencia-proyectos.registrar-fases-wbs-y-asignar-partidas
version: 1
modulo: gerencia-proyectos
titulo: "Registrar las fases del WBS y asignarles partidas"
objetivo: "Preparar en el escenario de Actividades la información para la planificación física: registrar las fases del WBS según el orden constructivo y asignar a cada fase las partidas del presupuesto con los metrados que le corresponden."
nivel: intermedio
