    id: "facturacion-electronica.dar-de-baja-guia-de-remision#1"
    accion: "Acceda a la página web de la SUNAT (https://www.sunat.gob.pe/sol.html), en la opción **Mis Trámites y Consultas**."
    fuente: [web-https-documentacion-s10peru-com-portal-d-s005]
    pagina: null
