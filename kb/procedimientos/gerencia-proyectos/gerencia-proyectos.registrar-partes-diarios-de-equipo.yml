id: gerencia-proyectos.registrar-partes-diarios-de-equipo
version: 1
modulo: gerencia-proyectos
titulo: "Registrar los partes diarios de equipo con Excel"
objetivo: "Registrar en una hoja Excel el trabajo diario de cada equipo por partida de control, importarlo al S10 y calcular el resumen del periodo, para controlar las horas trabajadas y cargar el costo del equipo a los resultados operativos."
nivel: intermedio
preguntas:
  - "cómo registro los partes diarios de equipo en gerencia de proyectos"
  - "como lleno el parte de equipo en excel y lo paso al s10"
  - "dónde se registran las horas trabajadas de la maquinaria"
  - "como importo los partes de equipo de excel"
  - "como registro horas stand by de un equipo parado"
  - "el volquete trabajó en dos partidas de control el mismo día, cómo lo registro"
  - "como calculo el resumen del periodo de los partes de equipo"
  - "como ago el parte diario del cargador frontal"
  - "necesito mas de 5 rotaciones en el parte de equipo"
  - "cómo pasa el costo del equipo a resultados operativos"
aliases:
  - "partes de equipo"
  - "parte diario de equipo"
  - "registrar horas de equipo"
  - "importar partes de equipo"
  - "calcular resumen periodo"
entidades:
