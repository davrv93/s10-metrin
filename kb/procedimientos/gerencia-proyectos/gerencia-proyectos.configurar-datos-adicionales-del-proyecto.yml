id: gerencia-proyectos.configurar-datos-adicionales-del-proyecto
version: 1
modulo: gerencia-proyectos
titulo: "Configurar los datos adicionales del proyecto"
objetivo: "Configurar, por proyecto, los decimales de cantidades y precios, los factores de inflación, las partidas de control activas, el jefe y el administrador del proyecto, la distribución de costos, los decimales del factor de relación y la gestión inmobiliaria."
nivel: intermedio
