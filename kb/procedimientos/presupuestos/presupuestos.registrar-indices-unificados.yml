        ocr: "Indices Unificados\nAreas Geograticas\n(4rea 01) Tumbes - Piura - Lambayeque - La Libertad - Cajamarca - Amazonas(Area 04) Arequipa - Moquegua - Tacna\n(Area 02) Ancash - Lima - Callao - Ica @ (Area 05) Loreto\n(Area 03) Huanuco - Pasco - Junin - Huancayelica - Ayacucho - (Area 06) Cusco - Puno - Apurimac - Madre de Dios\n—\nTablas\neProtesicdo?]  Afo | | Mes [Fecha publicacién\n\n> eh EE ~ | Agosto 75109/…"
