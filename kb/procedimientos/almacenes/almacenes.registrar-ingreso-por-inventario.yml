  - texto: "El proyecto debe estar registrado (si se registró en Gerencia de proyectos, se ve en Almacenes) y usted debe tener acceso al proyecto y a sus almacenes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s021]
