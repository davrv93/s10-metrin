  - n: 3
    id: "facturacion-electronica.crear-usuario-del-portal#3"
    accion: "Haga clic en el botón **Adicionar** para crear un usuario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 4
    id: "facturacion-electronica.crear-usuario-del-portal#4"
    accion: "En **Dirección de correo**, ingrese cualquier dirección de correo válida."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 5
    id: "facturacion-electronica.crear-usuario-del-portal#5"
    accion: "Ingrese el **Nombre** y el **Apellido** del usuario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 6
    id: "facturacion-electronica.crear-usuario-del-portal#6"
    accion: "Si corresponde, asígnele el rol de **Administrador**: se puede asignar a más de un usuario de la empresa."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 7
    id: "facturacion-electronica.crear-usuario-del-portal#7"
    accion: "En **Asociación Compañía**, seleccione las empresas en las que el usuario puede consultar los documentos; si la empresa pertenece a una corporación, indique a qué empresas del grupo tendrá acceso."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 8
    id: "facturacion-electronica.crear-usuario-del-portal#8"
    accion: "Con los campos marcados con * completos (son obligatorios), haga clic en el botón **Guardar**."
    resultado: "El portal envía un correo electrónico al usuario, con una clave temporal."
