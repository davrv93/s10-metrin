id: escenario
termino: "Escenario"
sinonimos: ["escenarios"]
definicion: "Cada ventana de trabajo de un módulo de S10. Las ventanas se asemejan a un escritorio y el entorno de trabajo es casi el mismo en todos los escenarios: botones comunes (imprimir, vista preliminar, retroceder, avanzar, ver árbol), botones exclusivos de cada escenario y menús cuyas acciones cambian según el escenario."
en_s10: "Se accede desde la barra de vistas, que contiene los grupos y, dentro de ellos, los botones de acceso directo a los escenarios (por ejemplo, grupo Nóminas, escenario Cálculo de nóminas). Algunos escenarios son solo informativos o de consulta."
