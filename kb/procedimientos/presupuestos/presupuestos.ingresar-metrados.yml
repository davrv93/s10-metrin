id: presupuestos.ingresar-metrados
version: 1
modulo: presupuestos
titulo: "Ingresar los metrados en la hoja del presupuesto"
objetivo: "Registrar el metrado de cada partida en la hoja del presupuesto: escribiéndolo, pegándolo desde Excel o vinculándolo a una celda de una hoja de cálculo Excel."
nivel: basico
preguntas:
  - "cómo ingreso los metrados en s10"
  - "donde pongo el metrado de una partida"
