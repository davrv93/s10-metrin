errores_frecuentes:
  - sintoma: "No sabe qué comportamiento darle a la papeleta de vacaciones."
    solucion: "Se recomienda calificar con el comportamiento Abierta las papeletas por días de vacaciones."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
  - sintoma: "No puede agregar ni modificar un concepto genérico."
    solucion: "Los genéricos son de uso interno del S10, no se pueden agregar ni modificar; van directamente relacionados a los conceptos."
