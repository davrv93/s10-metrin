  objetos: ["nómina", "tipo de nómina", "periodo", "proceso estándar", "renta de quinta categoría", "papeletas"]
prerrequisitos:
  - texto: "Los tareos y las papeletas del periodo deben estar registrados: el resumen de conceptos por día obtiene los datos registrados en el Tareo Multiproyecto más las papeletas registradas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s072]
  - texto: "Antes de procesar la nómina, registre los datos manuales que correspondan: Datos por Socio de Negocio, Datos por Socio de Negocio y Periodo y Datos por Periodo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s071, web-https-documentacion-s10peru-com-manual-d-s073]
