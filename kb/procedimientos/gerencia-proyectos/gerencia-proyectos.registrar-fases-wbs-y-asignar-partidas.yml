prerrequisitos:
  - texto: "El proyecto debe tener asignados sus presupuestos: en el WBS participan todas las partidas de los presupuestos asignados."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s069]
  - texto: "Tenga un organigrama que describa en forma detallada las partes del proyecto tal como será construido; esa información se registra en la ventana del WBS."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s072]
