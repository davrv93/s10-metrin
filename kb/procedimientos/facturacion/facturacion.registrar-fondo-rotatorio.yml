id: facturacion.registrar-fondo-rotatorio
version: 1
modulo: facturacion
titulo: "Registrar un fondo rotatorio (caja chica) y sus reembolsos"
objetivo: "Crear en el escenario Fondos Rotatorios la caja chica de un responsable, asignarle el documento de pago que la financia y registrar dentro de ella los reembolsos con los documentos que sustentan los gastos, hasta cerrarlos para que Finanzas devuelva lo gastado."
nivel: avanzado
preguntas:
  - "cómo creo un fondo rotatorio en facturación"
  - "como registro la caja chica de un responsable"
  - "como le asigno el dinero al fondo rotatorio"
  - "agregar documento de pago a la asignacion de fondo"
  - "como registro los gastos de caja chica en el fondo rotatorio"
  - "como genero un reembolso dentro del fondo rotatorio"
  - "quiero que finanzas me devuelva lo gastado de la caja chica, que hago"
  - "fondo rotativo s10 pasos"
  - "la caja chica como se repone en s10"
  - "en movimientos no me aparece la asignacion de fondo"
aliases:
  - "fondo rotatorio"
  - "registrar fondo rotatorio"
  - "caja chica"
  - "fondos rotatorios"
  - "reembolso de caja chica"
entidades:
  modulo: "Facturación"
  pantallas: ["Fondos Rotatorios", "Fondo Rotatorio", "Datos Generales"]
  objetos: ["fondo rotatorio", "caja chica", "asignación de fondo", "reembolso", "documento de pago", "recurso"]
prerrequisitos:
  - texto: "El usuario debe ser RESPONSABLE DE FONDO ROTATORIO, la persona encargada del fondo: solo él puede adicionar su fondo asignado. Se verifica en el grupo Inicio, escenario Datos Generales."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s054]
  - texto: "El ADMINISTRADOR DE FONDO ROTATORIO es el encargado de registrar los fondos rotatorios para todos los proyectos y tiene atributos para corregir cualquier fondo rotatorio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s054]
