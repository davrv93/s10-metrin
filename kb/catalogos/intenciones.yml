  # ── Instrucción paso a paso ───────────────────────────────────────────────────────────────────────────────────
  soporte_como_hacer:
    descripcion: >-
      Pide CÓMO HACER una tarea en S10 (registrar, generar, calcular, configurar, aprobar, instalar…) o aprender a
      manejar un módulo. Se responde con un procedimiento de kb/procedimientos/ paso a paso. Si la tarea existe en
