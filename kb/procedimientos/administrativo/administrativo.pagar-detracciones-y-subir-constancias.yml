id: administrativo.pagar-detracciones-y-subir-constancias
version: 1
modulo: administrativo
titulo: "Pagar detracciones con una orden de pago tipo Tributos e importar las constancias"
objetivo: "Registrar una orden de pago tipo Tributos con los documentos afectos a detracción, aprobarla, ejecutar el pago electrónico que genera el archivo TXT para la SUNAT o el banco, e importar después el TXT de constancias de detracción para que el número de constancia quede registrado en cada documento."
nivel: avanzado
preguntas:
  - "cómo pago las detracciones de las facturas de proveedores en s10"
  - "como hago la orden de pago de detraccion"
  - "dónde se genera el txt de detracciones para subir a sunat"
  - "como subo las constancias de detraccion al sistema"
  - "como importo el txt de constancias que me da sunat"
  - "la factura tiene detraccion como pago solo la detraccion"
  - "en que carpeta se guarda el txt del pago electronico de detracciones"
  - "no me sale la opcion documento con tributo en la orden de pago"
  - "como registro el numero de constancia de detraccion en las facturas sin hacerlo una por una"
  - "pago de detraciones tipo tributos paso a paso"
aliases:
  - "pagar detracciones"
  - "orden de pago tipo tributos"
  - "pago de detracción"
  - "importar constancias de detracción"
  - "txt de detracciones"
  - "constancia de detracción"
entidades:
  modulo: "Administrativo"
  pantallas: ["Ordenes de Pago", "Orden de Pago", "Cronograma de Pagos", "Pendientes de Pago", "Pagos"]
  objetos: ["orden de pago", "detracción", "factura", "cuenta bancaria", "archivo TXT", "constancia de detracción"]
prerrequisitos:
  - texto: "Los socios de negocio a quienes se pagará deben tener creada la cuenta bancaria tipo Detracción en su perfil del catálogo de Socios Negocios."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s040]
  - texto: "En el catálogo de Bancos, el banco debe estar configurado con el Formato de Exportación para generar el archivo electrónico sin problemas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042]
  - texto: "En la factura afecta a detracción, la detracción debe mostrarse independiente en el registro."
    fuente: [web-https-documentacion-s10peru-com-realizar-s000]
