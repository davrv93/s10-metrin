verificacion:
  - texto: "En el Registro del Inventario Permanente Valorizado (13.01), el código corresponde al campo «8.Código Producto SUNAT»."
    fuente: [web-https-documentacion-s10peru-com-asignar--s003]
  - texto: "En el Libro de Inventarios y Balance 03.07 (cuenta 20 – Mercaderías y cuenta 21), el código corresponde al campo «Cod. CUBSO» y su descripción es «CUBSO»."
    fuente: [web-https-documentacion-s10peru-com-asignar--s004]
errores_frecuentes:
  - sintoma: "En el libro electrónico se muestra como observación el mensaje «El Campo ‘Código Producto SUNAT’ no puede ser Nulo, verifique la configuración.»"
    solucion: "Ocurre cuando se tiene la configuración activada y aún no se ha asignado ningún código de producto SUNAT: asigne el código en el escenario de Almacenes (2. Asignación de código de Producto SUNAT)."
    fuente: [web-https-documentacion-s10peru-com-asignar--s003]
