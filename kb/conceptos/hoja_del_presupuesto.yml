id: hoja_del_presupuesto
termino: "Hoja del presupuesto"
sinonimos: []
definicion: "Es el escenario donde se registra el contenido del presupuesto, como los títulos y las partidas; ahí se ingresan los metrados y se procesa el presupuesto."
en_s10: "Escenario del módulo de Presupuestos al que se pasa después de registrar el presupuesto en el escenario de Datos generales. Puede dividirse para mostrar en la ventana inferior los análisis de precios unitarios de la partida elegida. Hay 4 formas de llenarla: copiar partidas de presupuestos elaborados, usar favoritos, importar un presupuesto elaborado en Excel o registrarlo en la forma tradicional."
procedimientos_relacionados: [presupuestos.registrar-titulos-y-partidas, presupuestos.ingresar-metrados, presupuestos.usar-favoritos]
