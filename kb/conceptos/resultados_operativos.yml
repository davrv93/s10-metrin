id: resultados_operativos
termino: "Resultados operativos"
sinonimos: []
definicion: "Control periódico del proyecto, de preferencia semanal, que permite observar su marcha en avance y costo para tomar decisiones. Para el control se usa la teoría del valor ganado."
en_s10: "En Gerencia de proyectos, el escenario Resultados operativos por proyecto da información consolidada a nivel de partidas de control para comparar lo programado, lo valorizado y lo realmente gastado, y puede combinar las ramas Venta y Meta. Las curvas S comparan gráficamente el costo presupuestado del trabajo programado (CPTP), el costo presupuestado del trabajo realizado (CPTR) y el costo real del trabajo realizado (CRTR). Reciben el costo de los materiales desde Almacenes y el de la mano de obra desde Nóminas."
