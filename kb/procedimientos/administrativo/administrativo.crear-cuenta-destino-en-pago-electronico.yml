id: administrativo.crear-cuenta-destino-en-pago-electronico
version: 1
modulo: administrativo
titulo: "Crear la cuenta bancaria destino del socio de negocio desde el pago electrónico"
objetivo: "Cuando al generar el pago electrónico en Pendientes de Pago aparecen socios de negocio sin cuenta bancaria destino, crearles la cuenta desde sus propiedades sin ir al catálogo y luego generar el pago."
nivel: intermedio
