modulo: facturacion-electronica
titulo: "Configurar la emisión electrónica (empresa, tipos de documento, talonarios y clientes)"
objetivo: "Dejar el S10 listo para emitir comprobantes electrónicos: resolución SUNAT de la empresa emisora, tipos de documento, talonarios calificados para el Sistema de Emisión Electrónica y contactos de facturación electrónica de los clientes."
nivel: avanzado
