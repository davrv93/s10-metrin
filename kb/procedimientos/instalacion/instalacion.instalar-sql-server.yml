id: instalacion.instalar-sql-server
version: 1
modulo: instalacion
titulo: "Instalar Microsoft SQL Server"
objetivo: "Instalar Microsoft SQL Server con sus componentes de administración, sabiendo qué se hace en cada paso para no instalar más o menos servicios de los necesarios ni aplicar malas prácticas de seguridad."
nivel: avanzado
preguntas:
  - "como instalo sql server para el s10"
  - "que collation pongo al instalar sql server"
  - "que modo de autenticacion elijo en la instalacion de sql"
  - "instancia por defecto o nombrada en sql server cual pongo"
  - "pasos para instalar el motor de base de datos sql server"
  - "que caracteristicas de sql server tengo que marcar"
  - "puedo usar sql server 2016 con el s10"
  - "como pongo el nivel de compatibilidad de la base de datos"
  - "instalar sql servr en el servidor paso a paso"
  - "que necesito revisar antes de instalar sql server"
