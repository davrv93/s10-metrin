  - "llegó la factura del concreto, cómo regularizo las guías"
  - "como regularizo guias de remision con una factura"
  - "dónde registro el precio de la factura de un ingreso con guía"
  - "regularizacion simple ingreso por compra s10"
  - "cómo paso la factura de las guías a documentos por pagar"
aliases:
  - "regularizar ingreso por compra"
  - "regularizar guía de remisión"
  - "regularización con factura"
  - "vincular factura a guías"
entidades:
