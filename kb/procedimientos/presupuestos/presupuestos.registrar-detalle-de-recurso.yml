errores_frecuentes:
  - sintoma: "No ve desde el presupuesto el análisis de precios unitarios del detalle del recurso."
    solucion: "Los análisis de precios unitarios del detalle del recurso no se visualizan desde el presupuesto; se trabajan en el escenario Detalle de recursos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s116]
  - sintoma: "Al procesar el presupuesto, el sistema toma el precio del recurso principal y no el del detalle."
    solucion: "En la configuración de procesamiento debe estar seleccionada la opción que, al procesar el presupuesto, verifica los recursos considerados en el detalle del recurso; si no está seleccionada, toma el precio del recurso principal."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s020]
