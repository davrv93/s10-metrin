id: gerencia-proyectos.registrar-adelanto-con-garantia-del-subcontrato
version: 1
modulo: gerencia-proyectos
titulo: "Registrar el adelanto en efectivo con garantía (carta fianza) de un subcontrato"
objetivo: "Registrar en el subcontrato el porcentaje de adelanto con garantía y la carta fianza que sirve de tope para otorgar el adelanto en efectivo, y luego autorizar el pago del adelanto; la amortización en cada valorización es automática."
nivel: intermedio
preguntas:
  - "cómo registro una carta fianza para el adelanto del subcontratista"
  - "como doy un adelanto en efectivo con garantia al subcontratista"
  - "donde marco que el subcontrato requiere garantia"
  - "como registro la garantía del adelanto en el subcontrato"
  - "como pago el adelanto al subcontratista despues de registrar la carta fianza"
  - "el adelanto no puede pasar el monto de la garantia?"
  - "la carta fianza de fiel cumplimiento sirve para el tope del adelanto"
  - "como aviso por correo el vencimiento de la carta fianza"
  - "adelanto con carta fiansa en subcontratos s10"
aliases:
  - "adelanto con garantía"
  - "registrar carta fianza"
  - "garantía del subcontrato"
  - "adelanto en efectivo con garantía"
  - "registro de la garantía"
entidades:
  modulo: "Gerencia de Proyectos"
