id: ingreso_de_almacen
termino: "Ingreso de almacén"
sinonimos: ["ingreso", "ingresos", "guía de ingreso"]
definicion: "Movimiento por el cual un recurso entra al almacén; debe estar respaldado por un documento con la fecha, cantidad, unidad y precio del recurso. Todo ingreso va al stock, salvo los recursos que no se almacenan, como el concreto premezclado, que se ingresan y se egresan de inmediato con descarga directa."
en_s10: "Hay varios tipos, entre ellos el Ingreso por compra [IC] (con guía de remisión, factura, boleta de venta o ticket, sin orden de compra), el Ingreso por orden de compra [IOC] (de las órdenes aprobadas en Compras), el ingreso por préstamo, por transferencia externa y por ajuste de cantidad. Los ingresos se relacionan con la factura, que pasa a Documentos por pagar y a Contabilidad."
