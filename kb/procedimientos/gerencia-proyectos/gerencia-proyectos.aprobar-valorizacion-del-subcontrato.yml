errores_frecuentes:
  - sintoma: "En la pestaña Valorizaciones no está disponible la opción Adicionar."
    solucion: "Ocurre cuando la persona que elabora la valorización no es la que la aprueba. Si quien elabora la valorización es quien aprueba, puede registrar el pago."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s162]
  - sintoma: "La valorización no aparece para la autorización de pago."
    solucion: "Solo las valorizaciones aprobadas son elegidas para la autorización de pago: apruebe primero la valorización."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s162]
  - sintoma: "No se puede registrar una segunda valorización del subcontrato en el mismo periodo."
    solucion: "El sistema solo permite una valorización por periodo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s159]
