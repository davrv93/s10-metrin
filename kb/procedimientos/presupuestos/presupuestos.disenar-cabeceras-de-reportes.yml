  - n: 3
    id: "presupuestos.disenar-cabeceras-de-reportes#3"
    accion: "Elija el tipo de reporte: Resumen del presupuesto, Presupuesto, Análisis de precios unitarios, Recursos y precios, Fórmula polinómica o Subpartidas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s113]
    pagina: null
  - n: 4
    id: "presupuestos.disenar-cabeceras-de-reportes#4"
    accion: "En la columna **Alineación**, elija el alineamiento de la línea: **Izquierdo**, **Derecho** o **Centrado**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s113, "7c40a9548710-0182"]
    pagina: null
  - n: 5
    id: "presupuestos.disenar-cabeceras-de-reportes#5"
    accion: "En la columna **Texto**, registre el texto de cada línea de la cabecera, hasta en 10 líneas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s113, "7c40a9548710-0182"]
    pagina: null
  - n: 6
    id: "presupuestos.disenar-cabeceras-de-reportes#6"
    accion: "Para elegir la fuente del registro, haga clic derecho sobre el texto y elija **Fuentes**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s113, img-f91b81c173db-0000]
    pagina: null
    fotos:
      - id: "62de340a107f"
