id: almacenes.calificar-recurso-con-techo-cantidad
version: 1
modulo: almacenes
titulo: "Calificar un recurso con techo por cantidad y asignarle sus equivalentes"
objetivo: "Calificar en el escenario de Techo de Materiales un recurso genérico presupuestado con el tipo de Techo Cantidad y registrar los recursos específicos o equivalentes que serán comprados, para que se descuenten de la cantidad total presupuestada."
nivel: avanzado
preguntas:
  - "como pongo techo por cantidad a un recurso del presupuesto"
  - "en el presupuesto tengo acero en kilos pero compro varillas, como hago la equivalencia"
  - "como asigno recursos especificos a un recurso generico presupuestado"
  - "techo cantidad s10 como se califica el recurso"
  - "donde registro el factor de la varilla de acero para pedir"
  - "como hago para que lo que pido se descuente de la cantidad presupuestada"
  - "no me sale el factor del recurso equivalente en el techo de materiales"
  - "que tengo que hacer antes de pedir los recursos especificos"
