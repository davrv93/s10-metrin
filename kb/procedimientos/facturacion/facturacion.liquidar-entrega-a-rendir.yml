id: facturacion.liquidar-entrega-a-rendir
version: 1
modulo: facturacion
titulo: "Liquidar una entrega a rendir desde Facturación"
objetivo: "Abrir en el escenario Liquidaciones una liquidación para la persona que recibió el pago de la Entrega a Rendir, agregarle ese pago, registrar los documentos internos o SUNAT que sustentan la rendición y, si hay devolución, agregar el depósito desde el diario de caja hasta que la liquidación quede rendida y cerrada."
nivel: avanzado
preguntas:
  - "cómo hago la liquidación de una entrega a rendir"
  - "como liquido lo que rindio el trabajador"
  - "ya pagué la entrega a rendir y ahora como registro los gastos que me sustentan"
  - "donde registro la planilla de movilidad de la rendicion"
  - "el trabajador devolvio el saldo que no gasto, como lo meto a la liquidacion"
  - "como cierro una liquidacion de entrega a rendir"
  - "liquidasion de entregas a rrendir en facturacion"
  - "agregar documento desde el diario de caja a la liquidacion"
  - "por qué mi liquidación sigue en estado registrado y no se cierra"
aliases:
  - "liquidar entrega a rendir"
  - "liquidación de entrega a rendir"
  - "rendición de gastos"
  - "cerrar liquidación"
  - "liquidaciones"
entidades:
  modulo: "Facturación"
  pantallas: ["Liquidaciones", "Cronograma de Cobranzas", "Diario de Caja"]
  objetos: ["liquidación", "entrega a rendir", "pago", "documento interno", "planilla de movilidad", "depósito"]
prerrequisitos:
