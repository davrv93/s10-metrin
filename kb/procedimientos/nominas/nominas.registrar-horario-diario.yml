modulo: nominas
titulo: "Registrar un horario diario"
objetivo: "Registrar en el escenario de Horarios Diarios la cantidad de horas trabajadas en la jornada, las horas extras, los permisos no autorizados o faltas y los bonos incentivos; estos horarios formarán parte de los horarios cíclicos que se asignan a cada trabajador."
