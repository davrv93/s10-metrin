id: nominas.registrar-ficha-del-trabajador
version: 1
modulo: nominas
titulo: "Registrar la información en la ficha del trabajador"
objetivo: "Completar la ficha de cada trabajador con la información que se usa para el proceso de la nómina y para el T-REGISTRO que se envía a la SUNAT mensualmente."
nivel: intermedio
preguntas:
  - "cómo lleno la ficha del trabajador en nóminas"
  - "donde registro la afp de un obrero"
  - "como pongo el tipo de contrato y el regimen laboral del trabajador"
  - "dónde se registran los datos para el t-registro"
  - "como agrego a los hijos o la esposa como derecho habiente"
  - "en que parte pongo el banco y la cuenta donde le depositan al trabajador"
  - "como registro el recurso equivalente y la categoria del obrero"
  - "como completo la ficha personal del trabjador"
  - "donde marco essalud vida o comision mixta afp"
  - "el trabajador es practicante, donde pongo la modalidad formativa"
aliases:
  - "ficha del trabajador"
  - "ficha personal"
  - "datos del trabajador"
  - "datos para el t-registro"
  - "afiliaciones del trabajador"
entidades:
  modulo: "Nóminas"
  pantallas: ["Personal Disponible", "Ficha personal", "Afiliaciones", "Derecho Habiente", "Relación Laboral"]
  objetos: ["trabajador", "recurso equivalente", "AFP", "derecho habiente", "tipo de contrato", "T-REGISTRO"]
prerrequisitos:
  - texto: "A cada uno de los trabajadores se registran sus datos en la ficha, sólo en el multiproyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046]
  - texto: "La esposa o conviviente y los hijos deben estar previamente registrados en el catálogo de Socio de Negocio en la rama Derecho Habiente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
