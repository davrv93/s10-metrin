  - texto: "Después de publicar, el parte semanal se muestra en el móvil."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s188]
errores_frecuentes:
  - sintoma: "Un trabajador ya no se muestra en los tareos."
    solucion: "En la ficha personal, el trabajador debe estar seleccionado como activo mientras labora en el proyecto; si no está seleccionado, ya no es mostrado en los tareos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s187]
  - sintoma: "Quiere tarear en el mismo proyecto al personal del subcontratista."
    solucion: "No mezcle el personal de la casa con el del subcontratista: para el personal del subcontratista, registre otro proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s187]
