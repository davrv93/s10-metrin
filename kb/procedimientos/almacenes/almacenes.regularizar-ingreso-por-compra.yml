id: almacenes.regularizar-ingreso-por-compra
version: 1
modulo: almacenes
titulo: "Regularizar un ingreso por compra con la factura"
objetivo: "Regularizar los ingresos por compra registrados inicialmente con guía de remisión, vinculándolos a su documento de pago para que los recursos se paguen una sola vez al proveedor y la factura pase a documentos por pagar y a Contabilidad."
nivel: intermedio
