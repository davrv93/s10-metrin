  - sintoma: "En el Cronograma por Periodos no se muestran todos los periodos que marcó como visibles."
    solucion: "En el escenario del Cronograma por Periodos solo se permite hacer visible 15 periodos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
  - sintoma: "Quiere usar periodos quincenales en el proyecto."
    solucion: "No use periodos quincenales: están disponibles solo para el módulo de Nóminas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
