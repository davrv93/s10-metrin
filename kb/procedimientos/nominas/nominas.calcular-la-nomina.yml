id: nominas.calcular-la-nomina
version: 1
modulo: nominas
titulo: "Calcular la nómina de un periodo"
objetivo: "Generar los resúmenes de conceptos y calcular la nómina de acuerdo al tipo de nómina, periodo y tipo de proceso: primero el proceso estándar y, al final, el de renta de quinta categoría."
nivel: avanzado
preguntas:
  - "cómo calculo la nómina de la semana"
  - "como proceso la planilla en s10 nominas"
  - "pasos para calcular la nomina de obreros"
  - "como genero el resumen de conceptos por dia y por periodo"
  - "como calculo la renta de quinta categoria en nominas"
  - "como reproceso la nomina de un periodo cerrado"
  - "donde veo la nomina detallada despues de calcular"
  - "como se procesa la nomina estandar"
  - "un dato nuevo no sale en la nomina calculada"
  - "como ago el calculo de la planilla semanal"
aliases:
  - "calcular nómina"
  - "procesar nómina"
  - "cálculo de la nómina"
  - "procesar planilla"
  - "proceso estándar"
entidades:
