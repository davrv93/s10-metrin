errores_frecuentes:
  - sintoma: "Quiere hacer el desembolso en el módulo Administrativo sin un documento que lo sustente."
    solucion: "En el S10 no se realiza ningún desembolso en el módulo Administrativo si no está previamente sustentado con un documento Interno o SUNAT: cree primero el documento ENTREGAS A RENDIR en Documentos por Pagar."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046]
