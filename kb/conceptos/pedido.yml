id: pedido
termino: "Pedido"
sinonimos: ["pedidos", "requerimiento"]
definicion: "Requerimiento de recursos del proyecto, ya sea para comprarlos o para usarlos en obra; generar pedidos es necesario para iniciar el proceso de compra. Los pedidos se hacen desde el almacén de un proyecto y dependen del tipo de techo del proyecto."
en_s10: "Quien pide es el usuario del módulo de Gerencia de proyectos y quien aprueba es el residente de obra. Pueden ser manuales o automáticos (estos toman las cantidades del Plan de utilización de recursos del Cronograma por periodos), y todos se siguen desde el escenario de Pedidos. Al pedido a almacén se le asigna obligatoriamente una partida de control. Antes de pedir debe estar registrado el centro de compra, con el proyecto asignado, y los aprobadores."
ejemplo: "El manual recomienda agrupar recursos similares: un pedido para lo que se compra en una ferretería, otro para lo de una farmacia y otro para el proveedor de agregados."
procedimientos_relacionados: [compras.registrar-pedido-de-compra, compras.aprobar-pedido, gerencia-proyectos.registrar-pedido-manual-de-compra]
