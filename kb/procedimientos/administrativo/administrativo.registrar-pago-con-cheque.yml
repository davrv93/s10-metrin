id: administrativo.registrar-pago-con-cheque
version: 1
modulo: administrativo
titulo: "Registrar una orden de pago y pagarla con cheque"
objetivo: "Registrar una orden de pago con documentos del cronograma de pagos, enviarla a aprobación, aprobarla y ejecutar el pago con el talonario de cheques de la cuenta bancaria."
nivel: intermedio
preguntas:
  - "cómo pago a un proveedor con cheque"
  - "como hago una orden de pago con cheque en administrativo"
  - "cómo envío a aprobación una orden de pago"
  - "dónde ejecuto el pago de una orden de pago aprobada"
  - "no me deja pagar con cheque la orden de pago"
  - "como activo no negociable y al portador en el cheque"
  - "como se paga con cheke en s10"
  - "pasos para registrar pagos con cheque"
  - "como agrego documentos del cronograma de pagos a la orden de pago"
aliases:
  - "pago con cheque"
  - "orden de pago con cheque"
  - "pagar con cheque"
  - "registrar orden de pago"
  - "ejecutar pago"
entidades:
  modulo: "Administrativo"
  pantallas: ["Órdenes de Pago", "Orden de Pago", "Pendientes de Pago", "Pagos"]
  objetos: ["orden de pago", "cheque", "talonario", "cuenta bancaria", "cronograma de pagos", "documentos por pagar"]
prerrequisitos:
  - texto: "Las cuentas bancarias deben estar registradas desde el grupo BANCOS (número de cuenta, tipo de cuenta, CCI, saldos iniciales, moneda y proyecto por defecto)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s027]
  - texto: "Debe existir un talonario de cheques relacionado a la cuenta bancaria de la orden de pago, y el usuario que ejecuta el pago debe tener acceso a ese talonario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s028, img-0bd72066d270-0000]
