verificacion:
  - texto: "Después de calcular el resumen del periodo, los datos de los partes de equipo pasan a resultados operativos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s220]
  - texto: "En el **Resumen por Partida de Control** se visualiza el monto semanal del trabajo del equipo que es cargado a los Resultados Operativos, con el detalle en cantidad y costo de cada equipo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s221]
errores_frecuentes:
  - sintoma: "Las interferencias registradas en el parte de equipo no aparecen en los resultados operativos."
    solucion: "Es lo esperado: la información de **Interferencia** no pasa a los resultados operativos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s219]
  - sintoma: "No puede registrar horas en la celda Stand By del equipo parado."
    solucion: "Las horas **Stand By** se registran siempre y cuando en la ficha del equipo tenga precio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s219]
