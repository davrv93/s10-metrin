id: contabilidad.registrar-orden-de-venta-ipi
version: 1
modulo: contabilidad
titulo: "Registrar la orden de venta global de ingresos por identificar (IPI)"
objetivo: "Registrar la orden de venta global de cada empresa y marcarla como Ingresos por Identificar, para recibir los IPI: abonos depositados en la cuenta recaudadora que aún no han sido identificados."
nivel: intermedio
preguntas:
  - "como registro la orden de venta para los ipi"
  - "que es un ipi y como lo configuro en s10"
  - "donde marco ingresos por identificar en la orden de venta"
  - "como hago la ov global de ingresos por identificar"
  - "los abonos no identificados de sperant como llegan al s10"
  - "orden de venta tipo ipi pestaña sperant"
  - "que proyecto pongo en la orden de venta ipi"
  - "como configuro los pagos no identificados con sperant"
  - "ingresos por indentificar s10 orden de venta"
aliases:
  - "orden de venta IPI"
  - "ingresos por identificar"
  - "OV global IPI"
  - "pagos no identificados"
entidades:
  modulo: "Contabilidad"
  pantallas: ["Orden de Venta", "Sperant", "Por Cobrar"]
  objetos: ["orden de venta", "IPI", "lista de precio", "cliente", "proyecto"]
prerrequisitos:
  - texto: "En la configuración del módulo de facturación (opción en forma de tuerca), pestaña **Sperant**, debe estar hecha la configuración general; previamente se registra en el catálogo el tipo de documento y el recurso específico a utilizar."
    fuente: [web-https-documentacion-s10peru-com-ingresos-s001]
  - texto: "Debe estar registrado un solo recurso de venta, IPI, de forma global y no por empresa."
    fuente: [web-https-documentacion-s10peru-com-ingresos-s002]
  - texto: "Debe estar registrada la lista de precio de cada empresa, con el recurso de venta con un precio y cantidad 1."
    fuente: [web-https-documentacion-s10peru-com-ingresos-s003]
  - texto: "Debe estar adicionado el registro de un cliente global."
    fuente: [web-https-documentacion-s10peru-com-ingresos-s004]
pasos:
  - n: 1
    id: "contabilidad.registrar-orden-de-venta-ipi#1"
    accion: "Registre una orden de venta global por cada empresa, con los datos previamente configurados: el cliente, la lista de precio y el proyecto."
    fuente: [web-https-documentacion-s10peru-com-ingresos-s005]
    pagina: null
  - n: 2
    id: "contabilidad.registrar-orden-de-venta-ipi#2"
    accion: "Como proyecto, use de preferencia el proyecto principal de cada empresa."
