        pagina: null
        caption: "Al momento de procesar el presupuesto, el sistema verifica que no le falte metrados en la hoja del presupuesto y en el análisis de precios unitarios todos los recursos tengan aportes (cantidades) y precios. En el caso de que falte algún dato el sistema envía un mensaje con el requerimiento de ingreso del dato. Luego de registrar el dato, cierre la ventana y vuelva a procesar el presupuesto."
