id: gerencia-proyectos.aprobar-valorizacion-del-subcontrato
version: 1
modulo: gerencia-proyectos
titulo: "Aprobar la valorización de un subcontrato y autorizar su pago"
objetivo: "Aprobar la valorización del subcontrato, autorizar el pago de la valorización y aprobar la autorización de pago, para que el documento pase al módulo de Facturación – Documentos por pagar y luego a contabilidad."
nivel: intermedio
preguntas:
  - "como apruebo la valorizacion de un subcontrato"
  - "ya valorice al subcontratista, ahora como la apruebo"
  - "como autorizo el pago de una valorizacion del subcontratista"
  - "como apruevo la autorizacion de pago del subcontrato"
  - "por que no me sale adicionar en la pestaña valorizaciones"
  - "la valorizacion del subcontrato no aparece para autorizar el pago"
  - "como paso la valorizacion del subcontrato a documentos por pagar"
  - "donde veo cuanto se le pago a cada subcontratista por periodo"
  - "pasos para aprobar valorisacion de subcontrato en gerencia de proyectos"
aliases:
