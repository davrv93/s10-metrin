definicion: "Conjunto de actividades con fecha de inicio y fin, que necesita ser programado y valorizado (cuando tiene un presupuesto asignado) y controlado en todas sus etapas."
en_s10: "Puede registrarse desde los módulos de Almacenes, Compras, Nóminas y Gerencia de proyectos, pero los presupuestos solo se le asignan desde Gerencia de proyectos. Al registrarlo, el sistema muestra su almacén de materiales, servicios y activos. En el árbol, solo los proyectos de la carpeta Escritorio tienen activas todas las opciones de edición."
