verificacion:
  - texto: "La guía aparece en la lista de guías de egresos del escenario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s036]
errores_frecuentes:
  - sintoma: "El recurso que quiere egresar no aparece."
    solucion: "Solo los recursos del stock pueden ser utilizados en los movimientos de egreso: todo recurso debe ser ingresado antes al almacén."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s040]
  - sintoma: "La fecha del egreso está fuera del periodo de ejecución del proyecto."
    solucion: "La fecha tiene que estar dentro del periodo de ejecución del proyecto: elíjala de nuevo con el calendario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s058]
  - sintoma: "En una misma guía hay recursos para partidas de control del proyecto y para un subcontrato."
    solucion: "Use un egreso para los recursos que usarán partidas de control del proyecto y genere otro movimiento para los recursos que tienen como destino un subcontrato."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s063]
  - sintoma: "No puede eliminar o modificar la guía de egreso."
    solucion: "Para eliminarla, el estado debe estar en edición; el estado protegido evita que la guía sea modificada o eliminada."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s037]
