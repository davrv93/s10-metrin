id: gerencia-proyectos.planificar-con-ms-project
version: 1
modulo: gerencia-proyectos
titulo: "Planificar gráficamente el proyecto con el MS Project"
objetivo: "Exportar al MS Project las fases y actividades del Cronograma por Periodos, vincular allí las barras y actualizar luego el S10, que calcula los recursos."
nivel: avanzado
