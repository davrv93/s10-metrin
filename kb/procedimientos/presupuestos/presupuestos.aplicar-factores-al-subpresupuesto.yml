verificacion: []
errores_frecuentes:
  - sintoma: "Va a aplicar factores a mano de obra, materiales, equipos o subcontratos."
    solucion: "En ese caso no aplique factores a las subpartidas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s091]
  - sintoma: "Quiere deshacer los factores aplicados."
    solucion: "Use el botón **DESHACER** y luego **SALIR**. Si el factor aplicado quedó fijo, ya no permite deshacer."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s091]
  - sintoma: "No puede modificar el análisis de precios unitarios de una partida."
    solucion: "Cuando los factores han sido aplicados a la partida, el análisis de precios unitarios no puede ser modificado hasta deshacer."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s091]
  - sintoma: "Duda sobre qué valores de factor usar."
    solucion: "Si usa factores menores de 1, procure que estén dentro del rango 0.10 a 0.90; también puede usar valores mayores a 1. No use CERO como factor."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s091]
