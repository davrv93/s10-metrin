id: presupuestos.aplicar-factores-al-subpresupuesto
version: 1
modulo: presupuestos
titulo: "Aplicar factores de cantidad o de rendimiento a un presupuesto o subpresupuesto"
objetivo: "Modificar mediante factores las cantidades de los recursos en los análisis de precios unitarios, o los rendimientos de las partidas propias, de todo el presupuesto o de un subpresupuesto."
nivel: avanzado
preguntas:
  - "como bajo un 10% la mano de obra de todo el presupuesto"
  - "como se usan los factores de cantidad en el subpresupuesto"
  - "como modifico los rendimientos de todas las partidas a la vez"
  - "aplicar factor de rendimiento al subpresupuesto s10"
  - "como deshago los factores que aplique"
  - "no puedo modificar el analisis de precios despues de poner factores"
  - "puedo reducir las cantidades de materiales de todo el presupuesto con un factor"
  - "que factor pongo para bajar 10 porciento la mano de obra"
aliases:
  - "factores de cantidad"
  - "factores de rendimiento"
  - "aplicar factores al subpresupuesto"
  - "deshacer factores"
