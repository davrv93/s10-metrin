errores_frecuentes:
  - sintoma: "El horario cíclico no empieza en la semana correcta."
    solucion: "La fecha de vigencia es muy importante para iniciar el horario cíclico de acuerdo a las semanas laborables de lunes a domingo: siempre debe empezar un día lunes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s052]
  - sintoma: "El trabajador ingresó a mitad de semana."
    solucion: "Al adicionar el horario cíclico en la ficha, tenga en cuenta la fecha de vigencia: un día lunes anterior a la fecha de ingreso."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s050]
