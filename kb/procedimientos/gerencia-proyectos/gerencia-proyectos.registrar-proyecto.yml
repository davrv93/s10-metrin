prerrequisitos:
  - texto: "El usuario **sa** debe haber registrado al usuario que manejará el módulo de Gerencia de proyectos: primero en **Catálogos** – **Socio de negocios** (rama empleados) y luego en **Utilitarios**, escenario de **Mantenimiento de usuarios**, con accesos y atributos de uso."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s032]
  - texto: "Conozca el tipo de moneda del presupuesto: el proyecto debe usar el mismo tipo de moneda que se utilizó en el presupuesto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
