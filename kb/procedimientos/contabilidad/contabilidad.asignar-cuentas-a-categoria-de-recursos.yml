verificacion:
  - texto: "Al utilizar cualquier recurso relacionado a esa categoría, se contabilizará con la cuenta asignada a la categoría."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s027]
errores_frecuentes:
  - sintoma: "El recurso no contabiliza con la cuenta asignada a su categoría."
    solucion: "La búsqueda de asignación contable sigue la escala: recurso con tipo de costo, recurso sin tipo de costo, categoría con tipo de costo, categoría sin tipo de costo y genérica de inventario; si no encuentra asignación contable, va escalando la configuración."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s038]
