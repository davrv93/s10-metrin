id: analisis_de_precios_unitarios
termino: "Análisis de precios unitarios"
sinonimos: ["análisis de precio unitario", "APU"]
definicion: "Es la estructura de costo de una partida; puede estar conformado solo por recursos, por recursos y subpartidas, o solo por subpartidas."
en_s10: "Se muestra en la ventana inferior de la hoja del presupuesto, para la partida elegida. A la mano de obra se le ingresa la cuadrilla (siempre que la partida tenga rendimiento); a los materiales, la cantidad para una unidad; a los equipos, también la cuadrilla; y a las herramientas manuales, un porcentaje. Un color indica su estado: azul, sin revisión; amarillo, vacío; rojo, revisado."
procedimientos_relacionados: [presupuestos.registrar-partida-en-el-catalogo]
