id: gerencia-proyectos.valorizar-el-contrato
version: 1
modulo: gerencia-proyectos
titulo: "Valorizar el contrato y autorizar su cobranza"
objetivo: "Valorizar una vez al mes el contrato del proyecto en el escenario de Contratos, para cuantificar el avance logrado y cobrar al propietario por los trabajos ejecutados: se revisan amortizaciones y resumen, se aprueba la valorización y la autorización de cobranza se envía a Documentos por Cobrar."
nivel: avanzado
preguntas:
  - "como valorizo el contrato con el cliente en gerencia de proyectos"
  - "cómo hago la valorizacion mensual del contrato principal"
  - "como le cobro al propietario lo avanzado en el mes"
  - "como apruebo la valorizacion del contrato"
  - "como mando la valorisacion del contrato a documentos por cobrar"
  - "como amortizo el adelanto que nos dio el cliente en la valorizacion"
  - "donde imprimo la valorizacion del contrato"
  - "pasos para valorizar el contrato de obra en s10"
aliases:
  - "valorizar contrato"
  - "valorización del contrato"
  - "valorización mensual del contrato"
  - "autorización de cobranza"
  - "aprobar valorización del contrato"
entidades:
  modulo: "Gerencia de Proyectos"
  pantallas: ["Contratos", "Cronograma por Periodos", "Documentos por Cobrar"]
  objetos: ["contrato", "valorización", "adelanto", "pago a cuenta", "retenciones"]
prerrequisitos:
  - texto: "Previamente, en el escenario del Cronograma por periodos y en modo valorización, ingrese los avances logrados en el periodo; caso contrario, el sistema permite ingresar el monto de la valorización."
