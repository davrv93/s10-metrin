  - sintoma: "Un usuario no ve un presupuesto registrado por otro."
    solucion: "Solo la persona que registra el presupuesto tiene acceso a él; debe invitar a los otros usuarios para que compartan su elaboración."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s134]
  - sintoma: "No se puede eliminar un registro de un catálogo."
    solucion: "Solo se puede eliminar un registro cuando no está participando en una aplicación."
