id: gerencia-proyectos.registrar-factura-del-subcontratista
version: 1
modulo: gerencia-proyectos
titulo: "Registrar la factura del subcontratista por pagos a cuenta"
objetivo: "Registrar en el sistema la factura presentada por el subcontratista y relacionarla al adelanto; es el mismo procedimiento para el adelanto en efectivo, los pagos a cuenta y la valorización."
