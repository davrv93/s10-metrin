prerrequisitos:
  - texto: "La hoja del presupuesto debe tener sus títulos, partidas y metrados registrados."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s037]
  - texto: "Las opciones de procesamiento se configuran en la ventana de configuración, que es atributo del **sa**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046]
pasos:
  - n: 1
    id: "presupuestos.procesar-presupuesto#1"
    accion: "Si es **sa**, use el botón de configuración (o **Shift+F1**) y verifique las opciones de procesamiento, por ejemplo **Verifica Metrados**, **Verifica Análisis de Precios Unitarios** y **Verifica Precios Recursos**."
    donde: "Ventana de configuración"
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046, "7c40a9548710-0048", "7c40a9548710-0116"]
