id: nominas.registrar-tareo-estandar
version: 1
modulo: nominas
titulo: "Registrar el tareo estándar con ayuda de Excel"
objetivo: "Registrar las horas trabajadas por cada obrero en una partida de control durante un periodo (semana), exportando el tareo del S10 a Excel y volviéndolo a importar."
nivel: intermedio
preguntas:
  - "cómo registro el tareo de mano de obra en nóminas"
  - "como hago el tareo semanal de los obreros"
  - "como exporto el tareo a excel y lo vuelvo a importar"
  - "cómo registro las horas trabajadas por partida de control"
  - "como asigno el formato de tareo de mano de obra a la empresa"
  - "tareo estandar paso a paso en s10"
  - "como importo el tareo desde excel al s10"
  - "como registro horas extra al 60 en el tareo"
  - "como se ase el tareo de obreros"
aliases:
  - "tareo estándar"
  - "registrar tareo"
  - "tareo de mano de obra"
  - "registrar horas trabajadas"
  - "importar tareo de Excel"
entidades:
  modulo: "Nóminas"
  pantallas: ["Tareo Estándar", "Catálogo de Formatos por Empresa"]
  objetos: ["tareo", "partida de control", "obrero", "horas trabajadas", "tipo de hora"]
prerrequisitos:
  - texto: "Registre en el servidor una carpeta donde guardará los archivos en Excel que contienen los tareos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s057]
  - texto: "Los obreros deben estar elegidos en el escenario Personal Disponible, con su información registrada en la ficha personal; en el tareo estándar los tareos se realizan desde el PROYECTO, que tiene partidas de control."
    fuente: [img-1260dd9d5bfd-0000, web-https-documentacion-s10peru-com-manual-d-s056]
