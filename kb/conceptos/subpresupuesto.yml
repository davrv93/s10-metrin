id: subpresupuesto
termino: "Subpresupuesto"
sinonimos: ["subpresupuestos"]
definicion: "Componente de un presupuesto, como Estructuras, Gastos generales o Instalaciones eléctricas y sanitarias. Al registrar un presupuesto, el sistema crea automáticamente un subpresupuesto con el mismo nombre, que el usuario debe editar y cambiar."
en_s10: "En la hoja del presupuesto todas las opciones de edición están disponibles para el subpresupuesto, y el menú Hoja del presupuesto solo se habilita con el cursor sobre un subpresupuesto en el árbol (desde ahí se generan los ítems y se procesa su contenido). El diseño del pie de presupuesto puede servir para todos los subpresupuestos o elaborarse para cada uno."
procedimientos_relacionados: [presupuestos.registrar-presupuesto-nuevo]
