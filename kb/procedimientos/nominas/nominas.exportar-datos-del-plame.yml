id: nominas.exportar-datos-del-plame
version: 1
modulo: nominas
titulo: "Obtener y exportar los datos del PLAME"
objetivo: "Obtener en el escenario de Planilla Electrónica los datos de la Planilla Mensual de Pagos (PLAME) por estructura y periodo, exportarlos a Excel y elaborar la declaración jurada en el programa de la SUNAT."
nivel: intermedio
preguntas:
  - "como saco la info del plame desde nominas"
  - "que estructuras del plame se usan mas"
  - "como exporto a excel la estructura 18 de ingresos tributos y descuentos"
  - "donde obtengo los datos de la planilla mensual de pagos"
  - "necesito los datos del plame del mes pasado, como hago"
  - "el plame se hace antes o despues del t-registro"
  - "donde se declara el plame que saco del s10"
  - "como sacar el plame resumido o detallado"
aliases:
  - "PLAME"
  - "planilla mensual de pagos"
  - "exportar PLAME"
  - "planilla electrónica PLAME"
entidades:
  modulo: "Nóminas"
  pantallas: ["Planilla Electrónica"]
  objetos: ["PLAME", "estructura", "periodo", "declaración jurada"]
prerrequisitos:
  - texto: "La PLAME se elabora obligatoriamente a partir de la información consignada en el T-REGISTRO."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
  - texto: "El usuario que ingrese al escenario debe estar registrado en el módulo de Facturación y tener los permisos correspondientes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s081]
pasos:
  - n: 1
    id: "nominas.exportar-datos-del-plame#1"
    accion: "Ingrese al escenario **Planilla Electrónica** de la empresa."
    fuente: [img-1af216c05f52-0000, web-https-documentacion-s10peru-com-manual-d-s080, web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
