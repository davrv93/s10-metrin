    pagina: null
  - n: 7
    id: "presupuestos.registrar-indices-unificados#7"
    accion: "En la ventana inferior, registre los valores de los índices unificados para cada área geográfica."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s118, "7c40a9548710-0189"]
    pagina: null
  - n: 8
    id: "presupuestos.registrar-indices-unificados#8"
    accion: "Para traer los valores desde una hoja Excel, haga clic derecho en la ventana de los índices y elija **Importar desde Microsoft Excel**."
