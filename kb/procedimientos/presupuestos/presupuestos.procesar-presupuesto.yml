verificacion:
  - texto: "Después de procesar, el subpresupuesto se pinta en el árbol de color rojo si el presupuesto está concluido, o de amarillo si se configuró la fórmula polinómica y aún falta elaborarla."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s032]
errores_frecuentes:
  - sintoma: "Al procesar, el sistema envía un mensaje pidiendo un dato: faltan metrados en la hoja del presupuesto, o aportes (cantidades) o precios de recursos en el análisis de precios unitarios."
    solucion: "Registre el dato que pide, cierre la ventana y vuelva a procesar el presupuesto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
  - sintoma: "Los precios no corresponden después de cambiar la fecha o el lugar del presupuesto."
    solucion: "Los precios de los recursos se almacenan de acuerdo al lugar y la fecha, además de por presupuesto: revise esos datos del presupuesto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s052]
