errores_frecuentes:
  - sintoma: "Reprograma el proyecto todas las semanas."
    solucion: "No se debe reprogramar todas las semanas: el parámetro para reprogramar el proyecto es un atraso del 10%."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s095]
  - sintoma: "Trabaja en LAN con el cliente y el servidor usando versiones distintas del MS Project."
    solucion: "Si trabaja en LAN, el cliente y el servidor deben tener la misma versión del MS Project; si se conecta mediante escritorio remoto, solo usa los recursos del servidor."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s085]
  - sintoma: "El proyecto usa doble moneda o jornadas diferentes en las partidas."
    solucion: "El MS Project no soporta doble moneda, tampoco jornadas diferentes (número de horas del día) en las partidas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s085]
