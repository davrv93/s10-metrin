id: compras.registrar-pedido-a-almacen-a-partida-de-control
version: 1
modulo: compras
titulo: "Registrar un pedido manual A Almacén hacia una partida de control"
objetivo: "Registrar desde el almacén de un proyecto un pedido manual A Almacén de recursos que tienen stock, asignando a cada recurso su Partida de Control + Destino Específico, y dejarlo para que el aprobador lo apruebe."
nivel: intermedio
preguntas:
  - "como hago un pedido a almacen para una partida de control"
  - "quiero sacar material que ya hay en stock del almacen, como hago el pedido"
  - "como asigno partida de control y destino especifico en el pedido"
  - "pedido manual a almacen en compras y pedidos paso a paso"
  - "me sale un mensaje que el sistema esta configurado para pedidos a compras, que hago"
  - "como elijo quien aprueba el pedido a almacen"
  - "pedido a almasen con transferencia a otro proyecto"
  - "soy residente de obra, donde apruebo los pedidos a almacen que me mandan"
aliases:
  - "pedido a almacén"
  - "pedido manual a almacén"
  - "pedido a partida de control"
  - "pedido de stock"
entidades:
  modulo: "Compras"
  pantallas: ["Pedidos", "Aprobadores para el pedido"]
  objetos: ["pedido", "partida de control", "destino específico", "recurso", "almacén", "aprobador"]
prerrequisitos:
  - texto: "El que aprueba los pedidos debe estar previamente registrado en el sistema."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s055]
  - texto: "Deben estar registrados el proyecto y sus Partidas de Control: las Partidas de Control y Destinos Específicos se usan para los Pedidos a Almacén."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s017]
  - texto: "El recurso debe tener stock; el proyecto no necesita estar programado en el escenario del Cronograma por periodos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s055]
