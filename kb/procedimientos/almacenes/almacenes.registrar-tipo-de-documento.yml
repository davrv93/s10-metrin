    pagina: null
  - n: 10
    id: "almacenes.registrar-tipo-de-documento#10"
    accion: "Elija el signo (el signo positivo afecta la base imponible y el negativo no altera ningún importe) e ingrese la tasa del impuesto en porcentaje."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 11
    id: "almacenes.registrar-tipo-de-documento#11"
    accion: "Seleccione **Obligatorio** para que el impuesto se aplique siempre al documento, seleccione la vigencia del impuesto y, si quiere, ingrese una observación."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
  - n: 12
    id: "almacenes.registrar-tipo-de-documento#12"
    accion: "Use el botón para grabar los datos y cerrar la ventana; luego cierre el catálogo de Tipo de Documentos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
