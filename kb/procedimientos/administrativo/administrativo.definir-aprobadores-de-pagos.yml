  - "como pongo el monto maximo que puede aprobar un usuario"
  - "dónde se configura quién autoriza los pagos en administrativo"
  - "cómo asigno la moneda y el monto para aprobación"
  - "un usuario no puede aprobar las ordenes de pago que hago"
  - "como habilito el check autoriza pago"
  - "como hago aprovador a un usuario en s10"
  - "pasos para definir aprobadores en el módulo administrativo"
aliases:
  - "definir aprobadores"
  - "aprobador de pagos"
  - "autoriza pago"
  - "monto máximo de aprobación"
