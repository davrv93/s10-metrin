id: instalacion.actualizar-s10-con-revisiones
version: 1
modulo: instalacion
titulo: "Actualizar el S10 instalando las revisiones"
objetivo: "Mantener el S10 actualizado con las revisiones completas en un equipo que ya tiene la instalación, ejecutándolas una por una en orden numérico."
nivel: intermedio
preguntas:
  - "como actualizo el s10 a la ultima revision"
  - "en que orden instalo las revisiones del s10"
  - "como se cual es la ultima revision que tengo instalada"
  - "me salio acceso denegado al instalar la revision"
  - "al instalar la revision dice que hay modulos ejecutandose"
  - "puedo saltarme revisiones o tengo que ponerlas todas"
  - "a que hora conviene actualizar el s10 si hay varios usuarios"
  - "una revision me dio error, sigo con la siguiente?"
  - "como actualizo el sistema con las revisiones nuebas"
aliases:
  - "actualizar S10"
  - "instalar revisiones"
  - "actualización de revisiones"
  - "aplicar revisión"
entidades:
  modulo: "Instalación"
  pantallas: ["Panel de Control", "Administrador de tareas"]
  objetos: ["revisión", "antivirus", "Control de cuentas de usuario"]
prerrequisitos:
  - texto: "Si el software es usado por múltiples usuarios, realice la actualización en un horario en que no estén trabajando: temprano antes del inicio de labores, en la hora de almuerzo o en la noche."
    fuente: [web-https-documentacion-s10peru-com-actualiz-s000]
  - texto: "Tenga permisos de Administrador, el antivirus desactivado y el Control de cuentas de usuario inactivo."
    fuente: [web-https-documentacion-s10peru-com-actualiz-s000]
