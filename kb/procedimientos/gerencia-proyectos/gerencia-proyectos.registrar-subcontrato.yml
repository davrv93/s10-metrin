    sub:
      - n: 1
        id: "gerencia-proyectos.registrar-subcontrato#4.1"
        accion: "En **Descripcion**, registre el nombre del subcontrato (acepta 240 caracteres)."
        fuente: [img-dd752e274974-0000, web-https-documentacion-s10peru-com-manual-d-s145]
        pagina: null
      - n: 2
        id: "gerencia-proyectos.registrar-subcontrato#4.2"
        accion: "Use el botón de **Subcontratista** para elegir su nombre del catálogo de socio de negocio."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
        pagina: null
      - n: 3
        id: "gerencia-proyectos.registrar-subcontrato#4.3"
        accion: "Use el botón para elegir el tipo de **moneda** del subcontrato."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
        pagina: null
      - n: 4
        id: "gerencia-proyectos.registrar-subcontrato#4.4"
        accion: "Use el botón para elegir la **especialidad** del subcontrato, que sirve para agrupar la información."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s145]
        pagina: null
      - n: 5
        id: "gerencia-proyectos.registrar-subcontrato#4.5"
        accion: "Ingrese el porcentaje de adelanto que se le otorgará al subcontratista; marque **REQUIERE GARANTIA** solo si registrará el documento bancario de garantía."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s145, web-https-documentacion-s10peru-com-manual-d-s146]
        pagina: null
      - n: 6
        id: "gerencia-proyectos.registrar-subcontrato#4.6"
        accion: "Use el botón para elegir el recurso que debe ser utilizado en la factura."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s146]
        pagina: null
      - n: 7
        id: "gerencia-proyectos.registrar-subcontrato#4.7"
        accion: "Ingrese el porcentaje de retención que realizará de las valorizaciones (la retención es temporal)."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s146]
        pagina: null
      - n: 8
        id: "gerencia-proyectos.registrar-subcontrato#4.8"
        accion: "Ingrese la fecha de la firma del subcontrato, la fecha de inicio de los trabajos y la fecha prevista de finalización."
        fuente: [web-https-documentacion-s10peru-com-manual-d-s146]
        pagina: null
  - n: 5
    id: "gerencia-proyectos.registrar-subcontrato#5"
    accion: "En la ventana inferior, elija la pestaña **ACTIVIDADES**, haga clic derecho y elija **Adicionar recursos**."
    resultado: "Si el proyecto no tiene techo, se muestran los recursos del catálogo; si tiene techo, los recursos de los presupuestos asignados al proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s146, img-2231bbc4639a-0000]
    pagina: null
