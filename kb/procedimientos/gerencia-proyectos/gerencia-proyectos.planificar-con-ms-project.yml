errores_frecuentes:
  - sintoma: "El S10 no toma los datos del MS Project."
    solucion: "En el MS Project no use Guardar como, porque cambia la ruta y el S10 puede no tomar los datos; guarde con el botón que graba el archivo en la base de datos del S10."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s087]
  - sintoma: "Necesita insertar o quitar tareas en el MS Project."
    solucion: "No inserte ni quite tareas en el MS Project: si desea hacerlo, ingrese al escenario de Actividades."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s087]
  - sintoma: "El proyecto usa doble moneda o jornadas diferentes en las partidas."
    solucion: "El MS Project no soporta doble moneda ni jornadas diferentes en las partidas (número de horas del día)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s085]
