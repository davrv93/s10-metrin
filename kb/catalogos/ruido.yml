# RUIDO de entrenamiento: la clase «ninguno». Frases que NO son de ninguna intención de Metrín: temas ajenos a S10 y a la
# obra (fuera_de_dominio, la intención 20 de la especificación) y basura (teclazos, pruebas, fragmentos sin sentido).
# El clasificador la entrena como una intención más, «ninguno»: si gana, Metrín usa la plantilla FUERA_DE_DOMINIO y no
# busca en los manuales. SINTÉTICO. Distinto de la sección `ninguno` de intenciones_prueba.yml, que mide falsos
# positivos y nunca entra aquí.
#
# NO va aquí nada que pertenezca a una intención: ni saludos, ni cortesías, ni preguntas de construcción general
# («¿cómo calculo el concreto de una losa?» es del dominio: va a RAG y, sin evidencia, a SIN_EVIDENCIA).
# Hay negativos difíciles a propósito: palabras que también existen en S10 usadas en otro sentido («licencia de
# conducir», «el dólar hoy», «planificar vacaciones»).
# Toda frase debe tener al menos una pieza que el embebedor conozca (si no, el entrenamiento falla con ErrSinPiezas).

catalogo: intenciones_metrin
clase: ninguno
version: 1
sintetico: true

fuera_de_dominio:
