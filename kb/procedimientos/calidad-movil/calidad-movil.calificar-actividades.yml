id: calidad-movil.calificar-actividades
version: 1
modulo: calidad-movil
titulo: "Calificar las actividades y sus características en Calidad Móvil"
objetivo: "Calificar desde el móvil, en Calidad de Responsables, las actividades y sus características cambiando su estado, y registrar las no conformidades con su tipo de falla."
nivel: intermedio
preguntas:
  - "cómo califico las actividades en calidad móvil"
  - "donde cambio el estado de una caracteristica en la app de calidad"
  - "como registro una no conformidad desde el celular"
  - "como marco una actividad como no conforme y le pongo foto"
  - "para que sirve calidad de responsables en calidad movil"
  - "como veo las actividades por frente o por etapa en calidad movil"
  - "soy revisor, como apruevo las caracteristicas en la app"
  - "que significan los colores de las barras en calidad movil"
aliases:
  - "calificar actividades"
  - "calidad de responsables"
  - "registrar no conformidad"
  - "cambiar estado de característica"
  - "revisar actividades en el móvil"
entidades:
  modulo: "Calidad Móvil"
