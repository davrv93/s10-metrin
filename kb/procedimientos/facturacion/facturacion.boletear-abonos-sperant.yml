  - sintoma: "El sistema no permite hacer el Cambio de Titular."
    solucion: "Si uno de los abonos cuenta con Boleta, los demás abonos también deben estar boleteados; caso contrario no permitirá hacer el cambio."
    fuente: [web-https-documentacion-s10peru-com-boletaje-s001]
