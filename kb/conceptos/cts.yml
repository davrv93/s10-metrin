id: cts
termino: "CTS (Compensación por tiempo de servicios)"
sinonimos: ["Compensación por tiempo de servicios"]
definicion: "Compensación por tiempo de servicios. En los manuales oficiales de S10 aparece como uno de los conceptos que se eligen al preparar una boleta de liquidación en el módulo de Nóminas, junto a los beneficios sociales, las gratificaciones y los reintegros de vacaciones."
en_s10: "El módulo de Nóminas genera, a solicitud del empleado o por directiva de la empresa, documentos como la carta de CTS. Entre los tipos de cuenta bancaria de un socio de negocio está la cuenta CTS (escenario Cuentas Bancarias del Socio Negocio)."
procedimientos_relacionados: []
fuente:
