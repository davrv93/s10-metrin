errores_frecuentes:
  - sintoma: "No puede asignar atributos de uso a otro usuario."
    solucion: "Solo el usuario que tiene la categoría de jefe de grupo tiene la facultad de asignar atributos de uso."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s052]
  - sintoma: "El usuario que quiere sumar al grupo de trabajo no tiene acceso al proyecto."
    solucion: "Debe estar registrado en el Catálogo de Socio de Negocio y luego, en el grupo de Utilitarios – Mantenimiento de Usuarios, tener acceso al módulo de Gerencia de proyectos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s052]
  - sintoma: "El usuario no puede pedir ni aprobar pedidos."
    solucion: "El usuario que pide y el que aprueba deben estar registrados en el módulo de almacenes y tener atributos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s112]
