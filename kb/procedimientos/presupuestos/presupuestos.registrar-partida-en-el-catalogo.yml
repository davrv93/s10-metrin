  - n: 4
    id: "presupuestos.registrar-partida-en-el-catalogo#4"
    accion: "En **descripción**, registre el nombre de la partida (hasta 250 caracteres); en **descripción alterna** puede registrarlo en un idioma alterno."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
  - n: 5
    id: "presupuestos.registrar-partida-en-el-catalogo#5"
    accion: "Con el botón del **catálogo de unidades**, elija la unidad que corresponde a la partida."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
  - n: 6
    id: "presupuestos.registrar-partida-en-el-catalogo#6"
    accion: "En **especialidad**, asigne una especialidad a la partida (por ejemplo, Edificaciones), registrada previamente en su catálogo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
  - n: 7
    id: "presupuestos.registrar-partida-en-el-catalogo#7"
    accion: "En **grupo**, elija **Partida** (sus análisis tienen mano de obra, materiales, equipos y subcontratos) o **Estimada** (sus componentes son índices globales en % del precio unitario)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
  - n: 8
    id: "presupuestos.registrar-partida-en-el-catalogo#8"
    accion: "En **tipo**, elija **sin asignar**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s080]
    pagina: null
  - n: 9
    id: "presupuestos.registrar-partida-en-el-catalogo#9"
    accion: "Revise la **jornada diaria** (el sistema asume 8 horas); el **peso** solo se ingresa en partidas de electromecánicas."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s081]
    pagina: null
  - n: 10
    id: "presupuestos.registrar-partida-en-el-catalogo#10"
    accion: "Use el botón **adicionar** para grabar el contenido de la ventana y cerrarla."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s081]
    pagina: null
  - n: 11
    id: "presupuestos.registrar-partida-en-el-catalogo#11"
    accion: "Registre el rendimiento: ingrese el de la mano de obra y el del equipo (por defecto el sistema registra el mismo para ambos)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s081]
    pagina: null
