modulo: compras
titulo: "Enviar a aprobación y aprobar una orden de compra"
objetivo: "Enviar a aprobación la orden de compra generada y aprobarla en el escenario de Orden de Compra: solo las órdenes de compra aprobadas pasan al módulo de Almacenes para hacer un Ingreso por Orden de Compra."
