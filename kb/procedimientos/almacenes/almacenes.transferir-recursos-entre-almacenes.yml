  - "cómo ingreso en el almacén destino lo que me mandó el otro almacén"
  - "no me sale la guia de egreso para hacer el ingreso por transferencia interna"
  - "transferencia entre almacenes s10 pasos"
  - "como registro el traslado de recursos entre almacenes del mismo proyecto"
  - "transferencia interna con pedido como se hace"
