prerrequisitos:
  - texto: "La empresa debe tener registradas sus Partidas de Control General en el catálogo **Partida de Control General**: a cada Partida de Control del proyecto se le asigna una."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s130, img-b09491ef1c1a-0000]
  - texto: "Si en el módulo de Gerencia de proyectos ya se efectuó el registro de las Partidas de Control, la información ya se visualiza en el módulo de Almacenes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s129]
