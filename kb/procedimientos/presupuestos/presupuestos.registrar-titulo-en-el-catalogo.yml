id: presupuestos.registrar-titulo-en-el-catalogo
version: 1
modulo: presupuestos
titulo: "Registrar un título nuevo en el catálogo de títulos"
objetivo: "Registrar en el catálogo de títulos un título que no existe, por ejemplo «MUROS Y TABIQUES», ya sea con un nuevo registro o duplicando un título existente."
nivel: basico
preguntas:
  - "como creo un titulo nuevo en el catalogo de titulos"
  - "no encuentro el titulo que necesito, como lo registro"
  - "como agrego el titulo muros y tabiques al catalogo"
  - "registrar titulo nuevo en s10 presupuestos"
  - "como duplico un titulo para crear otro"
  - "donde esta el catalogo de titulos"
  - "como ago un titulo que no existe en el catalago"
aliases:
  - "registrar título"
  - "nuevo título en el catálogo"
  - "catálogo de títulos"
  - "crear título"
entidades:
  modulo: "Presupuestos"
  pantallas: ["Catálogo de Títulos", "Hoja del Presupuesto"]
  objetos: ["título", "catálogo de títulos"]
