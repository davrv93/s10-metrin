errores_frecuentes:
  - sintoma: "No encuentra en el S10 un reporte que imprimió antes."
    solucion: "El S10 no guarda los reportes: si necesita archivarlos o enviarlos, expórtelos a partir de una vista previa."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s071]
  - sintoma: "El monto presupuestado de la hoja del presupuesto no coincide con el del listado de recursos."
    solucion: "Se debe a los redondeos; en el grupo PRESUPUESTO DESCOMPUESTO, la vista preliminar o impresión de los recursos tiene implementadas opciones de redondeo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s073]
