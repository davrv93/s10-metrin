id: nominas.calcular-reparto-de-utilidades
version: 1
modulo: nominas
titulo: "Calcular el reparto de utilidades y generar su liquidación"
objetivo: "Calcular en el escenario Reparto de Utilidades el porcentaje de la renta neta de la empresa que corresponde a cada trabajador por días trabajados y por monto ganado, y generar el documento Liquidación de la Distribución de Utilidades."
nivel: avanzado
preguntas:
  - "como calculo las utilidades de los trabajadores en nominas"
  - "como hago el reparto de utilidades del año"
  - "donde configuro los dias trabajados y el monto ganado para utilidades"
  - "como genero la liquidacion de utilidades para cada trabajador"
  - "que conceptos suman dias trabajados para las utilidades"
  - "el descanso por maternidad cuenta para utilidades?"
  - "como saco la constancia de distribucion de utilidades en word"
  - "como genero la planilla de pago de las utilidades"
  - "reparto de utilidade paso a paso"
  - "donde pongo el monto total de utilidades a repartir"
aliases:
  - "reparto de utilidades"
  - "calcular utilidades"
  - "liquidación de utilidades"
  - "distribución de utilidades"
  - "utilidades de los trabajadores"
