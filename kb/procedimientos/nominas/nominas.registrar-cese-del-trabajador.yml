  - "sigue saliendo en el tareo un obrero que ya se fue, que hago"
  - "de donde toma la fecha de cese para la liquidacion"
  - "como cambio la fecha de ingreso del trabajador al proyecto"
  - "como cesar a un trabajdor en s10"
aliases:
  - "fecha de cese"
  - "cesar trabajador"
  - "dar de baja trabajador"
  - "motivo de cese"
  - "fecha de ingreso al proyecto"
