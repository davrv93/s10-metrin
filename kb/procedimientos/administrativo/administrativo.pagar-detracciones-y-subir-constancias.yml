errores_frecuentes:
  - sintoma: "Al hacer el pago aparece la observación de un socio de negocio sin cuenta bancaria."
    solucion: "Visualícelo y agréguele la cuenta desde el pago (clic derecho, Propiedades); de lo contrario será una restricción para continuar con el pago."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042]
  - sintoma: "Aparece la advertencia de proyectos sin correo electrónico."
    solucion: "Es una advertencia para que el TXT que se envía al banco contenga el correo de alerta a los beneficiarios; no es obligatorio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042]
  - sintoma: "Hizo un cambio posterior al pago y el TXT ya no está actualizado."
    solucion: "Desde el escenario de Pagos es posible generar nuevamente el archivo TXT de pago electrónico del pago tipo Tributos; así se actualiza la información del TXT."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
