id: presupuestos.elaborar-formula-polinomica
version: 1
modulo: presupuestos
titulo: "Elaborar la fórmula polinómica del presupuesto"
objetivo: "Obtener la fórmula polinómica que, con los índices unificados del INEI, da el «K» para actualizar el costo de la obra desde la fecha del presupuesto base en las valorizaciones."
