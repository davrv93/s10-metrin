errores_frecuentes:
  - sintoma: "El trabajador no aparece para elegirlo como personal disponible."
    solucion: "Solo los trabajadores registrados en el catálogo pueden ser elegidos como personal disponible: regístrelo primero en el Catálogo de Socio de Negocio por tipo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s040]
  - sintoma: "No se puede eliminar un socio de negocio registrado."
    solucion: "Solo se puede eliminar siempre y cuando no exista relación con algún escenario del S10 ERP."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s040]
  - sintoma: "No se puede eliminar una cuenta bancaria del socio de negocio."
    solucion: "Solo se puede eliminar si no existe relación con algún movimiento bancario en el S10 ERP."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s041]
