  - n: 6
    id: "gerencia-proyectos.registrar-proyecto#6"
    accion: "En **Propietario**, use el botón para elegir o registrar el nombre del propietario del proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042, img-0275c8a0543f-0000]
    pagina: null
  - n: 7
    id: "gerencia-proyectos.registrar-proyecto#7"
    accion: "En **Lugar**, use el botón y del catálogo elija el distrito donde se ejecutará el proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042, img-0275c8a0543f-0000]
    pagina: null
  - n: 8
    id: "gerencia-proyectos.registrar-proyecto#8"
    accion: "En **Fecha Inicio**, ingrese la fecha de inicio del proyecto: este dato sirve para generar los períodos semanales y mensuales."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043, img-0275c8a0543f-0000]
    pagina: null
  - n: 9
    id: "gerencia-proyectos.registrar-proyecto#9"
    accion: "No ingrese la **Fecha Fin**: el sistema la calcula automáticamente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043, img-3752e7977451-0000]
    pagina: null
  - n: 10
    id: "gerencia-proyectos.registrar-proyecto#10"
    accion: "En **Plazo**, ingrese los días calendario que está previsto dure la ejecución del proyecto; es un dato tentativo inicial que sirve para generar los períodos a partir de la fecha de inicio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043, img-0275c8a0543f-0000]
    pagina: null
  - n: 11
    id: "gerencia-proyectos.registrar-proyecto#11"
    accion: "Elija el día en que comienza la semana para efectos del pago de planillas; se recomienda que todos los proyectos empiecen el mismo día."
    resultado: "Cuando el sistema genere los períodos semanales, la semana iniciará el día que eligió."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
    pagina: null
  - n: 12
    id: "gerencia-proyectos.registrar-proyecto#12"
    accion: "Elija el mismo tipo de moneda que utilizó en el presupuesto y, en **M.Secundaria**, el tipo de moneda alterno que utilizará el módulo de almacenes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043, img-0275c8a0543f-0000]
    pagina: null
  - n: 13
    id: "gerencia-proyectos.registrar-proyecto#13"
    accion: "En **Empresa**, ingrese la empresa que ejecutará el proyecto y, si tiene sucursales, elija la que corresponde."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043, img-0275c8a0543f-0000]
    pagina: null
  - n: 14
    id: "gerencia-proyectos.registrar-proyecto#14"
    accion: "Ingrese la dirección donde el proveedor entregará los recursos comprados (se muestra en la orden de compra) y el teléfono y el fax del local donde funcionan las oficinas del proyecto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
    pagina: null
  - n: 15
    id: "gerencia-proyectos.registrar-proyecto#15"
    accion: "Use el botón que graba el contenido de la ventana y la cierra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s044]
    pagina: null
  - n: 16
    id: "gerencia-proyectos.registrar-proyecto#16"
    accion: "En el **Catálogo de proyectos**, haga doble clic sobre el nombre del proyecto para trasladarlo al árbol del escenario de **Datos generales**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s044]
    pagina: null
verificacion:
  - texto: "El proyecto aparece en el árbol del escenario de Datos generales."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s044]
errores_frecuentes:
  - sintoma: "Necesita cambiar la fecha de inicio de un proyecto que ya tiene información registrada."
    solucion: "Si ya tiene información registrada en cualquiera de los módulos, no modifique esta fecha: la fecha de inicio real del proyecto se modifica en el MS Project."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
  - sintoma: "El proyecto requiere más tiempo que el plazo registrado."
    solucion: "Incremente el número de días y luego, en el escenario de PERIODOS, procese y refresque para incrementar los periodos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s043]
