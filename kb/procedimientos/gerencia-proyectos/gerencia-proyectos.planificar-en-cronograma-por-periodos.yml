modulo: gerencia-proyectos
titulo: "Planificar el proyecto en el Cronograma por Periodos"
objetivo: "Programar manualmente el proyecto ingresando porcentajes o metrados (no costo) en los periodos a programar, mensuales en la rama venta y semanales en la rama meta, y calcular los recursos según los análisis de precios unitarios."
