id: administrativo.registrar-estado-bancario-manual
version: 1
modulo: administrativo
titulo: "Registrar el estado bancario manual y conciliarlo"
objetivo: "Registrar a mano el estado bancario de una cuenta y relacionar sus líneas con las operaciones de los diarios de caja y los pagos para dejarlas conciliadas."
nivel: avanzado
