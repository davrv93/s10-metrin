errores_frecuentes:
  - sintoma: "El trabajador que ya no labora sigue apareciendo en los tareos."
    solucion: "Registre su fecha de cese en la pestaña Ingresos de la ficha; también puede quitar la selección de activo en la pestaña General, y el trabajador ya no es mostrado en los tareos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s050, web-https-documentacion-s10peru-com-manual-d-s047]
  - sintoma: "El trabajador cambió de AFP."
    solucion: "Eso no es el cese laboral: en la pestaña Afiliaciones de la ficha RR.HH. ingrese la fecha de cese de la afiliación cuando cambie de AFP."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
