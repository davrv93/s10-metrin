id: presupuesto_venta
termino: "Presupuesto venta"
sinonimos: ["presupuesto oferta"]
definicion: "Es el presupuesto que se entrega al propietario del proyecto. Es el que lleva el diseño del pie de presupuesto, con gastos generales, utilidad e impuestos, y la fórmula polinómica."
en_s10: "En Gerencia de proyectos se asigna a la rama Venta del proyecto, donde toda la información es para el propietario; en esa rama el sistema registra automáticamente las fases del WBS conservando la estructura del presupuesto, y se usa para las valorizaciones que se entregan al propietario. Para este presupuesto se recomienda el cálculo analítico de gastos generales."
ejemplo: "En edificaciones, las partidas de instalaciones eléctricas y sanitarias del presupuesto venta van por puntos, para estimar el costo, y en su análisis de precios unitarios la mano de obra va por hh y los materiales solo sirven para asumir un costo aproximado."
procedimientos_relacionados: [presupuestos.registrar-presupuesto-nuevo]
