errores_frecuentes:
  - sintoma: "No se puede registrar una segunda valorización del contrato en el mismo periodo."
    solucion: "Solo se permite una valorización por periodo: el contrato se valoriza una vez cada mes."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s249, web-https-documentacion-s10peru-com-manual-d-s252]
  - sintoma: "La amortización de un adelanto recibido como pago a cuenta no aparece en la valorización."
    solucion: "Esa amortización es manual: elija el adelanto del catálogo de pagos a cuenta. Solo la amortización de los adelantos en efectivo es automática."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s252]
