id: presupuestos.disenar-cabeceras-de-reportes
version: 1
modulo: presupuestos
titulo: "Diseñar las cabeceras de los reportes"
objetivo: "Registrar para un presupuesto una cabecera propia para los reportes, hasta en 10 líneas con el tipo, color y tamaño de letra, en lugar del diseño estándar que viene por defecto."
nivel: intermedio
preguntas:
  - "cómo cambio la cabecera de los reportes en s10 presupuestos"
  - "quiero poner el nombre de mi empresa arriba del reporte del presupuesto"
  - "como diseño el encabezado de los reportes del presupuesto"
  - "dónde se configura la cabecera para reportes"
  - "el reporte sale con la cabecera por defecto, como uso la mia"
  - "como cambio el tipo de letra y el color del encabezado del reporte"
  - "como hago una cabezera personalizada para el resumen del presupuesto"
  - "puedo poner otra cabecera en el analisis de precios unitarios impreso"
  - "imprimir con diseño de cabecera para que sirve"
aliases:
  - "diseño de cabeceras"
  - "cabeceras para reportes"
  - "encabezado de reportes"
  - "imprimir con diseño de cabecera"
entidades:
  modulo: "Presupuestos"
  pantallas: ["Cabeceras para reportes", "Configuración Presupuestos"]
  objetos: ["cabecera", "reporte", "presupuesto"]
