errores_frecuentes:
  - sintoma: "No puede ingresar datos en la grilla del cronograma."
    solucion: "Para ingresar información elija modo porcentaje o metrado: el sistema no permite el ingreso de información en modo costo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s083, img-df5affe5f045-0000]
  - sintoma: "Cambió el presupuesto y usa pedidos automáticos."
    solucion: "Use el botón para tomar los cambios en el escenario de Actividades; luego, en el Cronograma por periodos en modo programado metrado, haga clic derecho sobre una celda con datos y elija Recalcular por escala; después ingrese al escenario de Techo para que refresque los recursos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s111]
