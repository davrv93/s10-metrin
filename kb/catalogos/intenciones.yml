      - "que es una detraccion"
      - "¿Qué es un centro de costo?"
      - "qué significa asiento contable"
      - "que es el monomio en la formula polinomica"
      - "¿qué quiere decir 'título' dentro del presupuesto?"
      - "explícame qué es el lookahead"
      - "qué es last planner"
      - "q significa WBS"
      - "¿Qué es una orden de compra?"
      - "que es un pedido en logística"
      - "¿qué es la utilidad en el presupuesto?"
      - "concepto de cuadrilla"
      - "qué es el factor de rendimiento"
