  - n: 3
    id: "gerencia-proyectos.registrar-proyecto#3"
    accion: "En el **Catálogo de Proyectos**, ubique el grupo de la línea de negocio que corresponde al proyecto (el árbol admite un máximo de 99 registros y cada grupo, 999 proyectos)."
    donde: "Catálogo de Proyectos"
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042, img-c7de5d040d6e-0000]
    pagina: null
  - n: 4
    id: "gerencia-proyectos.registrar-proyecto#4"
    accion: "Haga clic derecho sobre el grupo y elija la opción de nuevo subítem para ingresar los datos del proyecto."
    fuente: [img-c7de5d040d6e-0000, web-https-documentacion-s10peru-com-manual-d-s042]
    pagina: null
