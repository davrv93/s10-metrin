  - "como asigno partidas a las fases del wbs"
  - "dónde se arma la edt del proyecto en s10"
  - "como hago el faseado del proyecto"
  - "como verifico que todas las partidas esten asignadas a una fase"
  - "como defino los niveles y digitos de las fases"
  - "asignar actividades a fases del wbs en el escenario de actividades"
  - "como registro las fases del wvs"
aliases:
  - "registrar WBS"
  - "registrar fases"
  - "asignar partidas a fases"
  - "faseado del proyecto"
