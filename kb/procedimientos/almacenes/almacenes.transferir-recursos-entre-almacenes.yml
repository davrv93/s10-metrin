errores_frecuentes:
  - sintoma: "En el almacén destino no aparece la guía para hacer el ingreso."
    solucion: "**Adicionar desde Guías de Egresos** se usa cuando los almacenes que envía y recibe están conectados: el almacén que envía debe generar previamente un egreso por transferencia interna."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s055]
  - sintoma: "Los recursos transferidos deben volver al almacén que envía."
    solucion: "La transferencia es permanente, no contempla devolución: la cantidad y el costo se descargan del almacén que envía y se cargan al almacén que recibe."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s055]
