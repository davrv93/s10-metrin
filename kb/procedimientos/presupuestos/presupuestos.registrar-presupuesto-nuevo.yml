verificacion:
  - texto: "El presupuesto aparece en el árbol del escenario de Datos generales."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s035]
  - texto: "Debajo del presupuesto figura el subpresupuesto que el sistema crea automáticamente con el mismo nombre, ya editado y cambiado por usted."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s036]
errores_frecuentes:
  - sintoma: "El cliente no aparece para elegirlo."
    solucion: "Para que el nombre del cliente sea elegido, necesariamente debe estar registrado en el catálogo: regístrelo y luego elíjalo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s034]
  - sintoma: "El presupuesto meta no pasa bien al MS Project."
    solucion: "En el presupuesto meta use la misma jornada diaria en todas las partidas y una sola moneda: el MS Project no acepta jornadas diferentes y acepta una sola moneda."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s034, web-https-documentacion-s10peru-com-manual-d-s035]
