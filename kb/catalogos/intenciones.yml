# Catálogo de INTENCIONES de Metrín (asistente instruccional de S10 ERP).
#
# Un catálogo CLASIFICA un mensaje; no responde ni contiene datos de S10. Qué se dice lo decide el código con las
# plantillas de metrin/plantillas/respuestas.yml y los datos de kb/ (procedimientos, conceptos, fragmentos).
#
# Todo lo que hay aquí es SINTÉTICO: frases escritas a mano imitando cómo escribe un usuario de obra u oficina
# (correctas, coloquiales, con faltas y abreviaturas). No hay mensajes reales de usuarios. El conjunto de PRUEBA vive en
# intenciones_prueba.yml y NUNCA entra al entrenamiento; el ruido (clase «ninguno») vive en ruido.yml.
#
# Validar:  .venv/bin/python3 herramientas/validar_catalogos_metrin.py
# Medir:    .venv/bin/python3 herramientas/evaluar_clasificador_metrin.py   (informe en kb/catalogos/EVALUACION.md)
#
# ── Cambios respecto a la taxonomía de ESPECIFICACION_IA_METRIN.md §2 (21 intenciones) ─────────────────────────────
# La especificación mezcla dos ejes en una sola etiqueta: el ACTO (cómo hacer, qué es, error, reporte…) y el TEMA
# (presupuestos, metrados, planillas, contabilidad, compras, costos, configuración). «¿Cómo registro un presupuesto?»
# sería a la vez consulta_presupuestos_s10 y soporte_como_hacer; un clasificador de una sola etiqueta no puede acertar
# lo que la propia etiqueta no decide. Para un asistente instruccional lo que decide la ruta es el ACTO; el tema es una
# ENTIDAD (`modulo`, ver `entidades` abajo, detectada por alias). Por eso:
#   * 4 consulta_presupuestos_s10, 5 consulta_metrados, 6 consulta_planillas, 7 consulta_contabilidad, 8 consulta_compras,
#     9 consulta_costos y 10 consulta_configuracion_s10  →  entidad `modulo` + el acto que corresponda; la pregunta de
#     información general sobre un módulo («¿S10 permite…?», «¿cómo funciona…?») es `consulta_funcionalidad` (nueva).
#   * 14 soporte_como_hacer se conserva y pasa a ser la intención central: pide un PROCEDIMIENTO paso a paso.
#   * 15 cotizacion_servicio se funde en 16 consulta_comercial (misma ruta: comercial/humano).
#   * 20 fuera_de_dominio NO se entrena como intención: es la clase «ninguno», entrenada con ruido.yml.
#   * 13 soporte_error absorbe además «no me aparece ese botón / me salió otra ventana» durante un procedimiento guiado;
#     con un paso pendiente, el código lo trata como error de ese paso (plantilla ERROR_FRECUENTE / VERIFICACION).
#   * Nuevas: consulta_concepto («¿qué es X?»), consulta_funcionalidad, avance_paso («listo, ¿qué sigue?») y
#     pedir_aclaracion («no entendí el paso 3»). Las dos últimas son el bucle instruccional: sin ellas, «listo» o
#     «no entendí» se iban a social o a la búsqueda documental.
#   * 19 solicitud_aprendizaje conserva el sentido de §7 (el usuario le pide a Metrín que aprenda/registre algo). «Quiero
#     aprender a usar almacenes» NO es eso: es soporte_como_hacer (una ruta de procedimientos).
# Alineación con la capa de reglas de docs/ORQUESTACION_METRIN.md («tipo de consulta técnica»): ver `tipo_consulta`.
#
# Campos por intención:
#   descripcion     qué cubre y qué NO (frontera con las vecinas)
#   especificacion  número en §2 de la especificación (o «nueva»)
#   ruta            rag | procedimiento | concepto | conversacion | humano
#   accion          lo que hace el orquestador
#   tipo_consulta   equivalente en la capa de reglas actual (procedimiento, concepto, comparacion, problema,
#                   seguimiento, aclaracion, informacion_directa) o null si es conversación/derivación
#   plantillas      plantillas de metrin/plantillas/respuestas.yml que puede usar (el validador comprueba que existan)
#   ejemplos        ≥ minimo_ejemplos, sin duplicados (ni salvo acentos/signos) dentro ni entre intenciones

catalogo: intenciones_metrin
version: 1
sintetico: true
generado: 2026-10-06
minimo_ejemplos: 25
umbral_referencia: 0.40       # el de metrin/internal/clasificar (UmbralDefecto); el calibrado está en EVALUACION.md

# Abstención: si el mejor puntaje queda bajo el umbral (o el margen con la segunda es mínimo), Metrín NO adivina:
# usa ACLARAR_TAREA. Si gana «ninguno» (ruido.yml), usa FUERA_DE_DOMINIO.
abstencion:
  plantilla: ACLARAR_TAREA
  clase_ninguno: {fuente: ruido.yml, plantilla: FUERA_DE_DOMINIO, especificacion: 20}

# Entidad módulo: absorbe las intenciones temáticas de la especificación. Se detecta por alias (léxico), no por
# embeddings. Los nombres de módulo son los de los manuales oficiales (kb/fragmentos.jsonl, campo «manual»).
entidades:
  modulo:
    presupuestos:
      absorbe: [consulta_presupuestos_s10, consulta_metrados]
      alias: [presupuesto, presupuestos, partida, partidas, apu, acu, "analisis de precios", "precio unitario",
              metrado, metrados, subpresupuesto, "formula polinomica", monomio, "indice unificado", "gastos generales",
              insumo, insumos, "presupuesto meta", "presupuesto venta"]
    gerencia_de_proyectos:
      absorbe: [consulta_costos, consulta_metrados]
      alias: ["gerencia de proyectos", valorizacion, valorizaciones, "partida de control", cronograma, avance,
              "control de costos", "costo real", wbs, "parte diario", tareo]
    lean:
      alias: [lean, lookahead, "last planner", restriccion, restricciones]
    compras:
      absorbe: [consulta_compras]
      alias: [compras, logistica, pedido, pedidos, requerimiento, "orden de compra", "orden de servicio", cotizacion,
              "cuadro comparativo", proveedor, proveedores, subcontrato]
    almacenes:
      absorbe: [consulta_compras]
      alias: [almacen, almacenes, kardex, "nota de ingreso", "nota de salida", "guia de remision", stock, transferencia]
    nominas:
      absorbe: [consulta_planillas]
      alias: [nomina, nominas, planilla, planillas, cts, gratificacion, trabajador, trabajadores, "construccion civil",
              "boleta de pago", afp]
    facturacion:
      alias: [facturacion, factura, facturas, boleta, "nota de credito", "nota de debito", "factura electronica", sunat]
    administrativo:
      alias: [administrativo, tesoreria, "caja chica", "rendicion de cuentas", "cuentas por pagar", detraccion,
              detracciones, pago, pagos, anticipo]
    contabilidad:
      absorbe: [consulta_contabilidad]
      alias: [contabilidad, asiento, asientos, "plan de cuentas", "centro de costo", "libro diario", balance,
              "cierre contable", periodo, comprobante]
    sistema:
      absorbe: [consulta_configuracion_s10]
      alias: [instalacion, instalar, "sql server", "base de datos", usuario, usuarios, contrasena, licencia,
              revision, actualizacion, "copia de seguridad", conexion, servidor]
    movil_y_portales:
      alias: ["tareo movil", "calidad movil", aprobaciones, "portal del proveedor", "portal del colaborador",
              celular, app]

