pasos:
  - n: 1
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#1"
    accion: "En el portal, use la opción **Acceso Anónimo**, disponible para usuarios no registrados."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 2
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#2"
    accion: "Seleccione el **Tipo de Documento** de la lista desplegable: Factura, Nota de Crédito, Nota de Débito, Boleta de Venta, Comprobante de Retención o Comprobante de Percepción."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 3
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#3"
    accion: "Ingrese el **Número de Documento**: serie y número del documento (Serie-Numero)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 4
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#4"
    accion: "Ingrese el **Importe Total**: monto total del documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 5
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#5"
    accion: "Ingrese la **Fecha de Emisión de la Factura**: fecha en que se emitió el documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 6
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#6"
    accion: "Ingrese el **RUC Proveedor**: RUC de la empresa que emitió el documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
    pagina: null
  - n: 7
    id: "facturacion-electronica.consultar-comprobante-con-acceso-anonimo#7"
    accion: "Haga clic en el botón **Buscar**."
    resultado: "De encontrarse algún documento con los datos ingresados, se mostrará la ventana del detalle del documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s026]
