verificacion:
  - texto: "El techo toma como tope la cantidad del recurso genérico presupuestado y la va descontando a medida que van ingresando los recursos específicos o del catálogo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s122]
errores_frecuentes:
  - sintoma: "El factor del recurso equivalente no aparece por defecto."
    solucion: "El factor se toma por defecto solo si en el catálogo de recursos se registró la equivalencia para el recurso equivalente o específico; en el caso de no tenerla, es necesario registrarlo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s124]
