  - "pago electronio me observa socios de negocio"
  - "se puede pagar electronicamente a un proveedor que no tiene cuenta registrada"
aliases:
  - "pago electrónico sin cuenta destino"
  - "cuenta bancaria destino"
  - "socios de negocio observados"
  - "crear cuenta bancaria desde el pago"
