  - "cuanto material se ha egresado a cada partida de control"
  - "como veo las guias de egreso de un recurso en resultados por destino"
  - "el informe de resultados por destino no filtra por fechas"
  - "como consulto los egresos de todos los periodos desde el inicio"
  - "reporte de resultados x destino en gerencia de proyectos"
