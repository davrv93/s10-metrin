id: facturacion.boletear-abonos-sperant
version: 1
modulo: facturacion
titulo: "Registrar abonos en Sperant y boletearlos en S10"
objetivo: "Registrar y sincronizar con S10 los abonos de una orden de venta en Sperant, aprobar los flujos de Separación, Aprobación y Venta, enviar la minuta al S10 y generar en el escenario Boletaje las facturas o boletas de esos abonos."
nivel: avanzado
preguntas:
  - "como boleteo los abonos que vienen de sperant"
  - "como sincronizo un abono de sperant con s10"
  - "como envio la minuta al s10"
  - "no me sale la opcion enviar minuta en sperant"
  - "donde veo en s10 los abonos que mandaron desde sperant"
  - "como genero las boletas de los abonos posteriores"
  - "boletaje sperant s10 paso a paso"
  - "el abono me salio con check rojo al sincronizar"
  - "quiero hacer cambio de titular y no me deja"
aliases:
  - "boletaje"
  - "boletear abonos"
  - "enviar minuta"
  - "sincronizar abono"
  - "boletaje sperant"
entidades:
  modulo: "Facturación"
  pantallas: ["Boletaje", "Orden de Venta", "Cronograma de Facturación", "Flujo del Proceso"]
  objetos: ["orden de venta", "abono", "cronograma", "minuta", "boleta", "factura"]
