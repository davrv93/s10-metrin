modulo: gerencia-proyectos
titulo: "Consultar los resultados por destino de los egresos a partidas de control"
objetivo: "Obtener en el escenario Resultados por Destino un informe, en un rango de fechas o periodo, de los egresos de recursos del almacén hacia las partidas de control del proyecto, cuyo monto se visualiza en los resultados operativos."
