  # ── Conocimiento ──────────────────────────────────────────────────────────────────────────────────────────────
  consulta_concepto:
    descripcion: >-
      Pregunta QUÉ ES / QUÉ SIGNIFICA / PARA QUÉ SIRVE un término de S10 o de obra (metrado, APU, kardex, tareo…).
      Se responde con el glosario kb/conceptos/ y se ofrece el procedimiento relacionado. No es «cómo se hace» ni
      «diferencia entre A y B».
    especificacion: nueva
    ruta: concepto
    accion: explicar_concepto
    tipo_consulta: concepto
    plantillas: [CONCEPTO, SIN_EVIDENCIA]
