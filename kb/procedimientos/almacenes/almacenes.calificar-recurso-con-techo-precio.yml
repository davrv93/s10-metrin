id: almacenes.calificar-recurso-con-techo-precio
version: 1
modulo: almacenes
titulo: "Calificar un recurso con techo precio y registrar los recursos del catálogo"
objetivo: "Calificar en el escenario de Techo de Materiales un recurso genérico presupuestado con el tipo de Techo Precio, para que el precio de los recursos del catálogo que se compran (por ejemplo, cuadernos y lapiceros para UTILES DE OFICINA) se descuente del recurso presupuestado, y dejar como pedibles solo los recursos específicos."
nivel: avanzado
