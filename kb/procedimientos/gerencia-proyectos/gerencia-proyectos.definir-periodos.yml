id: gerencia-proyectos.definir-periodos
version: 1
modulo: gerencia-proyectos
titulo: "Definir la escala y los periodos visibles del proyecto"
objetivo: "Elegir la escala de periodos de cada rama y hacer visibles los periodos mensuales y semanales que se usarán en el Cronograma por Periodos y en los Resultados Operativos; el sistema genera los periodos según la fecha de inicio y el plazo del proyecto."
nivel: basico
