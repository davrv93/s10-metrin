# Catálogo TIPO DE RESPUESTA de Metrín (asistente instruccional de S10 ERP) — V2.
#
# Decide el MODO de respuesta de la V2 de Metrín: no qué intención social tiene el mensaje (eso es intenciones.yml),
# sino QUÉ FORMA debe tener la respuesta: explicar un concepto, guiar un procedimiento, dar una ruta de menú,
# diagnosticar un fallo, guiar una configuración, comparar dos cosas o pedir aclaración. El tema (módulo, documento)
# es una entidad aparte; aquí manda el acto.
#
# Todo lo que hay aquí es SINTÉTICO: frases escritas a mano imitando cómo escribe un usuario de obra u oficina
# (asistente de presupuestos, almacenero, residente, contador, asistente de RR. HH.): correctas, coloquiales, con
# faltas y abreviaturas («q», «x», «porfa», «xq», «dnd»), cortas y largas. No hay mensajes reales de usuarios.
# El conjunto de PRUEBA vive en tipo_respuesta_prueba.yml, está redactado con otras palabras y NUNCA entra al
# entrenamiento. Saludos, agradecimientos y temas ajenos a S10 NO están aquí: los maneja intenciones.yml / ruido.yml.
#
# Fronteras entre clases:
#   CONCEPT          qué es / qué significa / para qué sirve un término. No «cómo se hace» ni «diferencia entre A y B».
#   PROCEDURE        cómo HACER una operación del día a día en varios pasos (registrar, emitir, generar, calcular,
#                    aprobar, anular, copiar, importar…). Incluye «¿y luego?», «¿qué sigue?» dentro de un procedimiento.
#   NAVIGATION       DÓNDE está algo en la interfaz (menú, módulo, pestaña, botón, pantalla). La respuesta es una ruta
#                    de menú, no un procedimiento. «¿En qué menú están los parámetros?» es NAVIGATION aunque el objeto
#                    sea de configuración: se etiqueta por la forma de la respuesta que se pide.
#   TROUBLESHOOTING  algo falla o no sale como debería (error, no guarda, no aparece, no cuadra, se cuelga, rechazado,
#                    lento, bloqueado).
#   CONFIGURATION    preparar o parametrizar el sistema antes de operar (unidades, monedas, tipo de cambio, series,
#                    parámetros, valores por defecto, tablas maestras, usuarios y permisos, conexión, instalación,
#                    actualización, plantillas de impresión, opciones del escenario). Frontera con PROCEDURE:
#                    CONFIGURATION cambia CÓMO se comporta el sistema; PROCEDURE registra una operación del día a día.
#   COMPARISON       diferencia, cuál conviene o si son lo mismo entre dos (o más) conceptos, documentos u opciones.
#   UNKNOWN          sin tarea identificable: tema o palabra suelta, «tengo una duda», «lo del otro día», o mensajes
#                    que podrían ser de varias clases por igual. Metrín no adivina: pregunta qué quiere hacer.
#
# Referencias conversacionales («¿y luego?», «eso no me sale», «¿y eso qué es?», «¿y dónde lo veo?», «¿y cómo lo
# dejo configurado?», «¿y cuál es la diferencia con el otro?») se etiquetan por el TIPO DE RESPUESTA QUE PIDEN, no por
# el tema del turno anterior; el tema lo resuelve el código con el contexto de la conversación.
#
# Ejemplos: ≥ minimo_ejemplos por clase, sin duplicados (ni salvo acentos/signos/mayúsculas) dentro ni entre clases.

catalogo: tipo_respuesta
version: 1
sintetico: true
generado: 2026-10-06
minimo_ejemplos: 40
clase_abstencion: UNKNOWN

