errores_frecuentes:
  - sintoma: "Generó el documento de pago desde el fondo y aún no puede registrar gastos."
    solucion: "Con Generar Documento de Pago el sistema crea recién el documento y queda a la espera de su pago para el inicio de las operaciones de la caja; con Agregar Documento de Pago (un documento ya PAGADO) puede crear los reembolsos de inmediato."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s055]
