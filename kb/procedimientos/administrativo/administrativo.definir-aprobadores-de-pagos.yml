id: administrativo.definir-aprobadores-de-pagos
version: 1
modulo: administrativo
titulo: "Definir aprobadores, moneda y monto para la aprobación de pagos"
objetivo: "Definir a un usuario como aprobador de pagos, con la moneda en la que tiene autorizado el pago y su monto máximo de autorización, y darle permisos en los escenarios del módulo."
nivel: intermedio
