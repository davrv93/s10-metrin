errores_frecuentes:
  - sintoma: "Al hacer un pedido se muestra todo el catálogo de recursos."
    solucion: "Sin selección en la opción del tipo de techo, al pedir se muestra el catálogo de recursos: selecciónela y elija el tipo de techo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s023]
  - sintoma: "Al efectuar un pedido no se muestran los recursos que necesito."
    solucion: "Con el techo de presupuestos solo se muestran los recursos de los presupuestos asignados al proyecto; con Techo Libre, los recursos registrados previamente en el escenario Techo Libre."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s023]
