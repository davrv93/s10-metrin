  - "cómo hago visibles los periodos del proyecto"
  - "no me aparecen las semanas en el cronograma por periodos"
  - "como elijo periodos semanales o mensuales en gerencia de proyectos"
  - "dónde se configura la escala de periodos del proyecto"
  - "como agrego mas periodos si el proyecto se amplia"
  - "como muestro los periodos en resultados operativos"
  - "como configuro los periodos del proyeto en s10"
  - "periodos semanales para la rama meta y mensuales para la venta"
aliases:
  - "definir periodos"
  - "hacer visibles los periodos"
  - "escala de periodos"
  - "periodos del proyecto"
  - "incrementar periodos"
