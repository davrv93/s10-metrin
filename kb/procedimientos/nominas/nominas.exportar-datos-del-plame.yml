        ruta_o_url: "imagenes/manual-de-nominas/1af216c05f52.png"
        pagina: null
        ocr: "[Elia } formes | ERRreSeS\n} 2 Escritorio\nplana Eectréica {My SISTEMA 10 S.A.C.\nLuego,"
  - n: 2
    id: "nominas.exportar-datos-del-plame#2"
    accion: "En **Estructura**, elija **Planilla Mensual - PLAME**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082, img-de227748bcb6-0000]
    pagina: null
    fotos:
      - id: "10a3642ee847"
        ruta_o_url: "imagenes/manual-de-nominas/de227748bcb6.png"
        pagina: null
        ocr: "Datos para la cabecera\nestructura Tipo Perini Moto |\nPlanilla Mensual - PLAME |18.- Trabaicor: Detalle de los ingresos, tributos y desuentos"
  - n: 3
    id: "nominas.exportar-datos-del-plame#3"
    accion: "Elija el formato; por ejemplo, el 18: trabajador, detalle de los ingresos, tributos y descuentos. Las estructuras más utilizadas son 7, 14, 15, 18, 20, 21 y 26."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082, img-3d4b878b09fa-0000]
    pagina: null
    fotos:
      - id: "e9d144494bfc"
        ruta_o_url: "imagenes/manual-de-nominas/3d4b878b09fa.png"
        pagina: null
        ocr: "7.- Prestador de Servicios con Rentas de Cuarta categoria\n\n12,- Trabajador: Otras Rentas de Quinta categoria\n\n14,- Trabajador: Datos de la jornada laboral\n\n15,- Trabajador: Dias subsidiados y otros no laborados\n\n18.- Trabaiador: Detalle de los inaresos, tributos y descuentos\n\n19,- Pensionista: Detalle de los ingresos, tributos y descuentos\n\n20,- Datos del detalle de comprobantes de prestadores de …"
  - n: 4
    id: "nominas.exportar-datos-del-plame#4"
    accion: "Si necesita un rango de fechas, deje seleccionada la opción de rango; si no está seleccionada, solo podrá elegir un periodo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
  - n: 5
    id: "nominas.exportar-datos-del-plame#5"
    accion: "Elija el periodo mensual."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
  - n: 6
    id: "nominas.exportar-datos-del-plame#6"
    accion: "Elija el modo: **Resumido** o **Detallado**."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
  - n: 7
    id: "nominas.exportar-datos-del-plame#7"
    accion: "Use el botón que carga los datos en el escenario."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
  - n: 8
    id: "nominas.exportar-datos-del-plame#8"
    accion: "Use el botón que ejecuta el proceso de exportación del contenido del escenario a Excel; el archivo se guarda en una carpeta."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
  - n: 9
    id: "nominas.exportar-datos-del-plame#9"
    accion: "Elabore la declaración jurada en el programa PLAME, que se descarga desde www.sunat.gob.pe, y envíela mediante SUNAT Operaciones en Línea (SOL)."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s082]
    pagina: null
    fotos:
      - id: "88fa92c684c3"
        ruta_o_url: "imagenes/manual-de-nominas/910de6f043dc.png"
        pagina: null
        caption: "El programa se descarga desde www.sunat.gob.pe, en el cual se elabora la declaración jurada y se envía mediante SUNAT Operaciones en Línea (SOL)."
        ocr: "eS Es preciso sefialar que la versidn vigente es la 3.5, aprobada mediante Resolucién de Superintendencia\nN° 112-2018/SUNAT la cual es de uso obligatorio a partir del 01 de mayo de 2018 y debe utilizarse a\npartir del periodo abril de 2019 en adelante."
