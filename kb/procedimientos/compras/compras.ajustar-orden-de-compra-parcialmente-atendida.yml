titulo: "Ajustar una orden de compra que el proveedor atendió solo en parte"
objetivo: "Cuando una Orden de Compra aprobada tiene ingresos parciales al almacén y el proveedor no completará las cantidades y quiere dar por finalizadas las entregas, modificarla automáticamente para que coincida con la factura que emita el proveedor."
