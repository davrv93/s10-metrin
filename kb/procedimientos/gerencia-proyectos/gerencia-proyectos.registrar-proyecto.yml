modulo: gerencia-proyectos
titulo: "Registrar un proyecto nuevo"
objetivo: "Registrar el proyecto y sus datos complementarios (nombre, propietario, lugar, fecha de inicio, plazo, moneda y empresa) en el escenario de Datos Generales, para luego registrar sus partidas de control e iniciar el uso de pedidos y compras."
