errores_frecuentes:
  - sintoma: "Al ejecutar el instalador aparece un mensaje sobre el componente DirectPlay."
    solucion: "Siga las indicaciones para instalar el componente DirectPlay, necesario para el instalador S10; luego podrá ejecutar el instalador sin problemas."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s007]
  - sintoma: "No se puede activar el componente .NET Framework."
    solucion: "Debe activarse con un usuario con permisos de administrador y descargarse con Windows Update; reinicie si el equipo lo pide. De no poder activarlo, consulte con un técnico."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s003]
