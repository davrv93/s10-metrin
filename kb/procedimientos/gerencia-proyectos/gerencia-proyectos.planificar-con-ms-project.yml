prerrequisitos:
  - texto: "Las fases o WBS deben tener asignadas sus actividades en el escenario de Actividades: son las que se usan en el Cronograma por Periodos para la programación gráfica."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s085]
  - texto: "Si trabaja en LAN, el cliente y el servidor deben tener la misma versión del MS Project; si se conecta por escritorio remoto, solo usa los recursos del servidor."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s085]
