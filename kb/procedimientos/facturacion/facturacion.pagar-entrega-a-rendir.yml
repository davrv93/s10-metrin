id: facturacion.pagar-entrega-a-rendir
version: 1
modulo: facturacion
titulo: "Pagar el comprobante de entrega a rendir"
objetivo: "Pagar desde el módulo Administrativo el documento ENTREGAS A RENDIR creado en Facturación: registrar la orden de pago con ese documento, enviarla a aprobación, aprobarla y pagarla desde Pendientes de Pago, para luego iniciar la liquidación."
nivel: intermedio
preguntas:
  - "pago de entregas a rendir paso a paso"
  - "ya registre la entrega a rendir en facturacion, ahora como le hago el pago al trabajador"
  - "que orden de pago uso para pagarle la entrega a rendir al personal"
  - "no me aparece la entrega a rendir en el cronograma de pagos de la orden de pago"
  - "donde se paga el documento entregas a rendir, en administrativo?"
  - "como desembolso el dinero de la entrega a rrendir con cheque"
  - "quien aprueba la OP de la entrega a rendir"
  - "pague la entrega a rendir y no se donde ver el pago"
aliases:
  - "pagar entrega a rendir"
  - "pago de entrega a rendir"
  - "orden de pago de entrega a rendir"
  - "desembolso de entrega a rendir"
entidades:
  modulo: "Facturación"
  pantallas: ["Orden de Pago", "Cronograma de Pagos", "Pendientes de Pago", "Pagos"]
  objetos: ["entrega a rendir", "orden de pago", "cuenta bancaria", "cheque", "aprobador"]
prerrequisitos:
  - texto: "El documento ENTREGAS A RENDIR debe estar creado desde el módulo de Facturación: se paga después de tener el documento."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
  - texto: "El usuario que aprueba la orden de pago debe ser aprobador, con sus permisos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
