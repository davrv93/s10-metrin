errores_frecuentes:
  - sintoma: "**Adicionar desde Guías de Egresos** no se activa en el ingreso."
    solucion: "Se activa solo cuando existen guías pendientes de ingreso al almacén: en el almacén del proyecto origen se debe generar antes el Egreso por Transferencia Externa."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s054, web-https-documentacion-s10peru-com-manual-d-s066]
  - sintoma: "Espera que el otro proyecto le devuelva los recursos transferidos."
    solucion: "Los recursos que se transfieren tienen el carácter de definitivo y no se espera devolución."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s066]
