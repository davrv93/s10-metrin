id: compras.registrar-centro-de-compra
version: 1
modulo: compras
titulo: "Registrar un centro de compra"
objetivo: "Registrar el centro de compra, la persona o el lugar (por ejemplo, la oficina de logística) encargado de administrar el proceso de compra, con sus usuarios y los proyectos que manejará."
nivel: intermedio
preguntas:
  - "cómo creo un centro de compra en s10"
  - "cómo registro el centro de compras"
  - "dónde se crea el centro de compra en el módulo de compras"
  - "cómo asigno usuarios al centro de compras"
  - "cómo le asigno proyectos a un centro de compra"
  - "como registro un centro de conpras nuevo"
  - "quién es el responsable del centro de compras y dónde lo pongo"
