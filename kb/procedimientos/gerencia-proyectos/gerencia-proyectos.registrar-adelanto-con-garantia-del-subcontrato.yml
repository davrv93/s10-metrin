verificacion:
  - texto: "Una vez registrado el porcentaje de adelanto y la garantía, la amortización del adelanto en cada valorización es automática."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s156]
errores_frecuentes:
  - sintoma: "No puede otorgar un adelanto en efectivo mayor que la garantía registrada."
    solucion: "El monto de la garantía es un tope para el otorgamiento del adelanto en efectivo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s156]
  - sintoma: "La carta de fianza por fiel cumplimiento no aumenta el tope del adelanto."
    solucion: "Es lo esperado: la carta de fianza por fiel cumplimiento no es tomada en cuenta para efectos del tope del adelanto."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s157]
  - sintoma: "El adelanto no se amortiza en las valorizaciones del subcontratista."
    solucion: "Registre el pago del adelanto antes de efectuar la primera valorización del subcontratista para que el sistema efectúe automáticamente las amortizaciones: no existe la opción para amortizar manualmente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s161]
