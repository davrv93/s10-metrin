  - "cómo doy de baja una factura electrónica"
  - "como anulo una boleta electronica ante sunat"
  - "qué es la comunicación de baja y cómo se hace"
  - "cuál es el plazo para dar de baja una factura electrónica"
  - "como envio la comunicacion de baja a sunat desde s10"
  - "me equivoque en una factura electronica que ya mande, como la anulo"
  - "comunicasion de baja s10 pasos"
  - "puedo dar de baja una boleta que no fue informada en el resumen diario"
aliases:
