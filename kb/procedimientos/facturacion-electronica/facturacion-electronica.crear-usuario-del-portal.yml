pasos:
  - n: 1
    id: "facturacion-electronica.crear-usuario-del-portal#1"
    accion: "En el portal, ingrese a **Gestión de Usuarios**, que permite administrar a los usuarios de la empresa que emite los documentos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s019]
    pagina: null
    fotos:
      - id: "3437be3435db"
