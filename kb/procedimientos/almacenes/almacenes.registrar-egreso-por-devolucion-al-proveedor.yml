    accion: "Elija el tipo de egreso: **Egreso por Devolución al Proveedor** si el recurso ingresó con un ingreso por compra, o **Egreso por Devolución por orden de Compra** si ingresó con un Ingreso por orden de Compra."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s073, web-https-documentacion-s10peru-com-manual-d-s075, web-https-documentacion-s10peru-com-manual-d-s063]
