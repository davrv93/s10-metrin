id: almacenes.registrar-egreso-a-partida-de-control
version: 1
modulo: almacenes
titulo: "Registrar un egreso a partida de control"
objetivo: "Registrar la salida de recursos del stock del almacén hacia las partidas de control del proyecto (o de un subcontrato) con un Egreso a Partida de Control [EPC], el egreso más usado durante la ejecución."
