id: almacenes.registrar-tipo-de-documento
version: 1
modulo: almacenes
titulo: "Registrar un tipo de documento y su impuesto"
objetivo: "Registrar en el catálogo de Tipo de Documento los documentos que acostumbra usar la empresa, compatibilizados con los documentos normados por SUNAT, con su moneda y el impuesto que se le aplica."
nivel: basico
