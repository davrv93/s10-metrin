id: partida_de_control
termino: "Partida de control"
sinonimos: ["partidas de control", "PC"]
definicion: "Es lo que usa el sistema para el control económico del proyecto. Cada proyecto registra sus propias partidas de control y a ellas se asignan las actividades de las fases del WBS, con lo que adquieren valor y recursos; por ejemplo, todas las partidas de encofrado se agrupan en una sola partida de control llamada Encofrado."
en_s10: "A cada partida de control del proyecto se le asigna una partida de control general de la empresa, que es la relación de ítems en los que la empresa suele gastar al ejecutar sus proyectos. Se usan en los egresos de almacén, en los tareos y en los partes de equipo, y el escenario Resultados en línea muestra la marcha del proyecto a nivel de partidas de control. Si el proyecto no tiene presupuesto, se registran en el grupo Configuración, escenario Partidas de Control."
ejemplo: "En un proyecto de edificaciones se recomienda registrar solo la partida de control ENCOFRADO (no encofrado metálico y encofrado de madera) y solo CONCRETO (no concreto 100, concreto 175, concreto 210)."
procedimientos_relacionados: [gerencia-proyectos.asignar-presupuestos-al-proyecto, almacenes.registrar-egreso-a-partida-de-control]
