prerrequisitos:
  - texto: "Todos los trabajadores deben estar registrados previamente en el Catálogo de Socio de negocio."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046]
  - texto: "El personal que trabaja en los proyectos de construcción se registra primero dentro del MULTIPROYECTO y luego se replica o copia a los proyectos de ejecución donde participa."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s046]
