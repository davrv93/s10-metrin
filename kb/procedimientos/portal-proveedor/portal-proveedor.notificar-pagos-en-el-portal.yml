verificacion:
  - texto: "La primera vez, el contacto recibe un correo electrónico de bienvenida con los datos de acceso al portal, enviado por una cuenta denominada S10 Alerta."
    fuente: [web-https-documentacion-s10peru-com-manual-p-s024]
errores_frecuentes:
  - sintoma: "No se envían las notificaciones al proveedor."
    solucion: "Al enviar los documentos por pagar al Portal de Proveedores se valida que estén registrados la dirección electrónica (e-mail) del contacto para el portal y la dirección del proveedor, si figura como Domiciliado. De no tener alguno de estos datos no será posible enviar las notificaciones."
    fuente: [web-https-documentacion-s10peru-com-manual-p-s022]
  - sintoma: "No desea enviar notificaciones a ningún proveedor."
    solucion: "Registre el monto mínimo de los pagos con valor cero en la ficha de datos de la empresa."
    fuente: [web-https-documentacion-s10peru-com-manual-p-s021]
  - sintoma: "El proveedor no puede generar la factura desde el portal a partir de una orden de compra."
    solucion: "La opción Permitir registro de facturas por pagar desde el Portal de Proveedores actualmente no está implementada."
    fuente: [web-https-documentacion-s10peru-com-manual-p-s023]
  - sintoma: "Un pago ya no aparece en el portal del proveedor."
    solucion: "Si el pago es anulado o eliminado, también es quitado del portal."
    fuente: [web-https-documentacion-s10peru-com-manual-p-s026]
