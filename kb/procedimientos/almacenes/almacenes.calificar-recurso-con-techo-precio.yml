  - "como uso el precio como techo para un recurso generico"
  - "en el presupuesto solo puse utiles de oficina, como pido cuadernos y lapiceros"
  - "como hago que el precio de lo que compro se descuente del presupuestado"
  - "techo precio como se configura en almacenes"
  - "como marco un recurso como no pedible"
  - "como edito la cantidad y el precio del recurso equivalente en el techo"
  - "quiero que solo se puedan pedir los recursos especificos y no el generico"
  - "techo de materiales precio s10 paso a paso"
aliases:
  - "techo precio"
  - "techo por precio"
  - "no pedible"
  - "es pedible"
  - "recursos del catálogo en el techo"
