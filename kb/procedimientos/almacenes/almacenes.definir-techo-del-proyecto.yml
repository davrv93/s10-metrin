id: almacenes.definir-techo-del-proyecto
version: 1
modulo: almacenes
titulo: "Definir el techo del proyecto y los responsables del almacén"
objetivo: "Configurar en los datos generales del proyecto el tipo de techo que usará en los pedidos (los presupuestos asignados o el Techo Libre), la serie de la Guía de Remisión, los decimales de las guías de ingreso y egreso y los usuarios responsables del almacén."
nivel: intermedio
preguntas:
  - "cómo defino el techo del proyecto en almacenes"
  - "como hago para que al pedir solo salgan los recursos del presupuesto"
  - "qué es el techo libre y cómo lo activo"
  - "dónde pongo la serie de la guía de remisión del proyecto"
  - "como cambio los decimales de las guias de ingreso y egreso"
  - "como marco al responsable del almacen en el proyecto"
  - "al hacer un pedido me sale todo el catalogo de recursos, por que"
  - "la obra todavia no tiene presupuesto, como pido materiales igual"
aliases:
  - "techo del proyecto"
  - "definir techo"
  - "techo libre"
  - "responsable del almacén"
  - "decimales de las guías"
