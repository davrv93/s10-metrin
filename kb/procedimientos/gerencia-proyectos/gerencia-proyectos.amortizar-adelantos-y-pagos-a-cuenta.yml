titulo: "Amortizar los adelantos y los pagos a cuenta en la valorización del subcontrato"
objetivo: "Ver en la valorización del subcontrato el monto amortizado del adelanto, que el sistema calcula de forma automática, y amortizar los pagos a cuenta otorgados al subcontratista."
