errores_frecuentes:
  - sintoma: "No puede asignar derecho habiente al trabajador."
    solucion: "En el caso de elegir Soltero en el estado civil, no podrá asignar derecho habiente al trabajador."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s048]
  - sintoma: "En los catálogos del T-REGISTRO falta un código que agregó la SUNAT."
    solucion: "Toda la información de esos catálogos es proporcionada por la SUNAT; en el caso de adiciones que realice la SUNAT, el usuario debe solicitar al S10 que la incluya en la lista."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s047]
  - sintoma: "La nómina usa una sola moneda para todos."
    solucion: "La nómina sólo usa un tipo de moneda para todos los trabajadores: elija el mismo en la pestaña Costos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s049]
