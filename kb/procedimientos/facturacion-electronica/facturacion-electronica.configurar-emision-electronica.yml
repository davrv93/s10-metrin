  - "dónde pongo el número de resolución de sunat como emisor electrónico"
  - "cuantos digitos debe tener el numero del talonario electronico"
  - "no me deja grabar el documento por cobrar electronico"
  - "como pongo el correo del cliente para que le llegue la factura electronica"
