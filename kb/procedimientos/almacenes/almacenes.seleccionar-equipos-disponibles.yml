id: almacenes.seleccionar-equipos-disponibles
version: 1
modulo: almacenes
titulo: "Seleccionar los equipos disponibles del proyecto y registrar su ficha"
objetivo: "Elegir del catálogo de recursos el equipo propio y de terceros que se utilizará en el proyecto, para asignarlo como destino en los egresos y registrar sus partes de equipo, y completar su ficha relacionándolo con el equipo presupuestado."
nivel: intermedio
preguntas:
  - "como agrego los equipos que van a trabajar en la obra en almacenes"
  - "dónde selecciono los equipos disponibles del proyecto"
  - "como lleno la ficha del equipo con el precio del alquiler"
  - "como relaciono el cargador frontal con el equipo presupuestado"
  - "como asigno las horas maquina de un equipo alquilado al proyecto"
  - "quiero que me pida el horometro cuando egreso petroleo para un equipo"
  - "un equipo ya no trabaja en la obra como lo saco de los partes"
  - "donde pongo marca modelo y serie del volquete"
  - "equipos disponivles s10 como se registran"
aliases:
  - "equipos disponibles"
  - "ficha del equipo"
  - "activos disponibles"
  - "registrar equipos del proyecto"
  - "especificaciones del equipo"
