id: presupuestos.registrar-indices-unificados
version: 1
modulo: presupuestos
titulo: "Registrar los índices unificados"
objetivo: "Registrar por área geográfica los índices unificados que se publican mensualmente, con los datos de su resolución, para actualizar los precios de los recursos que participan en los presupuestos."
nivel: avanzado
preguntas:
  - "como registro los indices unificados del inei en s10"
  - "donde ingreso los indices unificados del mes"
  - "como cargo los indices unificados desde excel"
  - "como hago para que el indice se replique en todas las areas geograficas"
  - "como registro la resolucion de los indices unificados"
  - "no se me graban los datos de los indices unificados"
  - "como lleno los indices unificados por area geografica"
  - "donde actualizo los IU del presupuesto"
aliases:
