verificacion:
  - texto: "La guía aparece en la lista de ingresos efectuada al almacén, con su número de guía correlativo."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s035, web-https-documentacion-s10peru-com-manual-d-s041]
errores_frecuentes:
  - sintoma: "Los montos calculados del documento no coinciden con el documento que registra."
    solucion: "Devuelva el documento al proveedor para que lo emita con cálculos correctos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s042]
  - sintoma: "No puede eliminar la guía de ingreso."
    solucion: "Solo se elimina si el usuario tiene atributos para hacerlo y la guía no tiene regularización; el atributo se asigna en el escenario de datos Generales. Si tiene regularización, elimínela previamente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s036]
  - sintoma: "La guía de ingreso ya no se puede modificar."
    solucion: "La guía cambia a estado protegido cuando cierra el mes, y el estado protegido evita que la guía sea modificada o eliminada."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s036, web-https-documentacion-s10peru-com-manual-d-s037]
