titulo: "Registrar una clasificación de papeletas"
objetivo: "Registrar en el Catálogo de Clasificación de Papeletas los tipos de papeleta (subsidios, licencias, vacaciones, regularización de días) que se usan para hacer cambios en un tareo previamente registrado."
