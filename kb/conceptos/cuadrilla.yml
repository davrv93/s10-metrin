id: cuadrilla
termino: "Cuadrilla"
sinonimos: ["cuadrillas", "grupo de trabajo"]
definicion: "Grupo de trabajo de personal: en Gerencia de proyectos el personal obrero se organiza en grupos de trabajo o cuadrillas. En presupuestos, el escenario Tiempos para programación da una idea de cuántas cuadrillas usar para ejecutar cada partida y del plazo."
en_s10: "En el análisis de precios unitarios se ingresa la cuadrilla a la mano de obra (si la partida tiene rendimiento) y a los equipos. En el escenario Tiempos para programación se registra la cantidad de cuadrillas a usar y se ve el tiempo unitario de la partida para una cuadrilla. En Gerencia de proyectos, el escenario Grupo de trabajo toma los datos de Personal disponible y se usa al generar órdenes de trabajo en el tareo por actividades."
procedimientos_relacionados: [presupuestos.registrar-partida-en-el-catalogo]
