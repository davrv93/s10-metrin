id: metrado
termino: "Metrado"
sinonimos: ["metrados"]
definicion: "Dato que se ingresa para cada partida en la celda de metrados de la hoja del presupuesto. El módulo de Presupuestos elabora presupuestos de obra a partir de los metrados, y el presupuesto entrega al proyecto las partidas, metrados, recursos, cantidades y precios."
en_s10: "Se registran en la hoja del presupuesto; también pueden pegarse desde Excel con la opción Pegar de otras aplicaciones o vincular la celda de metrado de la partida con una celda de Excel. En el escenario del Cronograma por periodos el ingreso de metrados (avances) es manual y, con los metrados registrados, el sistema calcula la cantidad de recursos de acuerdo con los análisis de precios unitarios."
procedimientos_relacionados: [presupuestos.ingresar-metrados, gerencia-proyectos.planificar-en-cronograma-por-periodos]
