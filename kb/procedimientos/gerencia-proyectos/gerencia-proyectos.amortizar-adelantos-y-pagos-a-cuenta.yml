prerrequisitos:
  - texto: "El porcentaje de adelanto debe registrarse en la cabecera al momento de registrar el subcontrato, antes de efectuar la valorización."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s161]
  - texto: "El pago del adelanto debe registrarse antes de efectuar la primera valorización del subcontratista, para que el sistema efectúe las amortizaciones de forma automática."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s161]
  - texto: "Para amortizar pagos a cuenta, antes deben estar registrados los pagos a cuenta otorgados al subcontratista."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s161, web-https-documentacion-s10peru-com-manual-d-s158]
