id: calidad-movil.activar-la-aplicacion
version: 1
modulo: calidad-movil
titulo: "Instalar y activar la aplicación Calidad Móvil"
objetivo: "Descargar la aplicación Calidad Móvil en el celular o tablet, activarla con el código que llega al correo y sincronizar el proyecto publicado para el usuario."
nivel: basico
preguntas:
  - "cómo instalo calidad móvil en mi celular"
  - "donde descargo la app de calidad movil de s10"
  - "como activo la aplicacion de calidad movil"
  - "no me llega el codigo de activacion de calidad movil"
  - "que datos me pide la app de calidad movil para activarla"
  - "instale calidad movil y no me sale ningun proyecto"
  - "como configuro calidad movil en la tablet"
  - "la app de calidad pide ruc y correo, cual pongo"
aliases:
  - "instalar calidad móvil"
  - "activar calidad móvil"
  - "código de activación"
  - "configurar calidad móvil"
  - "descargar app de calidad"
entidades:
  modulo: "Calidad Móvil"
  pantallas: ["Play Store", "App Store"]
  objetos: ["aplicación", "código de activación", "contraseña", "proyecto", "dispositivo móvil"]
prerrequisitos:
  - texto: "Para poder activar la aplicación es necesario que se haya publicado antes el proyecto para el usuario, desde el módulo S10 Gerencia de Proyectos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s006]
  - texto: "Los datos de los usuarios que accederán a la aplicación móvil (correo electrónico del usuario y RUC de la empresa asociada) deben proporcionarse al área de ventas de S10 al contratar el servicio, junto con el IP público y el nombre de la base de datos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s004]
