id: titulo
termino: "Título"
sinonimos: ["títulos"]
definicion: "Registro de la hoja del presupuesto bajo el cual se ubican las partidas que le corresponden. Los títulos se toman del catálogo de títulos, cuyos registros se usan en la hoja del presupuesto."
en_s10: "En el registro tradicional del presupuesto se registran primero los títulos y luego, para cada título, sus partidas. Se insertan desde el catálogo de títulos (menú Catálogos o clic derecho en la hoja, opción Adicionar Título); los botones de sangría de la hoja permiten armar las jerarquías entre títulos y partidas, y después de reubicarlos hay que generar los ítems."
procedimientos_relacionados: [presupuestos.registrar-titulos-y-partidas]
