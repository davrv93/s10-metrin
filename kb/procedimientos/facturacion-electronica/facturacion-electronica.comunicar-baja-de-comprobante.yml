id: facturacion-electronica.comunicar-baja-de-comprobante
version: 1
modulo: facturacion-electronica
titulo: "Dar de baja un comprobante electrónico con la comunicación de baja"
objetivo: "Dar de baja ante la SUNAT las facturas o boletas de venta electrónicas que no se entregaron al cliente, mediante un documento de Comunicación de Baja."
nivel: intermedio
