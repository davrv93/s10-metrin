id: almacenes.transferir-recursos-entre-almacenes
version: 1
modulo: almacenes
titulo: "Transferir recursos entre almacenes del mismo proyecto"
objetivo: "Trasladar recursos de un almacén a otro del mismo proyecto: se pide con un pedido A Almacén, el almacén origen genera un Egreso por Transferencia Interna y el almacén destino un Ingreso por Transferencia Interna. La transferencia es permanente, no contempla devolución."
