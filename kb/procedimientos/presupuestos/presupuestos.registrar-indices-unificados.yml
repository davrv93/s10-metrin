    id: "presupuestos.registrar-indices-unificados#4"
    accion: "En la ventana de **Tablas**, registre los datos de la resolución que publica los índices unificados: año, mes, fecha de publicación y número de resolución."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s118, "7c40a9548710-0188"]
    pagina: null
  - n: 5
    id: "presupuestos.registrar-indices-unificados#5"
    accion: "Haga clic en la fila inferior para que se graben los datos."
