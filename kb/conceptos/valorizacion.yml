id: valorizacion
termino: "Valorización"
sinonimos: ["valorizaciones", "porcentaje del plan completado"]
definicion: "El porcentaje del plan completado, término de gerencia de proyectos que se refiere al registro del trabajo realizado durante la semana, en S10 se llama valorización. En la ejecución se valorizan las actividades o partidas del presupuesto asignado para cuantificar el avance logrado y cobrar al propietario por los trabajos ejecutados."
en_s10: "Se realiza en el escenario del Cronograma por periodos, donde los avances logrados se ingresan a mano, en metrados; solo se permite una valorización por periodo y el monto de la valorización mensual se toma de ese cronograma. Lo valorizado se compara con lo programado en el escenario Programado – Valorizado. Los subcontratos también se valorizan, con periodo semanal."
