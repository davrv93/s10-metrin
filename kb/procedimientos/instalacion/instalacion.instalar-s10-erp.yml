id: instalacion.instalar-s10-erp
version: 1
modulo: instalacion
titulo: "Instalar el S10 ERP en un equipo"
objetivo: "Instalar el S10 ERP en un equipo (cliente, y si no hay servidor también el motor de base de datos) y aplicar sus revisiones, cumpliendo antes las consideraciones previas."
nivel: intermedio
preguntas:
  - "cómo instalo el s10 erp"
  - "pasos para instalar s10 en mi pc"
  - "que necesito antes de instalar el s10"
  - "instalar s10 cliente o servidor"
  - "me pide directplay al instalar s10"
  - "como instalo las revisiones del s10"
  - "como actualizo el s10 con las revisiones"
  - "no puedo instalar s10, me sale control de cuentas de usuario"
  - "como instalo el s10 en windows 10 net framework"
aliases:
  - "instalar S10"
  - "instalación del S10 ERP"
  - "instalar revisiones"
entidades:
  modulo: "Instalación"
  pantallas: ["Activar y desactivar las características de Windows", "Revisiones"]
  objetos: ["instalador", "DVD de instalación", ".NET Framework 3.5", "antivirus", "motor de base de datos"]
prerrequisitos:
  - texto: "Necesita un usuario con permisos para instalar o desinstalar programas, o un usuario Administrador del equipo (preferible)."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s002]
  - texto: "En Windows 8 o superior debe estar activado el componente **.NET Framework 3.5 (Incluye .NET 2.0 y 3.0)**, en **Activar y desactivar las características de Windows**."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s003]
  - texto: "No debe existir ninguna instalación previa del software; si existe, desinstálela."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s005]
  - texto: "Necesita el DVD de instalación."
    fuente: [web-https-documentacion-s10peru-com-manual-i-s007]
