errores_frecuentes:
  - sintoma: "Los días de descanso prenatal y posnatal no suman días trabajados."
    solucion: "La Ley 30792 establece que los 98 días del descanso prenatal y posnatal serán considerados como días laborados para el cómputo de las utilidades: inclúyalos en los conceptos que suman días trabajados."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s086]
  - sintoma: "La utilidad no se toma para el descuento de la renta de quinta del trabajador."
    solucion: "Primero relacione el concepto genérico y luego genere el resumen de conceptos por período para obtener el dato del depósito por concepto de utilidad."
    fuente: [web-https-documentacion-s10peru-com-configur-s000]
