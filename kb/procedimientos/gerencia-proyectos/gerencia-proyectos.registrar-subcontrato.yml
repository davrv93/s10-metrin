id: gerencia-proyectos.registrar-subcontrato
version: 1
modulo: gerencia-proyectos
titulo: "Registrar un subcontrato"
objetivo: "Registrar los subcontratos que se utilizan en la ejecución del proyecto, con sus datos de cabecera y los recursos con su partida de control, para luego valorizarlos y llevar el control de sus pagos."
nivel: intermedio
preguntas:
  - "cómo registro un subcontrato en gerencia de proyectos"
  - "como creo un subcontrato para la obra"
  - "dónde se registran los subcontratos del proyecto"
  - "como agrego recursos o actividades a un subcontrato"
  - "como asigno partida de control a los recursos del subcontrato"
  - "como pongo el adelanto y la retencion de un subcontratista"
  - "como registro un subcontrao con orden de servicio"
  - "pasos para registrar un subcontratista en s10"
  - "registrar subcontrato de mano de obra en el proyecto"
aliases:
  - "registrar subcontrato"
  - "crear subcontrato"
  - "nuevo subcontrato"
  - "alta de subcontratista"
  - "registro de subcontratos"
entidades:
  modulo: "Gerencia de Proyectos"
  pantallas: ["Subcontratos", "Subcontrato - De Obra", "Partidas de Control"]
  objetos: ["subcontrato", "subcontratista", "partida de control", "adelanto", "recurso"]
prerrequisitos:
  - texto: "El jefe de grupo debe haber asignado permisos a los usuarios que usarán subcontratos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s141]
  - texto: "Si va a asignar destinos específicos o frentes a los recursos, deben estar registrados previamente."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s147, web-https-documentacion-s10peru-com-manual-d-s148]
pasos:
  - n: 1
    id: "gerencia-proyectos.registrar-subcontrato#1"
    accion: "Elija el proyecto, luego **Subcontratos** y el escenario **Subcontrato - De Obra**."
    donde: "Escenario Subcontratos"
    fuente: [img-e3714afd5c39-0000, img-3c91874fc471-0000, web-https-documentacion-s10peru-com-manual-d-s145]
    pagina: null
