prerrequisitos:
  - texto: "Decida la edición de SQL Server que desea instalar."
    fuente: [web-https-documentacion-s10peru-com-proceso--s001]
  - texto: "Revise que se cumpla con los requerimientos de hardware y software necesarios para instalar SQL Server."
    fuente: [web-https-documentacion-s10peru-com-proceso--s001]
  - texto: "De preferencia, cree cuentas para los servicios de SQL Server con privilegios mínimos; no es obligatorio, pero es una buena práctica de seguridad."
    fuente: [web-https-documentacion-s10peru-com-proceso--s001]
  - texto: "La instalación debe ser realizada con el perfil de usuario administrador de Windows; según Microsoft, se recomienda no instalar en el mismo servidor de dominio."
    fuente: [web-https-documentacion-s10peru-com-proceso--s005]
