verificacion:
  - texto: "La línea del cobro aparece en el diario de caja."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s012]
  - texto: "Si adiciona otra transacción, las demás opciones aparecen habilitadas, porque ahora la caja tiene dinero."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s012]
errores_frecuentes:
  - sintoma: "Al adicionar una transacción, solo está habilitada la de documentos por cobrar."
    solucion: "Las demás opciones se habilitan cuando la caja tiene dinero: cuando se hace un cobro en efectivo o en cheque y no se transfiere a una cuenta, la caja tiene dinero y se podrán pagar otros documentos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s012, web-https-documentacion-s10peru-com-manual-d-s019]
