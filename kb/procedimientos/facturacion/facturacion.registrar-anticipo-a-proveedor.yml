id: facturacion.registrar-anticipo-a-proveedor
version: 1
modulo: facturacion
titulo: "Registrar una factura de anticipo de proveedor y su amortización"
objetivo: "Registrar la factura de adelanto que el proveedor emite por un porcentaje de la orden de compra y, cuando llega la mercadería con la segunda factura, relacionarla con el ingreso de almacén, amortizar el anticipo y enlazar todo con una regularización compuesta."
nivel: avanzado
preguntas:
  - "cómo registro la factura de adelanto que me manda el proveedor"
  - "el proveedor me factura el 30% de la orden de compra antes de despachar, como lo registro"
  - "como amortizo el anticipo en la segunda factura"
  - "como relaciono la factura de anticipo con la orden de compra"
  - "el ingreso de almacen se enlazo con la factura del adelanto, como lo desvinculo"
  - "como hago la regularizacion compuesta del anticipo"
  - "factura de antisipo de proveedor en s10 pasos"
  - "pongo el recurso anticipo en negativo? como es"
aliases:
