    id: "facturacion-electronica.dar-de-baja-guia-de-remision#2"
    accion: "Después de ingresar al portal, ubíquese en la opción **Empresas** > **Baja de GRE**."
    fuente: [web-https-documentacion-s10peru-com-portal-d-s005]
    pagina: null
