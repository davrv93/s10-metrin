verificacion:
  - texto: "En la orden de venta original se registra una nota de crédito vinculada a la boleta, que suma el monto de la boleta o boletas, y la orden queda en estado CERRADO POR EL USUARIO."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s002]
  - texto: "La orden de venta nueva pasa de cotización a Orden de Venta, con la boleta vinculada en su cronograma de facturación y en estado PARCIALMENTE FACTURADO."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s002, web-https-documentacion-s10peru-com-cambio-d-s003]
  - texto: "En el módulo administrativo se registra la compensación, en automático, para cancelar las notas de crédito por pagar con las boletas por cobrar."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s003]
errores_frecuentes:
  - sintoma: "No permite hacer el cambio de titular."
    solucion: "Si uno de los abonos cuenta con boleta, los demás abonos también deben estar boleteados; genere los comprobantes faltantes en el escenario Boletaje."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s001]
  - sintoma: "No aparece la opción Generar facturación."
    solucion: "Esta opción se muestra cuando el estado del cambio de titular está aún Pendiente porque no se ha concluido con el flujo."
    fuente: [web-https-documentacion-s10peru-com-cambio-d-s002]
