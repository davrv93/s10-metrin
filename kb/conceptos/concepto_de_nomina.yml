id: concepto_de_nomina
termino: "Concepto (de nómina)"
sinonimos: ["conceptos"]
definicion: "Nombre que se da en el sistema a una norma laboral interpretada o a un beneficio que la empresa otorga al trabajador. Los conceptos forman parte de la plantilla de un tipo de nómina y de la boleta de cada trabajador, donde identifican ingresos, descuentos y aportes."
en_s10: "El catálogo de conceptos genéricos viene por defecto y el usuario solo puede verlo; para agregar conceptos se usa el grupo Configuración, escenario Conceptos. La plantilla, compuesta por conceptos y fórmulas, se asigna al tipo de nómina en el escenario de Procesos."
