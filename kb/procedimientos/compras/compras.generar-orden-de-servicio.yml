id: compras.generar-orden-de-servicio
version: 1
modulo: compras
titulo: "Generar una orden de servicio desde un pedido aprobado"
objetivo: "Generar en el escenario de Pedidos de Compra la Orden de Servicio a partir de un pedido A Compra aprobado, una por cada propietario de los equipos, registrar los precios ofertados por el proveedor y enviarla a aprobación."
nivel: intermedio
