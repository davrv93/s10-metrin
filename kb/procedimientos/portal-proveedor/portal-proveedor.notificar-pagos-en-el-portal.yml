id: portal-proveedor.notificar-pagos-en-el-portal
version: 1
modulo: portal-proveedor
titulo: "Configurar y enviar notificaciones de pago al Portal de Proveedores"
objetivo: "Configurar en el S10 ERP los datos de la empresa, los contactos del proveedor y el módulo Administrativo para que se notifique a los proveedores en el Portal de Proveedores al aprobar una orden de pago y al generar el pago."
nivel: intermedio
preguntas:
  - "como configuro el portal de proveedores en administrativo"
  - "que tengo que activar para que al proveedor le llegue la notificacion de la orden de pago"
  - "donde pongo el monto minimo para notificar pagos a los proveedores"
  - "el proveedor no recibe la notificacion del pago, que falta configurar"
  - "como marco el contacto principal del proveedor para el portal"
  - "cuando se le notifica al proveedor que se le hizo un pago"
  - "no quiero que les llegue notificacion a ningun proveedor, como hago"
  - "como hago q mis proveedores vean sus pagos en el portal"
  - "quien queda como usuario administrador del portal de proveedores"
aliases:
  - "configurar portal de proveedores"
  - "notificar pagos al proveedor"
  - "enviar ordenes de pago al portal"
  - "monto mínimo de notificación"
  - "contacto principal del proveedor"
