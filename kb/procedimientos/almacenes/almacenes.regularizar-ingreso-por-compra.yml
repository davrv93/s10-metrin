  pantallas: ["Ingresos", "Seleccione el Tipo de Documento"]
  objetos: ["guía de remisión", "factura", "documento de pago", "proveedor", "periodo"]
prerrequisitos:
  - texto: "Los recursos deben haber ingresado al almacén con un Ingreso por Compra [IC] respaldado solo con guía de remisión, que luego se regulariza con el documento de pago, la factura."
