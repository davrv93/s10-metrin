verificacion:
  - texto: "La pestaña del asiento contable genera automáticamente el asiento contable del documento, y la pestaña de impuestos muestra el tipo de impuesto aplicado."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s095]
errores_frecuentes:
  - sintoma: "No se genera el asiento contable del documento."
    solucion: "Existen requisitos previos en el módulo de Contabilidad del S10: asignar el esquema contable a la empresa en Datos generales, registrar a los usuarios de la sucursal con permisos, configurar el plan contable y asignar las cuentas contables a los recursos."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s095]
  - sintoma: "No puede eliminar un documento por pagar."
    solucion: "Se elimina un registro existente siempre y cuando no esté pagado o tenga un ingreso al almacén."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s096]
  - sintoma: "Debe registrar el pago de servicios que cada mes le envían para pagarlos."
    solucion: "Realice un registro normal del documento de pago del proveedor y defínalo como plantilla de cargo; luego use **Adicionar desde plantilla de cargo**, que muestra el Catálogo de Plantillas de Cargo para elegirla y efectuar un nuevo registro."
    fuente: [web-https-documentacion-s10peru-com-manual-d-s096, web-https-documentacion-s10peru-com-manual-d-s093, img-409d743378c1-0000]
